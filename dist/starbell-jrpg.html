const Quests = (() => {
  const st = () => Game.state.quests;
  const get = (id) => st()[id];
  // 목표 표시 설정: 2(자세히)면 정확한 목표, 그 외에는 암시만
  const detailed = () => Settings.get('showGoal') >= 2;
  return {
    get,
    stageText: (stg) => (detailed() ? stg.goal : stg.hint || stg.goal),
    status: (id) => (get(id) ? get(id).status : 'none'),
    isActive: (id) => !!get(id) && get(id).status === 'active',
    isDone: (id) => !!get(id) && get(id).status === 'done',
    stage: (id) => (get(id) ? get(id).stage : -1),
    data(id) { const q = get(id); return q ? q.data : {}; },
    start(id) {
      if (get(id)) return false;
      st()[id] = { status: 'active', stage: 0, data: {}, t: Date.now() };
      return true;
    },
    setStage(id, n) { const q = get(id); if (q && q.status === 'active') q.stage = Math.max(q.stage, n); },
    complete(id, outcome) {
      const q = get(id);
      if (!q || q.status === 'done') return null;
      q.status = 'done';
      q.outcome = outcome || null;
      const r = QUESTS[id].reward || {};
      if (r.gold) Game.addGold(r.gold);
      for (const [it, n] of r.items || []) Game.addItem(it, n);
      return r;
    },
    // 현재 목표 텍스트 (진행 수치 포함)
    goal(id) {
      const q = get(id);
      if (!q) return '';
      if (q.status === 'done') return '완료';
      const s = QUESTS[id].stages[Math.min(q.stage, QUESTS[id].stages.length - 1)];
      let t = Quests.stageText(s);
      if (s.count) t += ` (${s.count()}/${s.max})`;
      return t;
    },
    target(id) {
      const q = get(id);
      if (!q || q.status !== 'active') return null;
      const s = QUESTS[id].stages[Math.min(q.stage, QUESTS[id].stages.length - 1)];
      return detailed() ? s.target || null : null;
    },
    // 현재 화면에 띄울 대표 목표 (메인 우선)
    currentGoal() {
      for (const id of ['main1', 'main2', 'main3', 'main4']) if (this.isActive(id)) return { id, text: this.goal(id), target: this.target(id) };
      if (Game.flag('chapter3_done')) return { id: null, text: '자유 탐험 — 다음 이야기를 기다리며 남은 일을 정리해 보자', target: null };
      if (Game.flag('chapter2_done')) return { id: null, text: detailed() ? '마도학원의 오필리아 학장을 찾아가 다음 여정에 대해 듣자' : '왕도에서 쉬는 동안, 학원에서 새 소식이 기다리고 있을지도 모른다', target: detailed() ? { map: 'capital', x: 7, y: 10 } : null };
      if (Game.flag('chapter1_done')) return { id: null, text: detailed() ? '리벨의 하르도 장로에게 작별 인사를 하고 왕도로 떠나자' : '새로운 여정을 앞두고, 마을의 어른께 인사를 드리자', target: detailed() ? { map: 'rivel', x: 18, y: 5 } : null };
      return null;
    },
    list(type) {
      return Object.keys(QUESTS).filter((id) => get(id) && (!type || QUESTS[id].type === type));
    },
    // 전투 처치 기록 연동
    onKill(monsterId) {
      if (monsterId === 'thorn_boar' && this.isActive('s_boar') && this.stage('s_boar') === 0) {
        const d = get('s_boar').data;
        d.kills = (d.kills || 0) + 1;
        if (d.kills >= 5) { this.setStage('s_boar', 1); return '[y]「멧돼지 소동」 가시멧돼지를 5마리 퇴치했다! 오웬에게 보고하자.[/]'; }
      }
      return null;
    },
    // 아이템 획득 연동
    onItem(itemId) {
      if (itemId === 'star_candy' && this.isActive('s_candy') && this.stage('s_candy') === 0 && Game.count('star_candy') >= 3) {
        this.setStage('s_candy', 1);
        return '[y]「축제의 별사탕」 별사탕을 3개 모두 찾았다! 광장의 루나에게 가져가자.[/]';
      }
      if (itemId === 'aria_page' && this.isActive('s_diary') && this.stage('s_diary') === 0 && Game.count('aria_page') >= 3) {
        this.setStage('s_diary', 1);
        return null; // 안내는 일기 장면(Story.ariaPage)에서
      }
      if (itemId === 'veil_book' && this.isActive('s_book') && this.stage('s_book') === 0) {
        this.setStage('s_book', 1);
        return '[y]「사라진 금서」 학원의 사서 펠릭스에게 돌려주자.[/]';
      }
      if (itemId === 'moonherb' && this.isActive('s_herb') && this.stage('s_herb') === 0 && Game.count('moonherb') >= 3) {
        this.setStage('s_herb', 1);
        return '[y]「달빛 풀 채집」 달빛 풀을 3개 모았다! 엘라 할머니에게 가져가자.[/]';
      }
      return null;
    },
  };
})();


// ── src/systems/save.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// Save: localStorage 3슬롯 저장/불러오기 + 데이터 검증
// ─────────────────────────────────────────────────────────────
const Save = (() => {
  const PREFIX = 'starbell-jrpg.save.';
  const SLOTS = 3;
  const VERSION = 1;
  let memory = {}; // localStorage를 쓸 수 없는 환경용 대체 저장소

  function storageGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return memory[k] || null; }
  }
  function storageSet(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { memory[k] = v; return false; }
  }

  function summary() {
    const s = Game.state;
    const map = MAPS[s.pos.map];
    return {
      name: s.heroName,
      level: s.members.hero ? s.members.hero.level : 1,
      place: map ? map.name : '???',
      time: s.playTime,
      party: s.party.slice(),
      date: Date.now(),
      chapter: Game.flag('chapter3_done') ? '제3장 완료' : Game.flag('ch3_started') ? '제3장' : Game.flag('chapter2_done') ? '제2장 완료' : Game.flag('ch2_started') ? '제2장' : Game.flag('chapter1_done') ? '제1장 완료' : '제1장',
    };
  }

  function write(slot) {
    if (!Game.state) return false;
    const data = { v: VERSION, summary: summary(), state: Game.state };
    const ok = storageSet(PREFIX + slot, JSON.stringify(data));
    return ok !== null;
  }

  function readRaw(slot) {
    const raw = storageGet(PREFIX + slot);
    if (!raw) return null;
    try {
      const d = JSON.parse(raw);
      if (!d || typeof d !== 'object' || !d.state) return { corrupt: true };
      return d;
    } catch (e) { return { corrupt: true }; }
  }

  // 저장 데이터 검증 + 누락 필드 보정 (구버전 호환)
  function validate(s) {
    if (!s || typeof s !== 'object') return null;
    const base = (() => { const keep = Game.state; const fresh = Game.newState(s.heroName || '하루'); Game.state = keep; return fresh; })();
    const out = Object.assign({}, base, s);
    for (const k of ['members', 'inv', 'flags', 'quests', 'kills', 'seen', 'known', 'visited']) if (!out[k] || typeof out[k] !== 'object') out[k] = {};
    // 구버전: 「분석」했던 마물은 속성 상성을 모두 아는 것으로 옮겨 적는다
    for (const id in out.seen) if (MONSTERS[id] && !out.known[id]) { out.known[id] = {}; for (const el in ELEMENTS) out.known[id][el] = MONSTERS[id].elem && MONSTERS[id].elem[el] !== undefined ? MONSTERS[id].elem[el] : 1; }
    if (!Array.isArray(out.party)) out.party = ['hero'];
    if (!Array.isArray(out.reserve)) out.reserve = [];
    out.party = out.party.filter((id) => CHARACTERS[id] && out.members[id]);
    out.reserve = out.reserve.filter((id) => CHARACTERS[id] && out.members[id] && !out.party.includes(id));
    if (!out.members.hero) return null;
    if (!out.party.length) out.party = ['hero'];
    for (const id in out.members) {
      const m = out.members[id];
      if (!CHARACTERS[id]) { delete out.members[id]; continue; }
      m.level = Util.clamp(m.level | 0 || 1, 1, MAX_LEVEL);
      m.equip = m.equip || {};
      for (const sl of EQUIP_SLOTS) if (m.equip[sl] && !ITEMS[m.equip[sl]]) m.equip[sl] = null;
      m.status = m.status || {};
      m.skills = Array.isArray(m.skills) ? m.skills.filter((sk) => SKILLS[sk]) : [];
      if (typeof m.hp !== 'number') m.hp = 1;
      if (typeof m.mp !== 'number') m.mp = 0;
    }
    for (const it in out.inv) if (!ITEMS[it] || !(out.inv[it] > 0)) delete out.inv[it];
    out.gold = Util.clamp(out.gold | 0, 0, 999999);
    if (!out.pos || !MAPS[out.pos.map]) out.pos = { map: 'rivel', x: 19, y: 27, dir: 'up' };
    if (!out.respawn || !MAPS[out.respawn.map]) out.respawn = { map: 'shrine', x: 6, y: 6, dir: 'up' };
    return out;
  }

  return {
    SLOTS,
    write,
    info(slot) {
      const d = readRaw(slot);
      if (!d) return null;
      if (d.corrupt) return { corrupt: true };
      return d.summary || { name: '?', level: 1, place: '?', time: 0 };
    },
    any() { for (let i = 1; i <= SLOTS; i++) { const inf = this.info(i); if (inf && !inf.corrupt) return true; } return false; },
    latest() {
      let best = null, slot = 0;
      for (let i = 1; i <= SLOTS; i++) { const inf = this.info(i); if (inf && !inf.corrupt && (!best || inf.date > best.date)) { best = inf; slot = i; } }
      return slot;
    },
    load(slot) {
      const d = readRaw(slot);
      if (!d || d.corrupt) return false;
      const s = validate(d.state);
      if (!s) return false;
      Game.state = s;
      for (const id in s.members) Game.clampMember(id);
      return true;
    },
    remove(slot) { try { localStorage.removeItem(PREFIX + slot); } catch (e) { delete memory[PREFIX + slot]; } },
    validate,
  };
})();


// ── src/systems/battlecore.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// BattleCore: 턴제 전투 규칙 (화면과 분리된 순수 로직)
//  execute()는 상태를 바꾸고 '연출 이벤트' 배열을 돌려준다 → 전투 화면이 순서대로 재생
// ─────────────────────────────────────────────────────────────
const SUFFIX = ['A', 'B', 'C', 'D', 'E', 'F'];

class Actor {
  constructor(side, data) {
    this.side = side;
    this.buffs = {};
    this.defending = false;
    this.coveredBy = null;
    this.taunt = false;
    this.mem = {};
    this.uid = Actor.next++;
    if (side === 'party') {
      this.id = data;
      this.ref = Game.state.members[data];
      this.name = Game.name(data);
    } else {
      const def = MONSTERS[data];
      this.defId = data;
      this.def = def;
      this.name = def.name;
      this.maxhp = def.hp; this._hp = def.hp;
      this.maxmp = def.mp || 0; this._mp = def.mp || 0;
      this._status = {};
      this.elem = Object.assign({}, def.elem || {});
      this.defMod = 1;
      this.stolen = false;
      this.pilfered = 0;
    }
  }
  get isParty() { return this.side === 'party'; }
  get st() { return this.isParty ? Game.stats(this.id) : null; }
  get hp() { return this.isParty ? this.ref.hp : this._hp; }
  set hp(v) { if (this.isParty) this.ref.hp = v; else this._hp = v; }
  get mp() { return this.isParty ? this.ref.mp : this._mp; }
  set mp(v) { if (this.isParty) this.ref.mp = v; else this._mp = v; }
  get mhp() { return this.isParty ? this.st.maxhp : this.maxhp; }
  get mmp() { return this.isParty ? this.st.maxmp : this.maxmp; }
  get status() { return this.isParty ? this.ref.status : this._status; }
  get alive() { return this.hp > 0 && !this.fled; }
  buff(stat) { const b = this.buffs[stat]; return b && b.turns > 0 ? b.mult : 1; }
  buffTurns(stat) { const b = this.buffs[stat]; return b ? b.turns : 0; }
  base(stat) { return this.isParty ? this.st[stat] : this.def[stat]; }
  get atk() { return this.base('atk') * this.buff('atk'); }
  get defense() { return this.base('def') * this.buff('def') * (this.defMod || 1); }
  get mag() { return this.base('mag') * this.buff('mag'); }
  get spd() { return this.base('spd') * this.buff('spd'); }
  get evade() { return (this.isParty ? 0.02 : this.def.evade || 0) + Math.max(0, this.buff('eva') - 1); }
  resist(statusName) {
    if (this.isParty) return (this.st.resist || {})[statusName] || 0;
    return (this.def.resist || {})[statusName] || 0;
  }
  elemMult(el) {
    if (!el) return 1;
    if (this.isParty) return 1;
    return this.elem[el] !== undefined ? this.elem[el] : 1;
  }
  get disabled() { return !!(this.status.sleep || this.status.paralyze); }
  // 도감·상성 기억에 쓰는 ID (신기루는 본체와 같은 마물로 기억한다)
  get knownId() { return this.def ? this.def.knownAs || this.defId : null; }
}
Actor.next = 1;

class BattleCore {
  // 침묵으로 막히는 '주문 계열' 기술인가
  static spellLike(sk) {
    if (sk.kind === 'spell') return true;
    return sk.kind === 'enemy' && ['magic', 'status', 'debuff', 'heal'].includes(sk.type) && !sk.id.startsWith('res') && sk.id !== 'roar';
  }
  constructor(opts) {
    this.opts = opts;
    this.boss = !!opts.boss;
    this.canEscape = opts.canEscape !== false && !opts.boss;
    // opts.party: 일부 동료만 싸우는 전투 (예: 브란의 입단 시험)
    this.party = (opts.party || Game.state.party).map((id) => new Actor('party', id));
    this.enemies = [];
    for (const id of opts.enemies) this.addEnemy(id);
    this.round = 0;
    this.escapeTries = 0;
    this.result = null;
    this.killed = [];
    this.recoveredGold = 0;
    // 수면·마비·침묵은 전투 한정 상태 (독은 전투 밖에서도 유지)
    for (const a of this.party) for (const k of ['sleep', 'paralyze', 'silence']) delete a.status[k];
  }

  addEnemy(id) {
    if (this.enemies.filter((e) => e.alive).length >= 5) return null;
    const a = new Actor('enemy', id);
    this.enemies.push(a);
    this.renameEnemies();
    return a;
  }
  renameEnemies() {
    // 같은 이름끼리 A·B·C (신기루는 본체와 이름이 같아 함께 묶인다)
    const groups = {};
    for (const e of this.enemies) (groups[e.def.name] = groups[e.def.name] || []).push(e);
    for (const nm in groups) {
      const g = groups[nm];
      g.forEach((e, i) => { e.name = g.length > 1 ? `${nm} ${SUFFIX[i] || i + 1}` : nm; });
    }
  }
  get alivePartyList() { return this.party.filter((a) => a.alive); }
  get aliveEnemyList() { return this.enemies.filter((a) => a.alive); }
  foes(a) { return a.isParty ? this.aliveEnemyList : this.alivePartyList; }
  friends(a) { return a.isParty ? this.alivePartyList : this.aliveEnemyList; }

  checkEnd() {
    if (!this.aliveEnemyList.length) this.result = this.result || 'win';
    else if (!this.alivePartyList.length) this.result = 'lose';
    return this.result;
  }

  // ── 행동 순서 ──
  // cmds: Map(actor → {kind:'attack'|'skill'|'item'|'defend', skill, item, target})
  buildOrder(cmds, opts = {}) {
    this.round++;
    const list = [];
    if (cmds) for (const [actor, cmd] of cmds) {
      if (cmd.kind === 'defend') { actor.defending = true; }
      const sk = cmd.kind === 'skill' ? SKILLS[cmd.skill] : null;
      const prio = cmd.kind === 'defend' ? 3 : sk && sk.priority ? 2 : 0;
      list.push({ actor, cmd, prio, speed: actor.spd * Util.randRange(0.75, 1.25) });
    }
    if (opts.enemiesAct !== false) {
      for (const e of this.aliveEnemyList) {
        const extra = e.def.extraActions ? e.def.extraActions(e) : 0;
        for (let k = 0; k <= extra; k++) list.push({ actor: e, cmd: null, prio: 0, speed: e.spd * Util.randRange(0.75, 1.25) - k * 50 });
      }
    }
    list.sort((a, b) => b.prio - a.prio || b.speed - a.speed);
    return list;
  }

  // ── 대상 선택 도우미 (AI) ──
  pickTarget(side, mode = 'random') {
    const pool = side === 'party' ? this.alivePartyList : this.aliveEnemyList;
    if (!pool.length) return null;
    const taunter = pool.find((a) => a.taunt && !a.disabled);
    if (taunter && Util.chance(0.7)) return taunter;
    if (mode === 'fragile') return pool.slice().sort((a, b) => a.defense * Math.sqrt(a.hp) - b.defense * Math.sqrt(b.hp))[0];
    if (mode === 'weakest') return pool.slice().sort((a, b) => a.hp / a.mhp - b.hp / b.mhp)[0];
    return Util.pick(pool);
  }

  chooseEnemyAction(e) {
    if (e.def.ai) {
      const r = e.def.ai(e, this) || { skill: 'attack' };
      return r;
    }
    const opts = (e.def.actions || [{ s: 'attack', w: 1 }]).filter((a) => {
      const sk = SKILLS[a.s];
      if (e.status.silence && BattleCore.spellLike(sk)) return false;
      if (sk.type === 'heal' && e.hp >= e.mhp * 0.7) return false;
      return true;
    });
    const pick = Util.weighted(opts.length ? opts : [{ s: 'attack', w: 1 }]);
    return { skill: pick.s };
  }

  // ── 실행 ──
  execute(entry) {
    const a = entry.actor;
    const ev = [];
    if (!a.alive || this.result) return ev;
    if (a.status.sleep) { ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} 잠들어 있다… Zzz` }); return ev; }
    if (a.status.paralyze) { ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} 몸이 마비되어 움직일 수 없다!` }); return ev; }

    if (!a.isParty) {
      const act = this.chooseEnemyAction(a);
      let sk = SKILLS[act.skill] || SKILLS.attack;
      if (a.status.silence && BattleCore.spellLike(sk)) {
        ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} 주문을 외우려 했지만 봉인되어 있다! 대신 달려든다!` });
        sk = SKILLS.attack;
      }
      const targets = this.resolveTargets(a, sk, act.target);
      if (!targets.length || !targets[0]) return ev;
      return ev.concat(this.useSkill(a, sk, targets, null));
    }
    const cmd = entry.cmd;
    if (cmd.kind === 'defend') { ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} 몸을 지키고 있다.` }); return ev; }
    if (cmd.kind === 'attack') return ev.concat(this.useSkill(a, SKILLS.attack, this.resolveTargets(a, SKILLS.attack, cmd.target), null));
    if (cmd.kind === 'skill') {
      const sk = SKILLS[cmd.skill];
      if (sk.kind === 'spell' && a.status.silence) { ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} ${sk.name}${Util.josa(sk.name, '을')} 외우려 했지만, 입이 봉인되어 소리가 나지 않는다!` }); return ev; }
      if ((sk.mp || 0) > a.mp) { ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} ${sk.name}${Util.josa(sk.name, '을')} 쓰려 했지만 MP가 부족하다!` }); return ev; }
      const targets = this.resolveTargets(a, sk, cmd.target);
      if (!targets.length) { ev.push({ type: 'msg', text: `${a.name}의 ${sk.name}! …그러나 대상이 없다.` }); return ev; }
      if (sk.mp) { a.mp -= sk.mp; ev.push({ type: 'mp', target: a, mpAfter: a.mp }); }
      return ev.concat(this.useSkill(a, sk, targets, null));
    }
    if (cmd.kind === 'item') {
      const it = ITEMS[cmd.item];
      if (!it || Game.count(cmd.item) <= 0) { ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} 도구를 꺼내려 했지만… 이미 남아 있지 않았다!` }); return ev; }
      const fake = Object.assign({ name: it.name, kind: 'item' }, it.use);
      const targets = this.resolveTargets(a, fake, cmd.target);
      if (!targets.length) { ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} ${it.name}${Util.josa(it.name, '을')} 썼다! …그러나 효과가 없었다.` }); Game.removeItem(cmd.item); return ev; }
      Game.removeItem(cmd.item);
      return ev.concat(this.useSkill(a, fake, targets, it));
    }
    return ev;
  }

  // 대상 확정 (죽은 대상이면 다시 고른다)
  resolveTargets(a, sk, want) {
    const t = sk.target;
    if (t === 'self') return [a];
    if (t === 'none') return [a];
    if (t === 'enemies') return this.foes(a);
    if (t === 'allies') return this.friends(a);
    if (t === 'deadAlly') {
      const pool = (a.isParty ? this.party : this.enemies).filter((x) => !x.alive && !x.fled);
      if (want && pool.includes(want)) return [want];
      return pool.length ? [pool[0]] : [];
    }
    if (t === 'ally' || t === 'allyOther') {
      const pool = this.friends(a).filter((x) => t !== 'allyOther' || x !== a);
      if (want && pool.includes(want)) return [want];
      if (!pool.length) return [];
      if (sk.type === 'heal') return [pool.slice().sort((x, y) => x.hp / x.mhp - y.hp / y.mhp)[0]];
      return [want && want.alive ? want : Util.pick(pool)];
    }
    // 단일 적
    const pool = this.foes(a);
    if (want && pool.includes(want)) return [want];
    if (!pool.length) return [];
    if (!a.isParty) return [this.pickTarget('party')];
    return [Util.pick(pool)];
  }

  useMsg(a, sk, targets, item) {
    if (item) return `${a.name}${Util.josa(a.name, '은')} ${item.name}${Util.josa(item.name, '을')} 사용했다!`;
    if (sk.msg) return Util.fill(sk.msg, { A: a.name, T: targets[0] ? targets[0].name : '' });
    if (sk.id === 'attack') return `${a.name}의 공격!`;
    if (sk.kind === 'spell') return `${a.name}${Util.josa(a.name, '은')} ${sk.name}의 주문을 외웠다!`;
    return `${a.name}의 ${sk.name}!`;
  }

  useSkill(a, sk, targets, item) {
    const ev = [];
    ev.push({ type: 'msg', text: this.useMsg(a, sk, targets, item) });
    const anim = sk.anim || (item ? { heal: 'heal', mp: 'heal', full: 'heal', revive: 'heal', cure: 'heal' }[sk.type] : null);
    if (anim && !['physical', 'drain'].includes(sk.type)) ev.push({ type: 'anim', name: anim, targets, user: a });
    const multi = targets.length > 1;
    switch (sk.type) {
      case 'physical':
      case 'drain': {
        const hits = sk.hits || 1;
        for (let h = 0; h < hits; h++) {
          let list = targets;
          if (sk.randomTargets) { const pool = this.foes(a); if (!pool.length) break; list = [Util.pick(pool)]; }
          for (let t of list) {
            if (!t.alive) { const pool = this.foes(a); if (!pool.length) break; t = Util.pick(pool); }
            // 감싸기
            if (!a.isParty && !multi && t.coveredBy && t.coveredBy.alive && !t.coveredBy.disabled && t.coveredBy !== t) {
              ev.push({ type: 'msg', text: `${t.coveredBy.name}${Util.josa(t.coveredBy.name, '이')} ${t.name}${Util.josa(t.name, '을')} 감싸며 대신 막아섰다!` });
              t = t.coveredBy;
            }
            ev.push(...this.physicalHit(a, t, sk));
            if (this.checkEnd()) return ev;
          }
        }
        break;
      }
      case 'magic':
      case 'damage':
        for (const t of targets) { if (t.alive) ev.push(...this.magicHit(a, t, sk)); }
        if (sk.debuffAll) {
          for (const t of targets) {
            if (!t.alive) continue;
            for (const k in sk.debuffAll) t.buffs[k] = { mult: sk.debuffAll[k], turns: 3 };
            ev.push({ type: 'buff', target: t, up: false });
          }
          ev.push({ type: 'msg', text: `모래가 눈에 들어가 ${BUFF_NAMES[Object.keys(sk.debuffAll)[0]]}${Util.josa(BUFF_NAMES[Object.keys(sk.debuffAll)[0]], '이')} 떨어졌다!` });
        }
        break;
      case 'heal': {
        for (const t of targets) {
          if (!t.alive) continue;
          const bonus = a.isParty ? 1 + (a.st.healBonus || 0) : 1;
          const amt = sk.amount ? sk.amount : Math.round((sk.power + a.mag * (sk.scale || 0)) * bonus * Util.randRange(0.95, 1.05));
          const before = t.hp;
          t.hp = Math.min(t.mhp, t.hp + amt);
          ev.push({ type: 'heal', target: t, amount: t.hp - before, hpAfter: t.hp });
          ev.push({ type: 'msg', text: `${t.name}의 HP가 ${t.hp - before} 회복되었다!` });
          if (sk.regenAfter) t.buffs.regen = { mult: 1.08, turns: sk.regenAfter };
        }
        if (sk.regenAfter) ev.push({ type: 'msg', text: '부드러운 노랫소리가 일행을 감싸 안았다…' });
        break;
      }
      case 'mp':
        for (const t of targets) {
          const before = t.mp;
          t.mp = Math.min(t.mmp, t.mp + sk.amount);
          ev.push({ type: 'mp', target: t, mpAfter: t.mp, gain: t.mp - before });
          ev.push({ type: 'msg', text: `${t.name}의 MP가 ${t.mp - before} 회복되었다!` });
        }
        break;
      case 'full':
        for (const t of targets) {
          t.hp = t.mhp; t.mp = t.mmp;
          ev.push({ type: 'heal', target: t, amount: t.mhp, hpAfter: t.hp });
          ev.push({ type: 'mp', target: t, mpAfter: t.mp });
          ev.push({ type: 'msg', text: `${t.name}의 HP와 MP가 모두 회복되었다!` });
        }
        break;
      case 'revive':
        for (const t of targets) {
          if (t.alive) { ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '은')} 쓰러져 있지 않다.` }); continue; }
          t.hp = Math.max(1, Math.round(t.mhp * sk.pct));
          for (const k in t.status) delete t.status[k];
          t.buffs = {};
          ev.push({ type: 'revive', target: t, hpAfter: t.hp });
          ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '이')} 되살아났다!` });
        }
        break;
      case 'cure':
        for (const t of targets) {
          const cured = (sk.cures || []).filter((s) => t.status[s]);
          for (const s of cured) delete t.status[s];
          if (cured.length) { ev.push({ type: 'status', target: t }); ev.push({ type: 'msg', text: `${t.name}의 ${cured.map((s) => STATUS_NAMES[s]).join('·')} 상태가 나았다!` }); }
          else ev.push({ type: 'msg', text: `${t.name}에게는 아무 효과도 없었다.` });
        }
        break;
      case 'buff':
        for (const t of targets) {
          for (const k in sk.buff) t.buffs[k] = { mult: sk.buff[k], turns: sk.turns || 3 };
          if (sk.taunt) t.taunt = true;
          ev.push({ type: 'buff', target: t, up: true });
          for (const k in sk.buff) {
            if (k === 'regen') ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '은')} 생명의 물결에 감싸였다!` });
            else ev.push({ type: 'msg', text: `${t.name}의 ${BUFF_NAMES[k]}${Util.josa(BUFF_NAMES[k], '이')} ${sk.buff[k] >= 1.6 ? '크게 ' : ''}올랐다!` });
          }
        }
        break;
      case 'debuff':
        for (const t of targets) {
          if (!t.alive) continue;
          let chance = sk.chance !== undefined ? sk.chance : 0.8;
          if (!t.isParty && t.def.boss) chance *= 0.5;
          if (Util.chance(chance)) {
            for (const k in sk.buff) t.buffs[k] = { mult: sk.buff[k], turns: sk.turns || 3 };
            ev.push({ type: 'buff', target: t, up: false });
            for (const k in sk.buff) ev.push({ type: 'msg', text: `${t.name}의 ${BUFF_NAMES[k]}${Util.josa(BUFF_NAMES[k], '이')} 떨어졌다!` });
          } else ev.push({ type: 'msg', text: `${t.name}에게는 효과가 없었다.` });
        }
        break;
      case 'status':
        for (const t of targets) { if (t.alive) ev.push(...this.inflict(t, sk.status, true)); }
        break;
      case 'analyze':
        for (const t of targets) if (t.alive) ev.push(...this.analyze(t));
        break;
      case 'steal':
        ev.push(...this.trySteal(a, targets[0]));
        break;
      case 'coverAll': {
        for (const t of this.friends(a)) if (t !== a) t.coveredBy = a;
        a.buffs.def = { mult: 1.5, turns: 1 };
        ev.push({ type: 'buff', target: a, up: true });
        ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} 방패를 세우고 동료들 앞을 가로막았다!` });
        break;
      }
      case 'cover': {
        const t = targets[0];
        t.coveredBy = a;
        ev.push({ type: 'buff', target: t, up: true });
        ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} ${t.name}의 앞을 막아섰다!` });
        break;
      }
      case 'pilfer': {
        const t = targets[0];
        if (!t || !t.alive) break;
        const amt = Math.min(Game.gold, Util.randInt(6, 18));
        if (amt <= 0 || Util.chance(0.35)) { ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '은')} 재빨리 몸을 피했다!` }); break; }
        Game.addGold(-amt);
        a.pilfered += amt;
        ev.push({ type: 'sfx', name: 'steal' });
        ev.push({ type: 'msg', text: `[r]${amt}G[/]를 도둑맞았다! (쓰러뜨리면 되찾을 수 있다)` });
        break;
      }
      case 'charge': {
        a.charging = sk.next;
        ev.push({ type: 'sfx', name: 'charge' });
        if (sk.buffSelf) { for (const k in sk.buffSelf) a.buffs[k] = { mult: sk.buffSelf[k], turns: 2 }; ev.push({ type: 'buff', target: a, up: true }); }
        if (sk.hint) ev.push({ type: 'msg', text: sk.hint });
        break;
      }
      case 'summon': {
        const added = [];
        for (const id of sk.summon) { const n = this.addEnemy(id); if (n) { added.push(n); if (n.def.mirage) n.mirrorOf = a; } }
        // 신기루: 본체와 섞여 어느 쪽이 진짜인지 모르게 자리를 뒤섞는다
        if (sk.shuffle && added.length) { Util.shuffle(this.enemies); this.renameEnemies(); }
        if (added.length) { ev.push({ type: 'sfx', name: a.defId === 'ironfang' ? 'roar' : 'summon' }); ev.push({ type: 'summon', actors: added }); }
        else ev.push({ type: 'msg', text: '…그러나 아무것도 나타나지 않았다.' });
        break;
      }
      case 'absorb': {
        const echoes = this.aliveEnemyList.filter((e) => e.defId === 'shadow_echo');
        if (!echoes.length) { ev.push({ type: 'msg', text: '…그러나 흡수할 그림자가 없다!' }); break; }
        let healed = 0;
        for (const e of echoes) { e.hp = 0; e.absorbed = true; ev.push({ type: 'die', target: e, silent: true }); healed += 110; }
        const before = a.hp;
        a.hp = Math.min(a.mhp, a.hp + healed);
        ev.push({ type: 'heal', target: a, amount: a.hp - before, hpAfter: a.hp });
        ev.push({ type: 'msg', text: `${a.name}의 HP가 ${a.hp - before} 회복되었다! [y](…그림자 잔향이 곁에 있는 한, 같은 일이 되풀이될 것이다)[/]` });
        break;
      }
      case 'flee': {
        a.fled = true;
        ev.push({ type: 'flee', target: a });
        break;
      }
    }
    if (!a.isParty && a.charging && sk.type !== 'charge') a.charging = null;
    if (sk.type === 'physical' && sk.debuff) { /* peck 등은 physicalHit 안에서 처리 */ }
    this.checkEnd();
    return ev;
  }

  physicalHit(a, t, sk) {
    const ev = [];
    let hitChance = (0.95 + (sk.hit || 0)) * a.buff('hit') * (1 - t.evade);
    if (t.disabled) hitChance = 1;
    if (!Util.chance(hitChance)) {
      ev.push({ type: 'anim', name: 'slash', targets: [t], user: a, miss: true });
      ev.push({ type: 'miss', target: t });
      ev.push({ type: 'msg', text: `그러나 ${t.name}${Util.josa(t.name, '은')} 재빨리 피했다!` });
      return ev;
    }
    const critChance = 0.04 + (sk.crit || 0) + (a.isParty && a.id === 'nell' ? 0.06 : 0);
    const crit = a.isParty ? Util.chance(critChance) : !a.def.boss && Util.chance(0.02);
    const atk = a.atk, def = t.defense;
    let dmg;
    if (crit) dmg = atk * 1.5;
    else if (!t.isParty && t.def.shiny) dmg = Util.randInt(0, 1);
    else dmg = (atk * atk) / (atk + def);
    const element = sk.element || (sk.id === 'attack' && a.isParty ? a.st.element : null);
    const em = t.elemMult(element);
    if (!(t.def && t.def.shiny && !crit)) dmg *= (sk.mult || 1) * Util.randRange(0.88, 1.12) * em;
    if (t.defending) dmg *= 0.5;
    const bm = this.barrierMult(t);
    dmg *= bm;
    dmg = Math.max(t.def && t.def.shiny && !crit ? 0 : 1, Math.round(dmg));
    ev.push({ type: 'anim', name: sk.anim || 'slash', targets: [t], user: a, crit });
    if (crit) ev.push({ type: 'msg', text: a.isParty ? '[y]회심의 일격![/]' : '[r]통한의 일격![/]' });
    ev.push(...this.discover(t, element, em));
    ev.push(...this.damage(t, dmg, { crit, em, physical: true, from: a, barrier: bm < 1 }));
    if (sk.steal && a.isParty && t.def.steal && !t.stolen) ev.push(...this.trySteal(a, t));
    if (sk.type === 'drain' && dmg > 0) {
      const before = a.hp; a.hp = Math.min(a.mhp, a.hp + Math.round(dmg * 0.6));
      if (a.hp > before) { ev.push({ type: 'heal', target: a, amount: a.hp - before, hpAfter: a.hp }); ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} HP를 ${a.hp - before} 빨아들였다!` }); }
    }
    if (t.alive) {
      if (sk.status) ev.push(...this.inflict(t, sk.status, false));
      if (sk.id === 'attack' && a.isParty && a.st.onHit) ev.push(...this.inflict(t, a.st.onHit, false));
      if (sk.debuff && Util.chance(sk.debuff.chance || 0.3)) {
        t.buffs.def = { mult: sk.debuff.def, turns: sk.debuff.turns || 3 };
        ev.push({ type: 'buff', target: t, up: false });
        ev.push({ type: 'msg', text: `${t.name}의 방어력이 떨어졌다!` });
      }
      if (t.status.sleep && Util.chance(0.5)) { delete t.status.sleep; ev.push({ type: 'status', target: t }); ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '은')} 충격으로 잠에서 깼다!` }); }
    }
    return ev;
  }

  trySteal(a, t) {
    const ev = [];
    const st = t.def.steal;
    if (!st || t.stolen) { ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '은')} 훔칠 만한 것을 갖고 있지 않다.` }); return ev; }
    const chance = Util.clamp(0.45 + (a.spd - t.spd) * 0.012, 0.2, 0.9) * (st.p >= 0.3 ? 1 : 0.7);
    if (Util.chance(chance)) {
      t.stolen = true;
      Game.addItem(st.item, 1);
      ev.push({ type: 'sfx', name: 'steal' });
      ev.push({ type: 'msg', text: `[y]${ITEMS[st.item].name}[/]${Util.josa(ITEMS[st.item].name, '을')} 훔쳐 냈다!` });
    } else ev.push({ type: 'msg', text: '그러나 훔치지 못했다!' });
    return ev;
  }

  // 수호 결계: 보스를 지키는 하수인이 살아 있으면 받는 피해가 줄어든다
  barrierMult(t) {
    if (t.isParty || !t.def.barrier) return 1;
    return t.def.barrier(t, this) ? 0.5 : 1;
  }

  magicHit(a, t, sk) {
    const ev = [];
    const em = t.elemMult(sk.element);
    const bm = this.barrierMult(t);
    let dmg = (sk.power + (sk.type === 'damage' ? 0 : a.mag * (sk.scale || 0))) * Util.randRange(0.92, 1.08) * em * bm;
    if (t.defending) dmg *= 0.5;
    dmg = Math.round(dmg);
    ev.push(...this.discover(t, sk.element, em));
    if (em === 0) { ev.push({ type: 'msg', text: `${t.name}에게는 ${ELEMENTS[sk.element] || ''} 속성이 전혀 통하지 않는다!` }); ev.push({ type: 'miss', target: t }); return ev; }
    dmg = Math.max(1, dmg);
    ev.push(...this.damage(t, dmg, { em, from: a, barrier: bm < 1 }));
    if (t.alive && sk.status) ev.push(...this.inflict(t, sk.status, false));
    return ev;
  }

  damage(t, dmg, info = {}) {
    const ev = [];
    // 신기루는 맞는 순간 흩어진다
    if (!t.isParty && t.def.mirage) return this.dispelMirage(t, '공격이 그대로 통과했다…');
    t.hp = Math.max(0, t.hp - dmg);
    ev.push({ type: 'damage', target: t, amount: dmg, crit: info.crit, weak: info.em > 1, resist: info.em < 1, hpAfter: t.hp });
    let txt = t.isParty ? `${t.name}${Util.josa(t.name, '은')} [r]${dmg}[/]의 피해를 입었다!` : `${t.name}에게 [y]${dmg}[/]의 피해!`;
    if (info.em > 1) txt += ' [y]약점을 찔렀다![/]';
    else if (info.em < 1 && info.em > 0) txt += ' [d](잘 통하지 않는다)[/]';
    if (info.barrier) txt += ' [b](결계가 피해를 줄였다)[/]';
    ev.push({ type: 'msg', text: txt });
    if (t.hp <= 0) ev.push(...this.kill(t));
    else if (!t.isParty && t.def.phases) ev.push(...this.checkPhases(t));
    return ev;
  }

  dispelMirage(t, why) {
    t._hp = 0; t.buffs = {}; t.charging = null;
    return [{ type: 'die', target: t }, { type: 'msg', text: `${why} [y]${t.name}${Util.josa(t.name, '은')} 신기루였다![/] 모래가 되어 흩어졌다.` }];
  }

  kill(t) {
    const ev = [];
    t.hp = 0;
    t.buffs = {};
    t.charging = null;
    if (t.isParty) {
      for (const k of ['sleep', 'paralyze', 'silence', 'poison']) delete t.status[k];
      ev.push({ type: 'die', target: t });
      ev.push({ type: 'msg', text: `[r]${t.name}${Util.josa(t.name, '은')} 쓰러졌다…[/]` });
    } else {
      this.killed.push(t);
      for (const m of this.enemies) if (m.mirrorOf === t && m.alive) { m._hp = 0; ev.push({ type: 'die', target: m, silent: true }); }
      if (t.pilfered) { Game.addGold(t.pilfered); this.recoveredGold += t.pilfered; }
      ev.push({ type: 'die', target: t });
      ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '을')} 쓰러뜨렸다!` + (t.pilfered ? ` [y](${t.pilfered}G를 되찾았다)[/]` : '') });
    }
    return ev;
  }

  checkPhases(t) {
    const ev = [];
    for (const ph of t.def.phases) {
      if (t.mem['phase_' + ph.key]) continue;
      if (t.hp / t.mhp <= ph.below) {
        t.mem['phase_' + ph.key] = true;
        ev.push({ type: 'phase', target: t, variant: 2 });
        ev.push(...t.def.onPhase(t, this, ph.key));
      }
    }
    return ev;
  }

  inflict(t, statusMap, verbose) {
    const ev = [];
    for (const s in statusMap) {
      if (t.status[s]) { if (verbose) ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '은')} 이미 ${STATUS_NAMES[s]} 상태다.` }); continue; }
      const res = t.resist(s);
      if (res >= 1) { if (verbose) ev.push({ type: 'msg', text: `${t.name}에게는 ${STATUS_NAMES[s]}${Util.josa(STATUS_NAMES[s], '이')} 통하지 않는다!` }); continue; }
      if (!Util.chance(statusMap[s] * (1 - res))) { if (verbose) ev.push({ type: 'msg', text: `${t.name}에게는 효과가 없었다.` }); continue; }
      t.status[s] = s === 'poison' ? 1 : s === 'sleep' ? Util.randInt(2, 4) : s === 'paralyze' ? Util.randInt(1, 3) : Util.randInt(3, 4);
      ev.push({ type: 'status', target: t, status: s, on: true });
      const msg = { poison: '독에 걸렸다!', sleep: '잠들어 버렸다!', paralyze: '몸이 마비되었다!', silence: '주문이 봉인되었다!' }[s];
      ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '은')} ${msg}` });
    }
    return ev;
  }

  // 속성 상성이 드러나면 도감에 영구 기록 (다음에 만나도 표시된다)
  discover(t, el, em) {
    if (t.isParty || !el || !ELEMENTS[el]) return [];
    if (!Game.learnElem(t.knownId, el, em) || em === 1) return [];
    const kind = em > 1 ? '약점' : em === 0 ? '무효' : '내성';
    return [{ type: 'msg', text: `[g]〈기억〉 ${t.def.name}의 ${kind}: ${ELEMENTS[el]}[/]`, quick: true }];
  }

  analyze(t) {
    const ev = [];
    const d = t.def;
    if (d.mirage) { ev.push({ type: 'analyze', target: t }); return ev.concat(this.dispelMirage(t, '이방인의 눈이 아지랑이를 꿰뚫었다!')); }
    Game.state.seen[t.knownId] = true;
    for (const k in ELEMENTS) Game.learnElem(t.knownId, k, t.elemMult(k));
    const weak = [], res = [], immune = [];
    for (const k in ELEMENTS) {
      const m = t.elemMult(k);
      if (m > 1) weak.push(ELEMENTS[k]); else if (m === 0) immune.push(ELEMENTS[k]); else if (m < 1) res.push(ELEMENTS[k]);
    }
    const sres = Object.keys(d.resist || {}).filter((k) => d.resist[k] >= 1).map((k) => STATUS_NAMES[k]);
    ev.push({ type: 'analyze', target: t });
    ev.push({ type: 'msg', text: `[b]【${t.name}】[/] HP ${t.hp}/${t.mhp} · 공격 ${Math.round(t.atk)} · 방어 ${Math.round(t.defense)}` });
    ev.push({ type: 'msg', text: `약점: [y]${weak.join('·') || '없음'}[/]  내성: ${res.join('·') || '없음'}${immune.length ? `  무효: ${immune.join('·')}` : ''}${sres.length ? `  상태이상 무효: ${sres.join('·')}` : ''}` });
    ev.push({ type: 'msg', text: `[d]${d.desc}[/]` });
    return ev;
  }

  // 라운드 종료 처리
  endRound() {
    const ev = [];
    for (const a of [...this.party, ...this.enemies]) {
      if (!a.alive) continue;
      a.defending = false; a.coveredBy = null; a.taunt = false;
      if (a.status.poison) {
        let dmg = Math.max(1, Math.round(a.mhp * (a.isParty ? 0.06 : 0.08)));
        if (!a.isParty && a.def.boss) dmg = Math.min(dmg, 30);
        if (a.isParty) dmg = Math.min(dmg, a.hp - 1);
        if (dmg > 0) {
          a.hp -= dmg;
          ev.push({ type: 'damage', target: a, amount: dmg, poison: true, hpAfter: a.hp });
          ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} 독으로 [p]${dmg}[/]의 피해를 입었다!` });
          if (a.hp <= 0) ev.push(...this.kill(a));
        }
      }
      for (const s of ['sleep', 'paralyze', 'silence']) {
        if (!a.status[s]) continue;
        a.status[s]--;
        const wake = s === 'sleep' && Util.chance(0.25);
        if (a.status[s] <= 0 || wake) {
          delete a.status[s];
          ev.push({ type: 'status', target: a });
          ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} ${{ sleep: '잠에서 깨어났다!', paralyze: '마비가 풀렸다!', silence: '다시 주문을 외울 수 있게 되었다!' }[s]}` });
        }
      }
      if (a.buffs.regen && a.buffs.regen.turns > 0 && a.hp < a.mhp) {
        const before = a.hp;
        a.hp = Math.min(a.mhp, a.hp + Math.max(1, Math.round(a.mhp * (a.buffs.regen.mult - 1))));
        ev.push({ type: 'heal', target: a, amount: a.hp - before, hpAfter: a.hp });
        ev.push({ type: 'msg', text: `${a.name}의 HP가 ${a.hp - before} 회복되었다. [g](생명의 물결)[/]` });
      }
      for (const k in a.buffs) {
        const b = a.buffs[k];
        if (b.turns >= 99) continue;
        b.turns--;
        if (b.turns <= 0) {
          delete a.buffs[k];
          ev.push({ type: 'buff', target: a, reset: true });
          ev.push({ type: 'msg', text: `${a.name}의 ${BUFF_NAMES[k]}${Util.josa(BUFF_NAMES[k], '이')} 원래대로 돌아왔다.` });
        }
      }
    }
    this.checkEnd();
    return ev;
  }

  tryEscape() {
    if (!this.canEscape) return { ok: false, impossible: true };
    const ps = this.alivePartyList, es = this.aliveEnemyList;
    const avg = (l) => l.reduce((n, a) => n + a.spd, 0) / Math.max(1, l.length);
    const chance = Util.clamp(0.55 + (avg(ps) - avg(es)) * 0.02 + this.escapeTries * 0.15, 0.3, 0.95);
    this.escapeTries++;
    const ok = Util.chance(chance);
    if (ok) this.result = 'escape';
    return { ok };
  }

  // 승리 보상: 경험치·골드·드롭 적용, 레벨업 목록 반환
  rewards() {
    let exp = 0, gold = 0;
    const drops = [];
    for (const e of this.killed) {
      if (e.absorbed) continue;
      exp += e.def.exp; gold += e.def.gold;
      for (const d of e.def.drops || []) if (Util.chance(d.p)) { drops.push(d.item); break; }
      Game.state.kills[e.defId] = (Game.state.kills[e.defId] || 0) + 1;
    }
    Game.addGold(gold);
    for (const it of drops) Game.addItem(it, 1);
    const ups = [];
    // 싸운 동료는 전부, 싸우지 않은 동료(대기·일대일 승부의 관전자)는 절반
    const fighters = this.party.map((a) => a.id);
    for (const id of fighters) if (Game.state.members[id].hp > 0) ups.push(...Game.addExp(id, exp));
    for (const id of Game.state.party.concat(Game.state.reserve)) if (!fighters.includes(id)) ups.push(...Game.addExp(id, Math.floor(exp / 2)));
    const questMsgs = [];
    for (const e of this.killed) { const m = Quests.onKill(e.defId); if (m) questMsgs.push(m); }
    return { exp, gold, drops, ups, questMsgs };
  }
}

// 맵 레지스트리
//  각 맵: { name, kind(town|interior|field|dungeon), bgm, base, tiles[], enc, edge, warps[], npcs[], objects[], triggers[], tileFlags[], onEnter }
// ─────────────────────────────────────────────────────────────
const MAPS = {};
function defMap(id, def) {
  def.id = id;
  const w = def.tiles[0].length;
  def.tiles.forEach((r, i) => { if (r.length !== w) console.error(`[map ${id}] row ${i} width ${r.length} != ${w}`); });
  def.w = w; def.h = def.tiles.length;
  def.warps = def.warps || [];
  def.npcs = def.npcs || [];
  def.objects = def.objects || [];
  def.triggers = def.triggers || [];
  def.tileFlags = def.tileFlags || [];
  MAPS[id] = def;
  return def;
}

// 대사 진행도 분기 도우미: byP({0:'…', 3:'…'}) → 현재 진행도 이하 중 가장 큰 키
function byP(table) {
  const p = Game.progress();
  let best = null;
  for (const k of Object.keys(table).map(Number).sort((a, b) => a - b)) if (k <= p) best = table[k];
  return best;
}

  // ── 별조각 수집가 피포 ──
  async pippo() {
    if (!Quests.get('s_star')) {
      await S.say('수집가 피포', ['오오! 그대들, 혹시 「별조각」을 본 적 있나? 밤하늘에서 떨어진 작은 별의 파편이지!', '나는 세상의 별조각을 모두 모으는 게 꿈이라네! 모두 여덟 개가 이 근방에 떨어졌다는 계산이 나왔지.', '찾아오면 내 소장품과 바꿔 주겠네. 2개, 4개, 6개, 그리고 8개! 놀라운 보물이 기다리고 있다고!']);
      await S.startQuest('s_star');
    }
    // 우산 개그
    if (Game.count('umbrella') > 0 && !Game.flag('umbrella_traded')) {
      await S.say('수집가 피포', ['자, 잠깐! 그 가방 속의 물건은…! 접었다 폈다 하는 휴대용 지붕?!', '이세계의 유물이로군!! 내 「은방울 머리꽂이」와 바꾸지 않겠나?!']);
      if (await S.yesno('수집가 피포', '바꾸겠나?!')) {
        Game.removeItem('umbrella');
        Game.setFlag('umbrella_traded');
        await S.say('수집가 피포', '오오오… 이 투명한 막! 이 버튼! 누르면 펼쳐지다니! 가보로 삼겠네!');
        await S.give('hairpin', 1);
      }
    }
    const have = Game.count('star');
    if (have > 0) {
      Game.removeItem('star', have);
      const before = Game.state.starsGiven;
      Game.state.starsGiven += have;
      Sound.sfx('chime');
      await S.say('수집가 피포', `오오! 별조각을 ${have}개나! 이제 내 수집품은 모두 ${Game.state.starsGiven}개라네!`);
      const tiers = [[2, 'starwater'], [4, 'power_ring'], [6, 'sage_robe'], [8, 'star_blade']];
      for (const [n, item] of tiers) {
        if (before < n && Game.state.starsGiven >= n) {
          await S.say('수집가 피포', `${n}개를 모은 기념이라네! 받게나!`);
          await S.give(item, 1);
        }
      }
      if (Game.state.starsGiven >= 8) {
        await S.say('수집가 피포', ['여덟 개 전부… 드디어 완성이야! 이 별조각들을 모으니 밤하늘의 별자리가 하나 생기는군!', '…「종」 모양이로구먼. 묘한 우연이야.']);
        await S.completeQuest('s_star');
      }
      return;
    }
    const n = Game.state.starsGiven;
    await S.say('수집가 피포', n >= 8 ? '그대들 덕분에 내 꿈이 이루어졌네! 이제 다른 세계의 별조각도 모아 볼까…' : `지금까지 모은 별조각은 ${n}개. 마을의 술통 속, 꽃밭, 숲속 깊은 곳, 유적… 별은 어디에나 떨어진다네!`);
  },

    await Story.beginChapter2(true);
    if (await S.yesno(null, '여기까지의 모험을 기록할까요?')) await Menu.saveScreen();
  },
  async chapterCard(opts = {}) {
    const o = Object.assign({ num: '제1장', title: '잠든 종의 유적', next: 'To be continued ─ 제2장 「왕도로 가는 길」' }, opts);
    Sound.bgm('title');
    await Engine.fadeOut(800);
    const card = {
      modal: true, t: 0, done: false,
      update(dt) { this.t += dt; },
      onAction(a) { if (this.t > 1.2 && (a === 'confirm' || a === 'cancel')) this.done = true; },
      onPointer(ev) { if (ev.type === 'down' && this.t > 1.2) this.done = true; return true; },
      draw(ctx) {
        ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, Engine.W, Engine.H);
        for (let i = 0; i < 60; i++) { const x = (i * 97) % Engine.W, y = (i * 53) % 300; ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.7 * Math.abs(Math.sin(Engine.time + i))})`; ctx.fillRect(x, y, 2, 2); }
        const a = Math.min(1, this.t / 1.2);
        ctx.globalAlpha = a;
        Text.draw(ctx, o.num, Engine.W / 2, 120, { size: 22, align: 'center', color: Theme.dim });
        Text.draw(ctx, o.title, Engine.W / 2, 152, { size: 38, bold: true, align: 'center', color: Theme.gold });
        Text.draw(ctx, '── 완 ──', Engine.W / 2, 208, { size: 20, align: 'center' });
        const s = Game.state;
        Text.draw(ctx, `플레이 시간 ${Util.fmtTime(s.playTime)}   ·   ${s.heroName} Lv ${s.members.hero.level}   ·   별조각 ${s.starsGiven + Game.count('star')}/8`, Engine.W / 2, 268, { size: 16, align: 'center', color: Theme.dim });
        Text.draw(ctx, o.next, Engine.W / 2, 330, { size: 18, align: 'center', color: '#bcd8ff' });
        Text.draw(ctx, '이후에도 자유롭게 탐험하며 남은 의뢰를 해결할 수 있습니다.', Engine.W / 2, 372, { size: 15, align: 'center', color: Theme.dim });
        if (this.t > 1.2 && Math.floor(Engine.time * 2) % 2 === 0) Text.draw(ctx, '▼', Engine.W / 2, 420, { size: 18, align: 'center', color: Theme.gold });
        ctx.globalAlpha = 1;
      },
    };
    Engine.push(card);
    await Engine.fadeIn(800);
    await new Promise((res) => { const iv = setInterval(() => { if (card.done) { clearInterval(iv); res(); } }, 50); });
    await Engine.fadeOut(500);
    Engine.remove(card);
    Sound.bgm(o.bgm || 'town');
    await Engine.fadeIn(500);
  },
};

const Dials = {
  pos(id) { const v = Game.flag(id); return typeof v === 'number' ? v : MAPS.tower2.objects.find((o) => o.id === id).start; },
  solved() { return ['dial_a', 'dial_b', 'dial_c'].every((id) => Dials.pos(id) % 4 === 0); },
  async turn(o) {
    const before = Dials.solved();
    const n = (Dials.pos(o.id) + 1) % 4;
    Game.setFlag(o.id, n === 0 ? 4 : n);
    Sound.sfx('door'); Engine.shake(1, 0.15);
    await S.say(null, `끼릭… 시곗바늘을 돌렸다. 바늘이 [y]${['12', '3', '6', '9'][n]}시[/]를 가리킨다.`);
    Field.refreshTiles();
    if (!before && Dials.solved()) {
      Sound.sfx('chime'); await S.wait(300); Sound.sfx('impact'); Engine.shake(4, 0.6);
      await S.say(null, '[y]데엥──! 세 바늘이 겹치자 탑 전체가 울리고, 철창이 천천히 올라갔다![/]');
      await Story.line('mio', '노래가… 조금 더 또렷해졌어요. 바로 위예요.');
    }
  },
};

const Hourglass = {
  async flip() {
    const p = Field.player;
    const on = !Game.flag('hg_flip');
    const willSink = (on ? HOURGLASS.B : HOURGLASS.A).some(([x, y]) => x === p.x && y === p.y);
    if (willSink) { Sound.sfx('buzzer'); await S.say(null, '발밑이 모래로 꺼질 것 같다. 여기서는 뒤집을 수 없다.'); return; }
    Game.setFlag('hg_flip', on);
    Sound.sfx('mist'); Engine.shake(3, 0.5);
    Field.refreshTiles();
    await S.say(null, on ? '커다란 모래시계를 뒤집었다. 쏴아아── 사원 곳곳에서 모래가 반대로 흐르기 시작했다.' : '모래시계를 다시 뒤집었다. 모래의 흐름이 원래대로 돌아왔다.');
  },
};

'use strict';
// ─────────────────────────────────────────────────────────────
// Events / S: 이벤트 스크립트 실행기와 스크립트 API
//  모든 대화·연출·보상은 async 함수로 작성하고 Events.run()으로 실행한다.
//  예외가 나도 게임이 멈추지 않도록 busy 카운터를 항상 되돌린다.
// ─────────────────────────────────────────────────────────────
const Events = (() => {
  let running = 0;
  async function run(fn) {
    Field.busy = Field.busy + 1;
    running++;
    try {
      await fn();
    } catch (err) {
      if (!(err instanceof AbortSignalError)) {
        console.error('[Event] error:', err);
        try { await UI.message('[r](알 수 없는 문제가 생겼지만 모험은 계속된다.)[/]'); } catch (e) { /* */ }
      }
    } finally {
      running--;
      Field.busy = Math.max(0, Field.busy - 1);
      Field.refreshNpcs();
      Input.clearQueue();
    }
  }
  return { run, get running() { return running; } };
})();

const S = {
  // 대화: name이 null이면 지문
  say(name, text, opts = {}) {
    const pages = Array.isArray(text) ? text : [text];
    return UI.message(pages.map((t) => Util.fill(t)), Object.assign({ name: name ? Util.fill(name) : null }, opts));
  },
  async talk(seq) {
    for (const [name, text] of seq) await S.say(name, text);
  },
  // 선택지 — 선택한 인덱스 반환 (취소 시 cancelIndex)
  async ask(name, text, options, cancelIndex = options.length - 1) {
    const msg = new UI.MessageLayer([Util.fill(text)], { name: name ? Util.fill(name) : null, keepOpen: true });
    await msg.open();
    const w = Math.max(160, ...options.map((o) => Text.width(Engine.ctx, o, 18) + 60));
    const r = await UI.list({ x: Engine.W - w - 16, y: Engine.H - 150, anchor: 'bottom', w, items: options.map((o, i) => ({ label: o, value: i })), cancel: true });
    msg.close();
    return r ? r.value : cancelIndex;
  },
  async yesno(name, text) { return (await S.ask(name, text, ['예', '아니요'], 1)) === 0; },

  async give(itemId, n = 1, opts = {}) {
    const it = ITEMS[itemId];
    const got = Game.addItem(itemId, n);
    if (got < n) {
      await S.say(null, `${it.name}을(를) 더 가질 수 없다…`);
      return false;
    }
    if (!opts.silent) {
      const jingle = it.kind === 'key' || ['weapon', 'armor', 'shield', 'helm', 'accessory'].includes(it.kind) || itemId === 'starwater';
      if (jingle) Sound.jingle('item'); else Sound.sfx('chest');
      await S.say(null, `${opts.from || ''}[y]${it.name}[/]${n > 1 ? ` ${n}개` : ''}${Util.josa(it.name + (n > 1 ? `${n}개` : ''), '을')} 손에 넣었다!`);
    }
    const q = Quests.onItem(itemId);
    if (q) await S.say(null, q);
    return true;
  },
  take(itemId, n = 1) { return Game.removeItem(itemId, n); },
  async gold(n, fromChest) {
    Game.addGold(n);
    Sound.sfx('coin');
    await S.say(null, `[y]${n}G[/]를 손에 넣었다!`);
  },
  async join(id) {
    Game.join(id);
    Field.resetFollowers();
    Sound.jingle('join');
    await S.say(null, `[y]${Game.name(id)}[/]${Util.josa(Game.name(id), '이')} 동료가 되었다!`);
    if (!Game.state.party.includes(id)) await S.say(null, `(파티가 가득 차서 ${Game.name(id)}${Util.josa(Game.name(id), '은')} 대기 멤버가 되었다. 메뉴의 「편성」에서 바꿀 수 있다.)`);
  },
  flag: (k) => Game.flag(k),
  set(k, v = true) { Game.setFlag(k, v); },

  // 전투: 패배 시 게임오버 처리 후 스크립트 중단
  async battle(enemies, opts = {}) {
    const r = await Battle.run(Object.assign({ enemies }, opts));
    if (r === 'lose') {
      if (opts.loseOk) return 'lose';
      await GameOver.run();
      throw new AbortSignalError('gameover');
    }
    return r;
  },

  wait: (ms) => Engine.wait(ms),
  fadeOut: (ms = 400) => Engine.fadeOut(ms),
  fadeIn: (ms = 400) => Engine.fadeIn(ms),
  shake: (m = 4, s = 0.3) => Engine.shake(m, s),
  flash: (c = '#fff', s = 0.3) => Engine.flash(c, s),
  sfx: (n) => Sound.sfx(n),
  bgm: (n) => Sound.bgm(n),
  warp: (map, x, y, dir, opts) => Field.warp(map, x, y, dir, opts),
  walk: (dirs) => Field.walkPlayer(dirs.slice(), true),
  walkNpc: (id, dirs, speed) => Field.walkNpc(id, dirs.slice(), speed),
  face(id, dir) { const n = Field.npc(id); if (n) n.dir = dir; },
  facePlayer(dir) { Field.player.dir = dir; },
  hideNpc(id) { const n = Field.npc(id); if (n) n.visible = false; },

  // 퀘스트
  async startQuest(id) {
    if (!Quests.start(id)) return;
    Sound.jingle('quest');
    await S.say(null, `[${QUESTS[id].type === 'main' ? 'y' : 'g'}]${QUESTS[id].type === 'main' ? '메인' : '서브'} 퀘스트 「${QUESTS[id].name}」[/] 시작!\n[d]${Quests.goal(id)}[/]`);
  },
  stage(id, n) { Quests.setStage(id, n); },
  // 현재 목표 안내 (설정에 따라 암시 또는 자세히)
  async goalUpdate(id, extra = '') { await S.say(null, `[y]목표 갱신: ${Quests.goal(id)}[/]${extra}`); },
  async completeQuest(id, outcome) {
    const r = Quests.complete(id, outcome);
    if (!r) return;
    Sound.jingle('quest');
    let t = `[${QUESTS[id].type === 'main' ? 'y' : 'g'}]퀘스트 「${QUESTS[id].name}」 완료![/]`;
    const parts = [];
    if (r.gold) parts.push(`${r.gold}G`);
    for (const [it, n] of r.items || []) parts.push(ITEMS[it].name + (n > 1 ? ` ×${n}` : ''));
    if (parts.length) t += `\n보상: ${parts.join(', ')}`;
    if (r.text) t += `\n[d]${r.text}[/]`;
    await S.say(null, t);
  },

  // 여관: 하룻밤 묵고 전원 회복
  async inn(price, keeper = '마르타') {
    const free = Game.flag('inn_free');
    const p = free ? 0 : price;
    const ok = await S.ask(keeper, free ? '어서 와요! 우리 은인에겐 숙박비 안 받아요. 쉬고 갈래요?' : `하룻밤에 [y]${p}G[/]예요. 쉬고 갈래요?`, ['묵는다', '그만둔다'], 1);
    if (ok !== 0) { await S.say(keeper, '언제든지 들러요!'); return false; }
    if (!Game.spend(p)) { Sound.sfx('buzzer'); await S.say(keeper, '어머, 돈이 모자라네요… 다음에 와요.'); return false; }
    await S.say(keeper, '편히 쉬어요. 좋은 꿈 꾸고요!');
    await Engine.fadeOut(600);
    Sound.stop();
    Game.healAll(true);
    await Sound.jingle('inn');
    await Engine.wait(300);
    Field.refreshNpcs();
    Sound.bgm(typeof Field.map.bgm === 'function' ? Field.map.bgm() : Field.map.bgm);
    await Engine.fadeIn(600);
    await S.say(keeper, '좋은 아침이에요! 오늘도 힘내요.');
    if (Events.afterInn) await Events.afterInn();
    return true;
  },

  // 저장 지점: 회복 + 저장
  async savePoint(healText) {
    if (healText) { Sound.sfx('save'); Game.healAll(true); Engine.flash('#9fe0ff', 0.4); await S.say(null, healText); }
    if (await S.yesno(null, '모험을 기록할까요?')) await Menu.saveScreen();
  },
};

// 게임오버: 신전에서 깨어나고 소지금 절반을 잃는다 (막힌 진행 없음)
const GameOver = {
  async run() {
    Sound.stop();
    Sound.jingle('gameover');
    await UI.message(['[r]일행은 모두 쓰러지고 말았다…[/]']);
    await Engine.fadeOut(900);
    const lost = Math.floor(Game.gold / 2);
    Game.addGold(-lost);
    Game.healAll(true);
