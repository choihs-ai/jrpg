<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="별빛 종">
  <meta name="theme-color" content="#05060f">
  <meta name="description" content="이세계 정통 JRPG — 별빛 종의 이방인 제1장">
  <title>별빛 종의 이방인</title>
  <style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; background: #05060f; color: #f4f1e6; overflow: hidden;
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  -webkit-user-select: none; user-select: none; touch-action: manipulation; overscroll-behavior: none;
}
#app {
  position: fixed; inset: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#game-wrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#game { touch-action: none; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; border-radius: 4px; box-shadow: 0 0 40px rgba(80, 90, 200, 0.25); }

/* 터치 컨트롤 */
#touch { display: none; }
body.touch-on #touch { display: block; }
#dpad {
  position: absolute; left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom));
  width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.18);
  touch-action: none; z-index: 5;
}
#dpad .arr { position: absolute; color: rgba(255, 255, 255, 0.6); font-size: 22px; line-height: 1; pointer-events: none; }
#dpad .up { left: 50%; top: 10px; transform: translateX(-50%); }
#dpad .down { left: 50%; bottom: 10px; transform: translateX(-50%); }
#dpad .left { top: 50%; left: 10px; transform: translateY(-50%); }
#dpad .right { top: 50%; right: 10px; transform: translateY(-50%); }
#dpad[data-dir="up"] .up, #dpad[data-dir="down"] .down, #dpad[data-dir="left"] .left, #dpad[data-dir="right"] .right { color: #ffd75e; }
#btns {
  position: absolute; right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom));
  width: 170px; height: 150px; z-index: 5;
}
#btns button {
  position: absolute; width: 66px; height: 66px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35);
  background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 24px; font-weight: 700; touch-action: none;
}
#btns button.on { background: rgba(255, 215, 94, 0.45); }
#btns .a { right: 0; top: 30px; background: rgba(255, 120, 120, 0.22); }
#btns .b { right: 82px; top: 74px; background: rgba(120, 160, 255, 0.22); }
#btns .small { right: 92px; top: 0; width: 48px; height: 48px; font-size: 20px; }

/* 세로 화면 + 터치: 게임 화면은 위, 컨트롤은 아래 */
@media (orientation: portrait) {
  body.touch-on #game-wrap { flex: 0 1 auto; height: calc(100% - 190px); align-items: center; }
  body.touch-on #touch { position: relative; height: 190px; }
}

/* 이름 입력 */
.name-entry { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 10, 0.55); z-index: 20; }
.name-entry form {
  background: linear-gradient(#1e2858, #0c102c); border: 3px solid #ece8d8; border-radius: 10px; padding: 20px 22px;
  display: flex; flex-direction: column; gap: 10px; width: min(320px, 86vw);
}
.name-entry label { color: #ffd75e; font-weight: 700; font-size: 18px; }
.name-entry input { font-size: 20px; padding: 10px; border-radius: 6px; border: 2px solid #5c6bb0; background: #0a0d24; color: #fff; -webkit-user-select: text; user-select: text; }
.name-entry .hint { font-size: 13px; color: #a7adc6; }
.name-entry button { font-size: 18px; padding: 10px; border-radius: 6px; border: none; background: #ffd75e; color: #1a1430; font-weight: 700; }

</style>
</head>
<body>
  <div id="app">
    <div id="game-wrap"><canvas id="game" aria-label="게임 화면"></canvas></div>
    <div id="touch" aria-hidden="true">
      <div id="dpad"><span class="arr up">▲</span><span class="arr down">▼</span><span class="arr left">◀</span><span class="arr right">▶</span></div>
      <div id="btns">
        <button data-act="menu" class="small">☰</button>
        <button data-act="cancel" class="b">B</button>
        <button data-act="confirm" class="a">A</button>
      </div>
    </div>
  </div>
  <script>

// ── src/core/util.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// Util: 난수, 수학 보조, 한국어 조사 처리, 텍스트 치환
// ─────────────────────────────────────────────────────────────
const Util = (() => {
  // 시드 고정이 가능한 난수 (mulberry32) — 테스트에서 재현성을 위해 사용
  let seed = (Date.now() ^ 0x9e3779b9) >>> 0;
  function rand() {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const setSeed = (s) => { seed = s >>> 0; };
  const randInt = (a, b) => a + Math.floor(rand() * (b - a + 1));
  const randRange = (a, b) => a + rand() * (b - a);
  const chance = (p) => rand() < p;
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  function weighted(list, key = 'w') {
    let total = 0;
    for (const e of list) total += e[key] || 0;
    if (total <= 0) return list[0];
    let r = rand() * total;
    for (const e of list) { r -= e[key] || 0; if (r < 0) return e; }
    return list[list.length - 1];
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 결정적 해시 (타일 변형 선택 등)
  function hash2(x, y, s = 0) {
    let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ── 한국어 조사 ──
  const DIGIT = { '0': [1, 0], '1': [1, 1], '2': [0, 0], '3': [1, 0], '4': [0, 0], '5': [0, 0], '6': [1, 0], '7': [1, 1], '8': [1, 1], '9': [0, 0] };
  function finalInfo(word) {
    const s = String(word).replace(/[\s)\]」』'"!?.]+$/u, '');
    if (!s) return { has: false, rieul: false };
    const ch = s[s.length - 1];
    const c = ch.charCodeAt(0);
    if (c >= 0xac00 && c <= 0xd7a3) {
      const j = (c - 0xac00) % 28;
      return { has: j !== 0, rieul: j === 8 };
    }
    if (DIGIT[ch]) return { has: !!DIGIT[ch][0], rieul: !!DIGIT[ch][1] };
    if (/[lmnr]$/i.test(ch)) return { has: true, rieul: /[lr]$/i.test(ch) };
    return { has: false, rieul: false };
  }
  function josa(word, type) {
    const { has, rieul } = finalInfo(word);
    switch (type) {
      case '이': case '가': return has ? '이' : '가';
      case '을': case '를': return has ? '을' : '를';
      case '은': case '는': return has ? '은' : '는';
      case '과': case '와': return has ? '과' : '와';
      case '으로': case '로': return has && !rieul ? '으로' : '로';
      case '아': case '야': return has ? '아' : '야';
      case '이여': case '여': return has ? '이여' : '여';
      case '이랑': case '랑': return has ? '이랑' : '랑';
      case '이에요': case '예요': return has ? '이에요' : '예요';
      case '이야': return has ? '이야' : '야';
      case '이라고': case '라고': return has ? '이라고' : '라고';
      default: return type;
    }
  }
  // word + 조사
  const j = (word, type) => word + josa(word, type);

  // 텍스트 치환: {H} → 주인공 이름, {H|이} → 이름+조사, {키|을} 등
  function fill(text, vars) {
    if (text == null) return '';
    return String(text).replace(/\{([A-Za-z_][\w]*)(?:\|([^}]+))?\}/g, (m, key, jo) => {
      let v = vars && key in vars ? vars[key] : undefined;
      if (v === undefined && typeof Game !== 'undefined' && key === 'H') v = Game.heroName();
      if (v === undefined) return m;
      return jo ? v + josa(v, jo) : String(v);
    });
  }

  function fmtTime(sec) {
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const deepCopy = (o) => JSON.parse(JSON.stringify(o));

  return {
    rand, setSeed, randInt, randRange, chance, pick, clamp, lerp, weighted, shuffle, hash2,
    josa, j, fill, fmtTime, sleep, deepCopy,
  };
})();

// 진행 중인 스크립트를 중단하기 위한 신호 (게임오버, 타이틀 복귀 등)
class AbortSignalError extends Error {
  constructor(reason) { super('abort:' + reason); this.reason = reason; }
}


// ── src/core/input.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// Input: 키보드 / 마우스 / 터치를 공통 '액션'으로 변환
//  액션: up down left right confirm cancel menu run map
// ─────────────────────────────────────────────────────────────
const Input = (() => {
  const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'confirm', Enter: 'confirm', NumpadEnter: 'confirm', Space: 'confirm', KeyJ: 'confirm',
    KeyX: 'cancel', Escape: 'cancel', Backspace: 'cancel', KeyK: 'cancel',
    KeyC: 'menu', KeyI: 'menu', Tab: 'menu',
    KeyM: 'map',
    ShiftLeft: 'run', ShiftRight: 'run',
    KeyQ: 'pageup', PageUp: 'pageup', KeyE: 'pagedown', PageDown: 'pagedown',
  };
  const DIRS = ['up', 'down', 'left', 'right'];
  const REPEAT_DELAY = 0.32, REPEAT_RATE = 0.075;

  const held = {};          // action → 눌린 소스 수
  const heldOrder = [];     // 방향키 누른 순서 (마지막이 우선)
  const queue = [];         // 이번 프레임에 처리할 액션
  const repeatT = {};
  let pointerHandler = null;
  let lastPointerType = 'mouse';
  let enabled = true;
  const listeners = new Set(); // 최초 입력 감지(오디오 잠금 해제 등)

  function press(action) {
    held[action] = (held[action] || 0) + 1;
    if (held[action] === 1) {
      if (DIRS.includes(action)) {
        const i = heldOrder.indexOf(action);
        if (i >= 0) heldOrder.splice(i, 1);
        heldOrder.push(action);
        repeatT[action] = -REPEAT_DELAY;
      }
      if (enabled) queue.push(action);
    }
    for (const l of listeners) l(action);
  }
  function release(action) {
    if (!held[action]) return;
    held[action] = Math.max(0, held[action] - 1);
    if (held[action] === 0) {
      const i = heldOrder.indexOf(action);
      if (i >= 0) heldOrder.splice(i, 1);
    }
  }
  function releaseAll() {
    for (const k in held) held[k] = 0;
    heldOrder.length = 0;
  }

  const keysDown = new Set();
  function onKeyDown(e) {
    // 이름 입력창 등 DOM 입력 중에는 게임 입력을 막는다
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const a = KEYMAP[e.code];
    if (!a) return;
    e.preventDefault();
    if (keysDown.has(e.code)) return; // 키 자동반복은 자체 처리
    keysDown.add(e.code);
    press(a);
  }
  function onKeyUp(e) {
    const a = KEYMAP[e.code];
    if (!a) return;
    if (keysDown.has(e.code)) { keysDown.delete(e.code); release(a); }
  }

  function init(canvas, toLogical) {
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', () => { keysDown.clear(); releaseAll(); });
    const send = (type, e) => {
      const p = toLogical(e.clientX, e.clientY);
      lastPointerType = e.pointerType || 'mouse';
      if (pointerHandler) pointerHandler({ type, x: p.x, y: p.y, button: e.button, pointerType: lastPointerType });
    };
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      for (const l of listeners) l('pointer');
      if (e.button === 2) { press('cancel'); release('cancel'); return; }
      send('down', e);
    });
    canvas.addEventListener('pointermove', (e) => send('move', e));
    canvas.addEventListener('pointerup', (e) => { if (e.button !== 2) send('up', e); });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (pointerHandler) {
        const p = toLogical(e.clientX, e.clientY);
        pointerHandler({ type: 'wheel', x: p.x, y: p.y, dy: Math.sign(e.deltaY) });
      }
    }, { passive: false });
  }

  // 터치 가상 버튼
  function bindVirtualButton(el, action) {
    const down = (e) => { e.preventDefault(); el.classList.add('on'); press(action); lastPointerType = 'touch'; };
    const up = (e) => { e.preventDefault(); if (el.classList.contains('on')) { el.classList.remove('on'); release(action); } };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // 방향 패드: 손가락 위치에 따라 방향 결정 (슬라이드 지원)
  function bindDpad(el) {
    let cur = null;
    const setDir = (d) => {
      if (d === cur) return;
      if (cur) release(cur);
      cur = d;
      if (cur) press(cur);
      el.dataset.dir = cur || '';
    };
    const fromEvent = (e) => {
      const r = el.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(dx, dy) < r.width * 0.12) return null;
      return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    };
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); lastPointerType = 'touch'; setDir(fromEvent(e)); });
    el.addEventListener('pointermove', (e) => { if (cur !== null || e.buttons) setDir(fromEvent(e)); });
    const end = (e) => { e.preventDefault(); setDir(null); };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  function update(dt) {
    // 방향키 자동 반복 (메뉴 커서용)
    const d = heldOrder[heldOrder.length - 1];
    if (d && held[d]) {
      repeatT[d] += dt;
      while (repeatT[d] >= REPEAT_RATE) {
        repeatT[d] -= REPEAT_RATE;
        if (enabled) queue.push(d);
      }
    }
  }

  return {
    init, update, bindVirtualButton, bindDpad, press, release, releaseAll,
    consume() { const q = queue.splice(0); return q; },
    clearQueue() { queue.length = 0; },
    isHeld: (a) => !!held[a],
    dir() { for (let i = heldOrder.length - 1; i >= 0; i--) if (held[heldOrder[i]]) return heldOrder[i]; return null; },
    setPointerHandler(fn) { pointerHandler = fn; },
    onAny(fn) { listeners.add(fn); },
    get pointerType() { return lastPointerType; },
    setEnabled(v) { enabled = v; if (!v) queue.length = 0; },
  };
})();


// ── src/core/engine.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// Engine: 캔버스, 레이어 스택, 메인 루프, 화면 효과(페이드/흔들림/섬광)
//  논리 해상도 640x480 (UI·텍스트), 월드는 320x240 픽셀 버퍼를 2배 확대
// ─────────────────────────────────────────────────────────────
const Engine = (() => {
  const W = 640, H = 480, LW = 320, LH = 240;
  let canvas, ctx, low, lctx;
  let scale = 1;
  const layers = [];
  let last = 0;
  let time = 0;
  const fx = {
    fade: 0, fadeTarget: 0, fadeSpeed: 0, fadeResolve: null, fadeColor: '#000',
    shakeT: 0, shakeMag: 0, flashT: 0, flashDur: 0, flashColor: '#fff',
  };
  let errorCount = 0;
  // 움직임 줄이기 설정을 존중 (흔들림·섬광 약화)
  const rm = typeof matchMedia === 'function' ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  const reducedMotion = () => !!(rm && rm.matches);
  let lastError = null;

  function init(canvasEl) {
    canvas = canvasEl;
    ctx = canvas.getContext('2d');
    low = document.createElement('canvas');
    low.width = LW; low.height = LH;
    lctx = low.getContext('2d');
    lctx.imageSmoothingEnabled = false;
    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    Input.init(canvas, toLogical);
    Input.setPointerHandler((ev) => {
      for (let i = layers.length - 1; i >= 0; i--) {
        const l = layers[i];
        if (l.onPointer) { if (l.onPointer(ev) !== false) break; }
        if (l.modal !== false) break;
      }
    });
    requestAnimationFrame(loop);
  }

  function resize() {
    const wrap = canvas.parentElement;
    const r = wrap.getBoundingClientRect();
    const s = Math.min(r.width / W, r.height / H);
    const cssW = Math.max(1, Math.floor(W * s)), cssH = Math.max(1, Math.floor(H * s));
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    scale = canvas.width / W;
    document.documentElement.style.setProperty('--game-w', cssW + 'px');
    document.documentElement.style.setProperty('--game-h', cssH + 'px');
  }

  function toLogical(cx, cy) {
    const r = canvas.getBoundingClientRect();
    return { x: ((cx - r.left) / r.width) * W, y: ((cy - r.top) / r.height) * H };
  }

  function loop(t) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t;
    step(dt);
  }

  function step(dt) {
    time += dt;
    try {
      Input.update(dt);
      const actions = Input.consume();
      const top = layers[layers.length - 1];
      if (top && fx.fadeResolve === null) {
        for (const a of actions) if (top.onAction) top.onAction(a);
      }
      // 레이어 업데이트 (복사본으로 순회 — 업데이트 중 추가/삭제 대비)
      for (const l of layers.slice()) if (l.update) l.update(dt);
      updateFx(dt);
      draw();
    } catch (err) {
      errorCount++;
      lastError = err;
      if (errorCount < 20) console.error('[Engine] frame error:', err);
    }
  }

  function updateFx(dt) {
    if (fx.fadeSpeed !== 0) {
      fx.fade += fx.fadeSpeed * dt;
      if ((fx.fadeSpeed > 0 && fx.fade >= fx.fadeTarget) || (fx.fadeSpeed < 0 && fx.fade <= fx.fadeTarget)) {
        fx.fade = fx.fadeTarget; fx.fadeSpeed = 0;
        const r = fx.fadeResolve; fx.fadeResolve = null;
        if (r) r();
      }
    }
    if (fx.shakeT > 0) fx.shakeT -= dt;
    if (fx.flashT > 0) fx.flashT -= dt;
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    let ox = 0, oy = 0;
    if (fx.shakeT > 0) {
      const m = fx.shakeMag * Math.min(1, fx.shakeT * 4);
      ox = (Math.random() * 2 - 1) * m; oy = (Math.random() * 2 - 1) * m;
    }
    ctx.setTransform(scale, 0, 0, scale, ox * scale, oy * scale);
    ctx.imageSmoothingEnabled = false;
    const drawLayer = (l) => {
      ctx.save();
      try { l.draw(ctx); } catch (err) { errorCount++; lastError = err; if (errorCount < 20) console.error('[Engine] draw error:', err); }
      ctx.restore();
    };
    // 쌓인 순서대로 그리되, 페이드/섬광은 첫 번째 대화·선택창 바로 아래에 깐다
    // (검은 화면 위 내레이션이 보이도록, 그리고 창 위에 띄운 패널은 순서를 지키도록)
    let fxIndex = layers.findIndex((l) => l.overFade);
    if (fxIndex < 0) fxIndex = layers.length;
    for (let i = 0; i <= layers.length; i++) {
      if (i === fxIndex) {
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        if (fx.flashT > 0) {
          ctx.globalAlpha = Math.max(0, fx.flashT / fx.flashDur) * 0.85;
          ctx.fillStyle = fx.flashColor;
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }
        if (fx.fade > 0) {
          ctx.globalAlpha = Math.min(1, fx.fade);
          ctx.fillStyle = fx.fadeColor;
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }
      }
      const l = layers[i];
      if (l && l.draw) { ctx.setTransform(scale, 0, 0, scale, i < fxIndex ? ox * scale : 0, i < fxIndex ? oy * scale : 0); drawLayer(l); }
    }
  }

  // 픽셀 월드 버퍼를 화면에 확대 출력
  function blitLow(c) {
    c.imageSmoothingEnabled = false;
    c.drawImage(low, 0, 0, W, H);
  }

  function fadeTo(target, ms = 300, color = '#000') {
    return new Promise((resolve) => {
      if (fx.fadeResolve) { const r = fx.fadeResolve; fx.fadeResolve = null; r(); }
      fx.fadeColor = color;
      if (ms <= 0 || Math.abs(fx.fade - target) < 0.001) { fx.fade = target; fx.fadeSpeed = 0; resolve(); return; }
      fx.fadeTarget = target;
      fx.fadeSpeed = (target - fx.fade) / (ms / 1000);
      fx.fadeResolve = resolve;
    });
  }

  return {
    W, H, LW, LH, init, resize, step,
    get ctx() { return ctx; }, get low() { return low; }, get lctx() { return lctx; },
    get time() { return time; },
    get layers() { return layers; },
    get lastError() { return lastError; },
    blitLow,
    push(layer) { layers.push(layer); if (layer.onPush) layer.onPush(); return layer; },
    remove(layer) {
      const i = layers.indexOf(layer);
      if (i >= 0) { layers.splice(i, 1); if (layer.onRemove) layer.onRemove(); }
    },
    top() { return layers[layers.length - 1]; },
    isTop(layer) { return layers[layers.length - 1] === layer; },
    setScene(layer) {
      for (const l of layers.splice(0)) if (l.onRemove) l.onRemove();
      layers.push(layer);
      if (layer.onPush) layer.onPush();
      Input.clearQueue();
    },
    fadeOut: (ms, color) => fadeTo(1, ms, color),
    fadeIn: (ms, color) => fadeTo(0, ms, color),
    get fading() { return fx.fadeResolve !== null; },
    get fadeLevel() { return fx.fade; },
    shake(mag = 4, sec = 0.3) { fx.shakeMag = reducedMotion() ? mag * 0.25 : mag; fx.shakeT = sec; },
    flash(color = '#fff', sec = 0.25) { fx.flashColor = color; fx.flashT = reducedMotion() ? sec * 0.4 : sec; fx.flashDur = sec; },
    wait(ms) { return new Promise((r) => setTimeout(r, ms)); },
    // 프레임 기반 대기 (탭 비활성 시에도 순서 보장)
    frames(n = 1) {
      return new Promise((resolve) => {
        let c = n;
        const tick = () => { if (--c <= 0) resolve(); else requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
      });
    },
  };
})();

    g.gain.setTargetAtTime(vol * (inst === 'tri' ? 0.9 : 0.7), t + 0.02, 0.08);
    g.gain.setTargetAtTime(0, t + Math.max(0.02, dur - 0.02), rel);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + dur + 0.3);

  function drum(bus, kind, t, vol) {
    if (kind === 'k') {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
      g.gain.setValueAtTime(vol * 2.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.2);
      return;
    }
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const flt = ac.createBiquadFilter(); flt.type = 'highpass';
    flt.frequency.value = kind === 'h' ? 7000 : 1200;
    const g = ac.createGain();
    const dur = kind === 'h' ? 0.04 : 0.13;
    g.gain.setValueAtTime(vol * (kind === 'h' ? 0.5 : 1.4), t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(bus);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  }

  function startSong(name, opts = {}) {
    const song = getSong(name);
    const gain = ac.createGain();
    gain.gain.value = 1;
    gain.connect(musicBus);
    const s = { name, song, gain, t0: ac.currentTime + 0.06, idx: song.ch.map(() => 0), loopN: 0, onEnd: opts.onEnd, done: false };
    return s;
  }

  function schedule() {
    if (!ac || !unlocked) return;
    for (const s of [cur, jingleCur]) {
      if (!s || s.done) continue;
      const spb = 60 / s.song.bpm / 4; // 16분음표 길이(초)
      const horizon = ac.currentTime + 0.15;
      let guard = 0;
      while (guard++ < 500) {
        let next = null, nc = -1;
        s.song.ch.forEach((c, ci) => {
          const e = c.ev[s.idx[ci]];
          if (!e) return;
          const tt = s.t0 + (e.t + s.loopN * s.song.length) * spb;
          if (next === null || tt < next) { next = tt; nc = ci; }
        });
        if (next === null) {
          // 한 바퀴 끝
          const endT = s.t0 + (s.loopN + 1) * s.song.length * spb;

  }

  function bgm(name) {
    if (!name) { stop(); return; }
    if (!unlocked || !ac) { wantBgm = name; return; }

    stopSong(cur);
    cur = startSong(name);
  }
  function stop() { wantBgm = null; if (cur) stopSong(cur); cur = null; }

  // 징글: 현재 BGM을 잠시 낮추고 재생, 끝나면 resolve
  function jingle(name) {
    return new Promise((resolve) => {
      if (!unlocked || !ac || Settings.get('bgm') === 0) { setTimeout(resolve, name === 'levelup' || name === 'item' ? 500 : 900); return; }

  // ── 효과음 ──
  function tone(f, dur, opts = {}) {
    const t = ac.currentTime + (opts.delay || 0);

    if (opts.wave && waves[opts.wave]) o.setPeriodicWave(waves[opts.wave]); else o.type = opts.type || 'square';
    o.frequency.setValueAtTime(f, t);

    g.gain.exponentialRampToValueAtTime(0.0005, t + dur);

  function noise(dur, opts = {}) {
    const t = ac.currentTime + (opts.delay || 0);

    const flt = ac.createBiquadFilter(); flt.type = opts.filter || 'lowpass'; flt.frequency.setValueAtTime(opts.freq || 2000, t);
    if (opts.to) flt.frequency.exponentialRampToValueAtTime(opts.to, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(opts.vol || 0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(sfxBus);
    src.start(t, Math.random()); src.stop(t + dur + 0.02);
  }
  const SFX = {
    cursor: () => tone(1320, 0.035, { wave: 'p25', vol: 0.06 }),
    text: () => tone(900 + Math.random() * 80, 0.02, { wave: 'p50', vol: 0.025 }),
    confirm: () => { tone(880, 0.05, { wave: 'p25', vol: 0.08 }); tone(1320, 0.07, { wave: 'p25', vol: 0.08, delay: 0.05 }); },
    cancel: () => { tone(660, 0.05, { wave: 'p25', vol: 0.07 }); tone(440, 0.07, { wave: 'p25', vol: 0.07, delay: 0.05 }); },
    buzzer: () => tone(120, 0.18, { wave: 'p50', vol: 0.12 }),
    menu: () => { tone(660, 0.04, { wave: 'p25', vol: 0.07 }); tone(990, 0.06, { wave: 'p25', vol: 0.07, delay: 0.04 }); },
    hit: () => { noise(0.12, { freq: 3000, to: 300, vol: 0.4 }); tone(160, 0.1, { type: 'square', to: 60, vol: 0.12 }); },
    crit: () => { noise(0.2, { freq: 6000, to: 200, vol: 0.5 }); tone(220, 0.18, { wave: 'p25', to: 50, vol: 0.18 }); tone(1600, 0.08, { wave: 'p12', vol: 0.08 }); },
    miss: () => tone(1200, 0.12, { wave: 'p12', to: 500, vol: 0.06 }),
    hurt: () => { noise(0.15, { freq: 1500, to: 200, vol: 0.45 }); tone(110, 0.15, { type: 'square', to: 50, vol: 0.14 }); },
    enemyDie: () => { for (let i = 0; i < 6; i++) tone(800 - i * 110, 0.06, { wave: 'p25', vol: 0.07, delay: i * 0.04 }); },
    fire: () => { noise(0.5, { freq: 800, to: 3000, vol: 0.35 }); tone(200, 0.4, { type: 'sawtooth', to: 600, vol: 0.05 }); },
    ice: () => { for (let i = 0; i < 5; i++) tone(2000 + i * 300, 0.08, { type: 'triangle', vol: 0.08, delay: i * 0.05 }); noise(0.3, { filter: 'highpass', freq: 5000, vol: 0.15 }); },
    thunder: () => { noise(0.6, { freq: 5000, to: 100, vol: 0.6 }); tone(80, 0.5, { type: 'sawtooth', to: 30, vol: 0.12 }); },
    light: () => { for (let i = 0; i < 6; i++) tone(880 * Math.pow(1.26, i), 0.12, { type: 'triangle', vol: 0.07, delay: i * 0.05 }); },
    dark: () => { tone(300, 0.5, { type: 'sawtooth', to: 60, vol: 0.08 }); noise(0.5, { freq: 400, vol: 0.2 }); },
    heal: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.15, { type: 'triangle', vol: 0.09, delay: i * 0.06 })); },
    buff: () => { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.1, { wave: 'p25', vol: 0.06, delay: i * 0.05 })); },
    debuff: () => { [784, 659, 523, 392].forEach((f, i) => tone(f, 0.1, { wave: 'p25', vol: 0.06, delay: i * 0.05 })); },
    mist: () => noise(0.6, { freq: 600, to: 1800, vol: 0.18 }),
    status: () => { tone(400, 0.2, { wave: 'p12', to: 200, vol: 0.08 }); },
    encounter: () => { for (let i = 0; i < 8; i++) tone(300 + (i % 2) * 300 + i * 60, 0.05, { wave: 'p25', vol: 0.08, delay: i * 0.035 }); },
    escape: () => { for (let i = 0; i < 5; i++) tone(400 + i * 150, 0.05, { wave: 'p25', vol: 0.06, delay: i * 0.04 }); },
    door: () => { noise(0.12, { freq: 500, vol: 0.3 }); tone(120, 0.1, { type: 'triangle', vol: 0.12 }); },
    stairs: () => { for (let i = 0; i < 4; i++) noise(0.06, { freq: 900, vol: 0.2, delay: i * 0.09 }); },
    chest: () => { tone(523, 0.08, { wave: 'p25', vol: 0.08 }); tone(784, 0.08, { wave: 'p25', vol: 0.08, delay: 0.07 }); tone(1047, 0.15, { wave: 'p25', vol: 0.08, delay: 0.14 }); },
    coin: () => { tone(988, 0.06, { wave: 'p25', vol: 0.08 }); tone(1319, 0.18, { wave: 'p25', vol: 0.08, delay: 0.06 }); },
    bump: () => tone(90, 0.06, { wave: 'p50', vol: 0.06 }),
    impact: () => { noise(0.4, { freq: 2000, to: 80, vol: 0.6 }); tone(70, 0.35, { type: 'square', to: 30, vol: 0.18 }); },
    bell: () => { [262, 523, 784, 1047].forEach((f, i) => tone(f, 2.2 - i * 0.4, { type: 'triangle', vol: 0.12 - i * 0.02 })); },
    chime: () => { [1047, 1319, 1568, 2093, 1568, 2637].forEach((f, i) => tone(f, 0.5, { type: 'triangle', vol: 0.06, delay: i * 0.09 })); },
    save: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.25, { type: 'triangle', vol: 0.07, delay: i * 0.08 })); },
    poison: () => tone(220, 0.12, { wave: 'p12', to: 160, vol: 0.06 }),
    steal: () => { tone(1200, 0.04, { wave: 'p25', vol: 0.06 }); tone(1600, 0.06, { wave: 'p25', vol: 0.06, delay: 0.04 }); },
    summon: () => { tone(150, 0.6, { type: 'sawtooth', to: 400, vol: 0.07 }); noise(0.6, { freq: 300, to: 1200, vol: 0.2 }); },
    charge: () => { tone(200, 0.6, { wave: 'p25', to: 800, vol: 0.06 }); },
    roar: () => { noise(0.7, { freq: 600, to: 200, vol: 0.5 }); tone(90, 0.6, { type: 'sawtooth', to: 60, vol: 0.12 }); },
    step: () => {},
  };

  return {
    SONGS,
    unlock,
    get unlocked() { return unlocked; },
    get current() { return cur ? cur.name : wantBgm; },
    bgm, stop, jingle, applyVolume,
    sfx(name) { try { if (!unlocked || !ac || !SFX[name]) return; SFX[name](); } catch (e) { /* 소리 오류는 무시 */ } },
  };
})();


// ── src/ui/text.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// Text: 폰트, 줄바꿈, 색상 마크업([y]노랑 [r]빨강 [g]초록 [b]파랑 [p]보라 [/]원래색)
// ─────────────────────────────────────────────────────────────
const Theme = {
  font: '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","NanumGothic","WenQuanYi Zen Hei",system-ui,sans-serif',
  text: '#f4f1e6', dim: '#a7adc6', disabled: '#6f768f', gold: '#ffd75e', red: '#ff7b7b', green: '#7cf08a',
  blue: '#7cc4ff', purple: '#d59bff', hp: '#63e07a', mp: '#5fb2ff', exp: '#ffcf5a',
  winTop: 'rgb(30,40,88)', winBot: 'rgb(12,16,44)', border: '#ece8d8', border2: '#5c6bb0',
  cursor: '#ffd75e', select: 'rgba(255,215,94,0.16)',
};
const MARK = { y: Theme.gold, r: Theme.red, g: Theme.green, b: Theme.blue, p: Theme.purple, d: Theme.dim };

const Text = (() => {
  const fontCache = {};
  function font(size = 18, bold = false) {
    const k = size + (bold ? 'b' : '');
    return fontCache[k] || (fontCache[k] = `${bold ? '700' : '400'} ${size}px ${Theme.font}`);
  }

  // 마크업을 [{t, color}] 런 배열로 파싱
  function parse(text, base) {
    const runs = [];
    let color = base;
    const re = /\[([yrgbpd/])\]/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) runs.push({ t: text.slice(last, m.index), color });
      color = m[1] === '/' ? base : MARK[m[1]];
      last = re.lastIndex;
    }
    if (last < text.length) runs.push({ t: text.slice(last), color });
    return runs;
  }
  const strip = (text) => String(text).replace(/\[([yrgbpd/])\]/g, '');

  // 줄바꿈: 공백 단위로 감싸고, 너무 긴 단어는 글자 단위로 자른다
  function layout(ctx, text, maxW, size = 18, base = Theme.text, bold = false) {
    ctx.font = font(size, bold);
    const lines = [];
    const paragraphs = String(text).split('\n');
    let carry = base;
    for (const para of paragraphs) {
      const runs = parse(para, carry);
      if (runs.length) carry = runs[runs.length - 1].color;
      // 토큰화 (색 유지)
      const tokens = [];
      for (const r of runs) {
        const parts = r.t.split(/( )/);
        for (const p of parts) if (p !== '') tokens.push({ t: p, color: r.color });
      }
      let line = [], lineW = 0;
      const pushLine = () => { lines.push(line); line = []; lineW = 0; };
      for (const tk of tokens) {
        const w = ctx.measureText(tk.t).width;
        if (tk.t === ' ' && line.length === 0) continue;
        if (lineW + w <= maxW) { line.push({ ...tk }); lineW += w; continue; }
        if (tk.t === ' ') { pushLine(); continue; }
        if (w <= maxW) { pushLine(); line.push({ ...tk }); lineW = w; continue; }
        // 긴 토큰: 글자 단위
        for (const ch of tk.t) {
          const cw = ctx.measureText(ch).width;
          if (lineW + cw > maxW && line.length) pushLine();
          if (line.length && line[line.length - 1].color === tk.color) line[line.length - 1].t += ch;
          else line.push({ t: ch, color: tk.color });
          lineW += cw;
        }
      }
      // 끝의 공백 제거
      while (line.length && line[line.length - 1].t === ' ') line.pop();
      lines.push(line);
    }
    return lines;
  }

  const lineLen = (line) => line.reduce((n, r) => n + [...r.t].length, 0);

  // 줄 배열을 그린다. limit = 표시할 글자 수(타자기 효과)
  function drawLines(ctx, lines, x, y, lh, size = 18, limit = Infinity, opts = {}) {
    ctx.font = font(size, opts.bold);
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    let left = limit;
    for (let i = 0; i < lines.length; i++) {
      let cx = x;
      for (const r of lines[i]) {
        if (left <= 0) return;
        const chars = [...r.t];
        const s = chars.length > left ? chars.slice(0, left).join('') : r.t;
        left -= Math.min(chars.length, left);
        if (opts.shadow !== false) { ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(s, cx + 1, y + i * lh + 1); }
        ctx.fillStyle = r.color;
        ctx.fillText(s, cx, y + i * lh);
        cx += ctx.measureText(r.t).width;
      }
    }
  }

  // 단순 한 줄 텍스트 (마크업 지원, 정렬, 최대폭 축소)
  function draw(ctx, text, x, y, opts = {}) {
    const size = opts.size || 18;
    ctx.font = font(size, opts.bold);
    ctx.textBaseline = opts.baseline || 'top';
    const runs = parse(String(text), opts.color || Theme.text);
    let total = 0;
    for (const r of runs) total += ctx.measureText(r.t).width;
    let sx = 1;
    if (opts.maxW && total > opts.maxW) sx = opts.maxW / total;
    let cx = x;
    if (opts.align === 'right') cx = x - total * sx;
    else if (opts.align === 'center') cx = x - (total * sx) / 2;
    ctx.save();
    if (sx !== 1) { ctx.translate(cx, 0); ctx.scale(sx, 1); cx = 0; }
    for (const r of runs) {
      if (opts.shadow !== false) { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(r.t, cx + 1, y + 1); }
      if (opts.outline) { ctx.lineWidth = opts.outline; ctx.strokeStyle = opts.outlineColor || '#000'; ctx.strokeText(r.t, cx, y); }
      ctx.fillStyle = r.color;
      ctx.fillText(r.t, cx, y);
      cx += ctx.measureText(r.t).width;
    }
    ctx.restore();
    return total * sx;
  }

  function width(ctx, text, size = 18, bold = false) {
    ctx.font = font(size, bold);
    return ctx.measureText(strip(text)).width;
  }

  return { font, parse, strip, layout, lineLen, drawLines, draw, width };
})();


// ── src/ui/widgets.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// UI 위젯: 창, 대화 메시지, 선택 목록, 수량 선택, 이름 입력
//  모든 위젯은 Promise 기반 — await로 결과를 받는다
// ─────────────────────────────────────────────────────────────
const UI = (() => {
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawWindow(ctx, x, y, w, h, opts = {}) {
    ctx.save();
    if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, opts.top || Theme.winTop);
    g.addColorStop(1, opts.bot || Theme.winBot);
    roundRect(ctx, x, y, w, h, 7);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = opts.border || Theme.border;
    ctx.stroke();
    roundRect(ctx, x + 3.5, y + 3.5, w - 7, h - 7, 5);
    ctx.lineWidth = 1;
    ctx.strokeStyle = opts.border2 || Theme.border2;
    ctx.stroke();
    ctx.restore();
  }

  function gauge(ctx, x, y, w, h, ratio, color, back = 'rgba(0,0,0,0.5)') {
    ratio = Util.clamp(ratio, 0, 1);
    ctx.fillStyle = back;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, Math.round(w * ratio), h);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x, y, Math.round(w * ratio), Math.max(1, h / 3));
  }

  function cursorArrow(ctx, x, y, size = 9, color = Theme.cursor) {
    const bob = Math.sin(Engine.time * 8) * 1.5;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + bob, y - size / 1.4);
    ctx.lineTo(x + size + bob, y);
    ctx.lineTo(x + bob, y + size / 1.4);
    ctx.closePath();
    ctx.fill();
  }

  const textSpeed = () => {
    const s = typeof Settings !== 'undefined' ? Settings.get('textSpeed') : 1;
    return [28, 55, 120, 100000][s] || 55;
  };

  // ───────────── 메시지(대화) 창 ─────────────
  class MessageLayer {
    constructor(text, opts = {}) {
      this.opts = opts;
      this.pagesRaw = Array.isArray(text) ? text : [text];
      this.page = 0;
      this.shown = 0;
      this.lines = null;
      this.modal = true;
      this.y = opts.pos === 'top' ? 12 : Engine.H - 144;
      this.h = 132;
      this.x = 12; this.w = Engine.W - 24;
      this.pages = null;
      this.done = false;
      this.waitingClose = false;
      this.overFade = true;
    }
    prepare(ctx) {
      if (this.pages) return;
      this.pages = [];
      for (const p of this.pagesRaw) {
        const lines = Text.layout(ctx, Util.fill(p), this.w - 40, 19);
        for (let i = 0; i < lines.length; i += 4) this.pages.push(lines.slice(i, i + 4));
      }
      if (!this.pages.length) this.pages.push([[]]);
    }
    get total() { return this.pages ? this.pages[this.page].reduce((n, l) => n + Text.lineLen(l), 0) : 0; }
    open() {
      return new Promise((resolve) => { this.resolve = resolve; Engine.push(this); });
    }
    update(dt) {
      if (!this.pages) return;
      if (this.shown < this.total) {
        const before = Math.floor(this.shown);
        this.shown = Math.min(this.total, this.shown + textSpeed() * dt);
        if (Math.floor(this.shown) !== before && Math.floor(this.shown) % 3 === 0 && typeof Sound !== 'undefined') Sound.sfx('text');
      } else if (this.opts.keepOpen && this.page === this.pages.length - 1 && !this.waitingClose) {
        // 선택지와 함께 쓰는 경우 — 글이 다 나오면 바로 resolve (창은 유지)
        this.waitingClose = true;
        const r = this.resolve; this.resolve = null; if (r) r(this);
      }
      if (this.opts.auto && this.shown >= this.total) {
        this.autoT = (this.autoT || 0) + dt * 1000;
        if (this.autoT >= this.opts.auto) this.advance();
      }
    }
    advance() {
      if (!this.pages || this.opts.keepOpen && this.waitingClose) return;
      if (this.shown < this.total) { this.shown = this.total; return; }
      if (this.page < this.pages.length - 1) { this.page++; this.shown = 0; this.autoT = 0; Sound.sfx('cursor'); return; }
      this.close();
    }
    close() {
      Engine.remove(this);
      const r = this.resolve; this.resolve = null;
      if (r) r(this);
    }
    onAction(a) { if (a === 'confirm' || a === 'cancel') this.advance(); }
    onPointer(ev) { if (ev.type === 'down') this.advance(); return true; }
    draw(ctx) {
      this.prepare(ctx);
      const { x, y, w, h } = this;
      drawWindow(ctx, x, y, w, h);
      if (this.opts.name) {
        const nw = Math.max(90, Text.width(ctx, this.opts.name, 17, true) + 30);
        drawWindow(ctx, x + 10, y - 30, nw, 34, { top: 'rgba(60,48,20,0.97)', bot: 'rgba(36,26,10,0.97)', border2: '#8a7240' });
        Text.draw(ctx, this.opts.name, x + 10 + nw / 2, y - 22, { size: 17, bold: true, color: Theme.gold, align: 'center' });
      }
      const lines = this.pages[this.page];
      Text.drawLines(ctx, lines, x + 20, y + 16, 27, 19, Math.floor(this.shown));
      if (this.shown >= this.total && !(this.opts.keepOpen && this.page === this.pages.length - 1)) {
        if (Math.floor(Engine.time * 2.5) % 2 === 0) {
          ctx.fillStyle = Theme.gold;
          ctx.beginPath();
          const bx = x + w - 26, by = y + h - 20;
          ctx.moveTo(bx - 7, by - 4); ctx.lineTo(bx + 7, by - 4); ctx.lineTo(bx, by + 4);
          ctx.closePath(); ctx.fill();
        }
      }
    }
  }

  // ───────────── 선택 목록 ─────────────
  class ListWindow {
    constructor(o) {
      this.o = Object.assign({ cols: 1, rowH: 30, maxRows: 8, cancel: true, size: 18, padX: 14, padY: 10, title: null }, o);
      this.items = o.items || [];
      this.cursor = Util.clamp(o.initial || 0, 0, Math.max(0, this.items.length - 1));
      this.scroll = 0;
      this.modal = true;
      this.active = true;
      this.closed = false;
      this.resolve = null;
      this.overFade = true;
      this.ensureVisible();
    }
    get rows() { return Math.ceil(this.items.length / this.o.cols); }
    get visRows() { return Math.min(this.o.maxRows, Math.max(1, this.rows)); }
    get titleH() { return this.o.title ? 30 : 0; }
    get rect() {
      const w = this.o.w || 200;
      const h = this.o.h || this.titleH + this.visRows * this.o.rowH + this.o.padY * 2;
      let x = this.o.x, y = this.o.y;
      if (this.o.anchor === 'bottom') y = this.o.y - h;
      x = Util.clamp(x, 2, Engine.W - w - 2);
      y = Util.clamp(y, 2, Engine.H - h - 2);
      return { x, y, w, h };
    }
    setItems(items, keepCursor = true) {
      this.items = items;
      if (!keepCursor) this.cursor = 0;
      this.cursor = Util.clamp(this.cursor, 0, Math.max(0, items.length - 1));
      this.ensureVisible();
    }
    ensureVisible() {
      const row = Math.floor(this.cursor / this.o.cols);
      if (row < this.scroll) this.scroll = row;
      if (row >= this.scroll + this.visRows) this.scroll = row - this.visRows + 1;
      this.scroll = Util.clamp(this.scroll, 0, Math.max(0, this.rows - this.visRows));
      if (this.o.onHover) this.o.onHover(this.items[this.cursor], this.cursor);
    }
    choose() {
      return new Promise((resolve) => { this.resolve = resolve; this.active = true; });
    }
    finish(val) {
      const r = this.resolve; this.resolve = null;
      if (r) r(val);
    }
    close() { this.closed = true; Engine.remove(this); this.finish(null); }
    move(dx, dy) {
      if (!this.items.length) return;
      const cols = this.o.cols;
      let c = this.cursor;
      if (cols === 1) {
        if (dy) c = (c + dy + this.items.length) % this.items.length;
        else return this.o.onLeftRight ? this.lr(dx) : undefined;
      } else {
        if (dx) {
          const col = c % cols;
          const nc = col + dx;
          if (nc >= 0 && nc < cols && c + dx < this.items.length) c += dx;
          else if (this.o.onLeftRight) return this.lr(dx);
        }
        if (dy) {
          c += dy * cols;
          if (c < 0) c = Math.min(this.items.length - 1, (this.rows - 1) * cols + (this.cursor % cols));
          if (c >= this.items.length) c = this.cursor % cols;
        }
      }
      if (c !== this.cursor) { this.cursor = c; Sound.sfx('cursor'); this.ensureVisible(); }
    }
    lr(dx) {
      const it = this.items[this.cursor];
      if (this.o.onLeftRight && this.o.onLeftRight(it, dx, this.cursor) !== false) Sound.sfx('cursor');
    }
    select() {
      const it = this.items[this.cursor];
      if (!it) return;
      if (it.disabled) { Sound.sfx('buzzer'); if (this.o.onDisabled) this.o.onDisabled(it); return; }
      if (!this.resolve) return;
      Sound.sfx('confirm');
      this.finish({ value: it.value !== undefined ? it.value : this.cursor, index: this.cursor, item: it });
    }
    onAction(a) {
      if (!this.resolve) return;
      if (a === 'up') this.move(0, -1);
      else if (a === 'down') this.move(0, 1);
      else if (a === 'left') this.move(-1, 0);
      else if (a === 'right') this.move(1, 0);
      else if (a === 'pageup') { this.cursor = Math.max(0, this.cursor - this.visRows * this.o.cols); this.ensureVisible(); Sound.sfx('cursor'); }
      else if (a === 'pagedown') { this.cursor = Math.min(this.items.length - 1, this.cursor + this.visRows * this.o.cols); this.ensureVisible(); Sound.sfx('cursor'); }
      else if (a === 'confirm') this.select();
      else if ((a === 'cancel' || (a === 'menu' && this.o.menuCancels)) && this.o.cancel) { Sound.sfx('cancel'); this.finish(null); }
    }
    hitIndex(px, py) {
      const { x, y, w } = this.rect;
      const cw = (w - this.o.padX * 2) / this.o.cols;
      const top = y + this.o.padY + this.titleH;
      const row = Math.floor((py - top) / this.o.rowH);
      const col = Math.floor((px - x - this.o.padX) / cw);
      if (row < 0 || row >= this.visRows || col < 0 || col >= this.o.cols) return -1;
      const idx = (row + this.scroll) * this.o.cols + col;
      return idx < this.items.length ? idx : -1;
    }
    onPointer(ev) {
      if (!this.resolve) return true;
      const r = this.rect;
      const inside = ev.x >= r.x && ev.x <= r.x + r.w && ev.y >= r.y && ev.y <= r.y + r.h;
      if (ev.type === 'wheel') {
        if (inside) { this.move(0, ev.dy); }
        return true;
      }
      if (ev.type === 'move') {
        const i = this.hitIndex(ev.x, ev.y);
        if (i >= 0 && i !== this.cursor) { this.cursor = i; this.ensureVisible(); }
        return true;
      }
      if (ev.type === 'down') {
        if (!inside) {
          if (this.o.outsideCancel && this.o.cancel) { Sound.sfx('cancel'); this.finish(null); }
          return true;
        }
        // 스크롤 화살표
        if (this.rows > this.visRows) {
          if (ev.y < r.y + this.o.padY + this.titleH + 4 && this.scroll > 0) { this.scroll--; return true; }
          if (ev.y > r.y + r.h - this.o.padY - 4 && this.scroll < this.rows - this.visRows) { this.scroll++; return true; }
        }
        const i = this.hitIndex(ev.x, ev.y);
        if (i >= 0) {
          if (this.o.onLeftRight && this.items[i] && this.items[i].lr) {
            // 설정 항목: 좌/우 절반 클릭으로 값 변경
            this.cursor = i;
            const mid = r.x + r.w * 0.62;
            this.lr(ev.x < mid ? -1 : 1);
            return true;
          }
          this.cursor = i; this.ensureVisible(); this.select();
        }
      }
      return true;
    }
    draw(ctx) {
      const { x, y, w, h } = this.rect;
      const o = this.o;
      drawWindow(ctx, x, y, w, h);
      if (o.title) {
        Text.draw(ctx, o.title, x + o.padX + 4, y + o.padY + 3, { size: 16, color: Theme.gold, bold: true, maxW: w - 30 });
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(x + 10, y + o.padY + 26, w - 20, 1);
      }
      const cw = (w - o.padX * 2) / o.cols;
      const top = y + o.padY + this.titleH;
      if (!this.items.length) {
        Text.draw(ctx, o.empty || '(없음)', x + o.padX + 20, top + 6, { size: o.size, color: Theme.disabled });
      }
      for (let r = 0; r < this.visRows; r++) {
        for (let c = 0; c < o.cols; c++) {
          const idx = (r + this.scroll) * o.cols + c;
          const it = this.items[idx];
          if (!it) continue;
          const ix = x + o.padX + c * cw, iy = top + r * o.rowH;
          const sel = idx === this.cursor;
          if (sel) {
            ctx.fillStyle = this.resolve ? Theme.select : 'rgba(255,255,255,0.07)';
            ctx.fillRect(ix, iy + 1, cw - 4, o.rowH - 2);
            if (this.resolve) cursorArrow(ctx, ix + 3, iy + o.rowH / 2, 9);
          }
          if (o.drawItem) { o.drawItem(ctx, it, ix + 18, iy, cw - 22, o.rowH, sel); continue; }
          const color = it.disabled ? Theme.disabled : it.color || Theme.text;
          const rightW = it.right != null ? Text.width(ctx, String(it.right), o.size - 2) + 8 : 0;
          Text.draw(ctx, it.label, ix + 18, iy + (o.rowH - o.size) / 2 - 1, { size: o.size, color, maxW: cw - 26 - rightW });
          if (it.right != null) Text.draw(ctx, String(it.right), ix + cw - 10, iy + (o.rowH - o.size) / 2, { size: o.size - 2, color: it.disabled ? Theme.disabled : it.rightColor || Theme.dim, align: 'right' });
        }
      }
      if (this.rows > this.visRows) {
        ctx.fillStyle = Theme.gold;
        const ax = x + w / 2;
        if (this.scroll > 0) { ctx.beginPath(); ctx.moveTo(ax - 6, top + 2); ctx.lineTo(ax + 6, top + 2); ctx.lineTo(ax, top - 5); ctx.fill(); }
        if (this.scroll < this.rows - this.visRows) { const by = y + h - 6; ctx.beginPath(); ctx.moveTo(ax - 6, by - 4); ctx.lineTo(ax + 6, by - 4); ctx.lineTo(ax, by + 3); ctx.fill(); }
      }
      if (o.help) {
        const it = this.items[this.cursor];
        const hb = o.help === true ? { x: 12, y: Engine.H - 76, w: Engine.W - 24, h: 64 } : o.help;
        drawWindow(ctx, hb.x, hb.y, hb.w, hb.h);
        if (it && it.desc) {
          const lines = Text.layout(ctx, it.desc, hb.w - 32, 16);
          Text.drawLines(ctx, lines.slice(0, Math.floor((hb.h - 16) / 22)), hb.x + 16, hb.y + 11, 22, 16);
        }
      }
    }
  }

  async function list(o) {
    const lw = new ListWindow(o);
    Engine.push(lw);
    const r = await lw.choose();
    lw.close();
    return r;
  }

  // ───────────── 수량 선택 ─────────────
  class NumberLayer {
    constructor(o) {
      this.o = o; this.v = o.initial || 1; this.modal = true; this.overFade = true;
    }
    open() { return new Promise((r) => { this.resolve = r; Engine.push(this); }); }
    end(v) { Engine.remove(this); const r = this.resolve; this.resolve = null; if (r) r(v); }
    change(d) {
      const nv = Util.clamp(this.v + d, this.o.min || 1, Math.max(this.o.min || 1, this.o.max));
      if (nv !== this.v) { this.v = nv; Sound.sfx('cursor'); }
    }
    onAction(a) {
      if (a === 'up') this.change(1);
      else if (a === 'down') this.change(-1);
      else if (a === 'right') this.change(10);
      else if (a === 'left') this.change(-10);
      else if (a === 'confirm') { Sound.sfx('confirm'); this.end(this.v); }
      else if (a === 'cancel') { Sound.sfx('cancel'); this.end(null); }
    }
    get rect() { return { x: this.o.x || 330, y: this.o.y || 200, w: 280, h: 112 }; }
    onPointer(ev) {
      if (ev.type === 'wheel') { this.change(-ev.dy); return true; }
      if (ev.type !== 'down') return true;
      const { x, y, w } = this.rect;
      if (ev.y >= y + 30 && ev.y <= y + 70) {
        if (ev.x < x + 70) this.change(-1);
        else if (ev.x > x + w - 70) this.change(1);
      } else if (ev.y > y + 74 && ev.y < y + 106 && ev.x > x && ev.x < x + w) { Sound.sfx('confirm'); this.end(this.v); }
      return true;
    }
    draw(ctx) {
      const { x, y, w, h } = this.rect;
      drawWindow(ctx, x, y, w, h);
      Text.draw(ctx, this.o.title || '수량', x + 16, y + 10, { size: 16, color: Theme.gold });
      Text.draw(ctx, '◀', x + 40, y + 40, { size: 20, color: Theme.dim, align: 'center' });
      Text.draw(ctx, '▶', x + w - 40, y + 40, { size: 20, color: Theme.dim, align: 'center' });
      Text.draw(ctx, '× ' + this.v, x + w / 2, y + 38, { size: 24, bold: true, align: 'center' });
      if (this.o.unit) Text.draw(ctx, '합계 ' + this.v * this.o.unit + 'G', x + w / 2, y + 80, { size: 17, color: Theme.gold, align: 'center' });
      else Text.draw(ctx, '결정', x + w / 2, y + 80, { size: 17, color: Theme.gold, align: 'center' });
    }
  }

  // ───────────── 이름 입력 (DOM — 한글 IME / 모바일 키보드 지원) ─────────────
  function prompt(title, def = '', maxLen = 6) {
    return new Promise((resolve) => {
      Input.setEnabled(false);
      Input.releaseAll();
      const wrap = document.createElement('div');
      wrap.className = 'name-entry';
      wrap.innerHTML = `<form><label>${title}</label><input type="text" maxlength="${maxLen}" autocomplete="off" spellcheck="false" />
        <div class="hint">최대 ${maxLen}글자 · 비워두면 기본 이름</div><button type="submit">결정</button></form>`;
      document.getElementById('game-wrap').appendChild(wrap);
      const input = wrap.querySelector('input');
      input.value = def;
      setTimeout(() => { input.focus(); input.select(); }, 50);
      wrap.querySelector('form').addEventListener('submit', (e) => {
        e.preventDefault();
        let v = input.value.replace(/[\[\]{}<>|\\]/g, '').trim().slice(0, maxLen);
        if (!v) v = def;
        wrap.remove();
        Input.setEnabled(true);
        Sound.sfx('confirm');
        resolve(v);
      });
    });
  }

  return {
    drawWindow, gauge, cursorArrow, roundRect, MessageLayer, ListWindow, NumberLayer, list, prompt,
    message(text, opts = {}) { return new MessageLayer(text, opts).open(); },
    number(o) { return new NumberLayer(o).open(); },
  };
})();


// ── src/gfx/pixel.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// Pix: 오프스크린 픽셀아트 생성 도구 (외부 이미지 리소스 없이 코드로 그린다)
// ─────────────────────────────────────────────────────────────
const Pix = (() => {
  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.imageSmoothingEnabled = false;
    return { c, g };
  }

  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((x) => x + x).join('') : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const rgbToHex = (r, g, b) => '#' + [r, g, b].map((v) => Util.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  function shade(hex, f) {
    const [r, g, b] = hexToRgb(hex);
    if (f < 0) return rgbToHex(r * (1 + f), g * (1 + f), b * (1 + f));
    return rgbToHex(r + (255 - r) * f, g + (255 - g) * f, b + (255 - b) * f);
  }
  function mix(a, b, t) {
    const A = hexToRgb(a), B = hexToRgb(b);
    return rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
  }

  // 픽셀 그리기 헬퍼
  class P {
    constructor(g, w, h) { this.g = g; this.w = w; this.h = h; }
    px(x, y, col) { if (!col) return; this.g.fillStyle = col; this.g.fillRect(x | 0, y | 0, 1, 1); }
    rect(x, y, w, h, col) { this.g.fillStyle = col; this.g.fillRect(x | 0, y | 0, w | 0, h | 0); }
    fill(col) { this.rect(0, 0, this.w, this.h, col); }
    // 결정적 노이즈 점 찍기
    noise(cols, density, seed = 1, area) {
      const [ax, ay, aw, ah] = area || [0, 0, this.w, this.h];
      for (let y = ay; y < ay + ah; y++)
        for (let x = ax; x < ax + aw; x++) {
          const r = Util.hash2(x, y, seed);
          if (r < density) this.px(x, y, cols[Math.floor(Util.hash2(y, x, seed + 7) * cols.length)]);
        }
    }
    circle(cx, cy, r, col) {
      for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.6) this.px(cx + x, cy + y, col);
    }
    ellipse(cx, cy, rx, ry, col) {
      for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) if ((x * x) / (rx * rx + 0.01) + (y * y) / (ry * ry + 0.01) <= 1.05) this.px(cx + x, cy + y, col);
    }
    line(x0, y0, x1, y1, col) {
      x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (;;) {
        this.px(x0, y0, col);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
    }
  }

  function make(w, h, fn) {
    const { c, g } = canvas(w, h);
    fn(new P(g, w, h), g);
    return c;
  }

  // 문자 템플릿 → 캔버스. pal: 문자 → 색
  function fromTemplate(rows, pal, opts = {}) {
    const h = rows.length, w = rows[0].length;
    const { c, g } = canvas(w, h);
    const img = g.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const ch = rows[y][x];
        const col = pal[ch];
        if (!col) continue;
        const [r, gg, b] = hexToRgb(col);
        const i = (y * w + x) * 4;
        img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    if (opts.outline) outline(c, opts.outline);
    return c;
  }

  // 투명 픽셀 중 불투명 픽셀과 맞닿은 곳에 외곽선
  function outline(c, color = '#14101e', diag = false) {
    const g = c.getContext('2d');
    const { width: w, height: h } = c;
    const src = g.getImageData(0, 0, w, h);
    const out = g.getImageData(0, 0, w, h);
    const [r, gg, b] = hexToRgb(color);
    const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 0 : src.data[(y * w + x) * 4 + 3]);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        if (A(x, y) > 0) continue;
        let n = A(x - 1, y) || A(x + 1, y) || A(x, y - 1) || A(x, y + 1);
        if (!n && diag) n = A(x - 1, y - 1) || A(x + 1, y - 1) || A(x - 1, y + 1) || A(x + 1, y + 1);
        if (n) { const i = (y * w + x) * 4; out.data[i] = r; out.data[i + 1] = gg; out.data[i + 2] = b; out.data[i + 3] = 255; }
      }
    g.putImageData(out, 0, 0);
    return c;
  }

  // 반투명(안티앨리어싱) 픽셀을 정리해 또렷한 픽셀아트로
  function crisp(c, threshold = 110) {
    const g = c.getContext('2d');
    const d = g.getImageData(0, 0, c.width, c.height);
    for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] < threshold ? 0 : 255;
    g.putImageData(d, 0, 0);
    return c;
  }

  function flipH(src) {
    const { c, g } = canvas(src.width, src.height);
    g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
    return c;
  }

  // 흰색 실루엣 (피격 깜빡임)
  function silhouette(src, color = '#ffffff') {
    const { c, g } = canvas(src.width, src.height);
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color; g.fillRect(0, 0, src.width, src.height);
    return c;
  }

  return { canvas, make, fromTemplate, outline, crisp, flipH, silhouette, shade, mix, hexToRgb, rgbToHex, P };
})();


// ── src/gfx/tiles.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// Tiles: 16x16 타일을 코드로 그려 캐시한다 (자동 타일: 물가, 벽면, 지붕)
// ─────────────────────────────────────────────────────────────
const Tiles = (() => {
  const S = 16;
  const cache = new Map();
  // 바닥 위에 올려 그리는 물체 타일
  const OBJ = new Set(['T', 'Y', 'Z', 'r', 'F', 'e', 'l', 'S', 'o', 'x', 'X', 'j', 'P', 'g', 'b', 't', 'h', 'p', 'a', 'z', '*', 'A', 'V', 'U', 'K', '|', 'O']);
  const ANIM = new Set(['~', '&', 'f', '*', 'V']);

  const C = {
    g0: '#5fae4c', g1: '#4f9b3f', g2: '#76c45e', g3: '#3f8a35',
    tree: '#2e7a3a', treeL: '#4aa048', treeD: '#1d5428', trunk: '#6b4426',
    pine: '#1f6038', pineL: '#2f7d48', pineD: '#123d24',
    water: '#3c7fd6', waterL: '#78b0f2', waterD: '#2b5fae', foam: '#d8ecff',
    path: '#c9a56a', pathD: '#b08c54', pathL: '#dcbd86',
    sand: '#e2cd90', sandD: '#cdb675',
    wood: '#b4783f', woodD: '#86542a', woodL: '#cf9658',
    stone: '#9d9cab', stoneD: '#727185', stoneL: '#bcbcca',
    roofR: '#c4473a', roofRD: '#8c2c26', roofRL: '#e06c52',
    roofB: '#3f63b8', roofBD: '#2b4587', roofBL: '#5f86d6',
    roofG: '#4b8a4c', roofGD: '#316235', roofGL: '#6aab66',
    floor: '#b98852', floorD: '#966838', floorL: '#cf9f66',
    wallIn: '#e2d2ae', wallInD: '#b7a27a', ceil: '#3b2b22',
    dWall: '#5e5a72', dWallD: '#433f55', dWallL: '#78748e', dTop: '#25222f',
    dFloor: '#4b4759', dFloorD: '#3c384a', dFloorL: '#5a566a',
    gold: '#f2c84b', dark: '#1a1424',
  };

  // ── 공용 그리기 조각 ──
  function grass(p, v) {
    p.fill(C.g0);
    p.noise([C.g1, C.g1, C.g2], 0.11, 3 + v);
    const tufts = [[3, 4], [11, 10], [6, 12], [12, 3]];
    for (let i = 0; i < 2 + (v % 2); i++) {
      const [x, y] = tufts[(i + v) % tufts.length];
      p.px(x, y + 1, C.g3); p.px(x + 1, y, C.g3); p.px(x + 2, y + 1, C.g3);
    }
  }
  function floorWood(p, v) {
    p.fill(C.floor);
    for (let y = 0; y < 16; y += 4) {
      p.rect(0, y + 3, 16, 1, C.floorD);
      const sx = ((y / 4 + v) % 2) * 8 + 3;
      p.px(sx, y, C.floorD); p.px(sx, y + 1, C.floorD); p.px(sx, y + 2, C.floorD);
      p.rect(0, y, 16, 1, C.floorL);
    }
  }
  function floorStone(p, v) {
    p.fill(C.dFloor);
    p.rect(0, 0, 16, 1, C.dFloorD); p.rect(0, 8, 16, 1, C.dFloorD);
    p.rect(v % 2 ? 4 : 10, 0, 1, 8, C.dFloorD); p.rect(v % 2 ? 12 : 6, 8, 1, 8, C.dFloorD);
    p.noise([C.dFloorL, C.dFloorD], 0.06, 20 + v);
  }
  function bricks(p, base, dark, light, rowH = 4) {
    p.fill(base);
    for (let y = 0; y < 16; y += rowH) {
      p.rect(0, y + rowH - 1, 16, 1, dark);
      const off = (y / rowH) % 2 ? 4 : 0;
      for (let x = off; x < 16; x += 8) p.rect(x, y, 1, rowH - 1, dark);
      p.rect(0, y, 16, 1, light);
    }
  }

  // ── 타일별 그리기 ── (p, v=변형, f=애니 프레임, nb=이웃)
  const D = {
    '.': (p, v) => grass(p, v),
    ',': (p, v) => { p.fill(C.g1); p.noise([C.g3, C.g0], 0.14, 9 + v); },
    '"': (p, v) => {
      grass(p, v);
      const cols = ['#ff6b8a', '#ffe066', '#ffffff', '#ff9a4d', '#b58cff'];
      const pts = [[3, 3], [10, 5], [5, 10], [12, 12], [8, 8]];
      for (let i = 0; i < 4; i++) {
        const [x, y] = pts[(i + v) % 5];
        const col = cols[(i + v * 2) % cols.length];
        p.px(x, y - 1, col); p.px(x - 1, y, col); p.px(x + 1, y, col); p.px(x, y + 1, col); p.px(x, y, '#ffd84a');
      }
    },
    ';': (p, v) => {
      p.fill(C.g1);
      for (let i = 0; i < 9; i++) {
        const x = (i * 5 + v * 3) % 15, y = 2 + ((i * 7) % 12);
        p.px(x, y, C.g2); p.px(x, y + 1, C.g3); p.px(x + 1, y - 1, C.g2); p.px(x + 1, y + 2, C.g3);
      }
    },
    'T': (p) => {
      p.ellipse(8, 14, 6, 2, 'rgba(0,0,0,0.25)');
      p.rect(7, 10, 3, 5, C.trunk); p.px(7, 10, '#4c2f18');
      p.circle(8, 6, 6, C.treeD); p.circle(8, 6, 5, C.tree);
      p.circle(6, 4, 3, C.treeL); p.px(5, 3, '#7ccc6c'); p.px(10, 8, C.treeD); p.px(11, 6, C.treeD);
    },
    'Z': (p) => D['T'](p), // 비밀 나무 — 똑같이 보인다
    'Y': (p) => {
      p.ellipse(8, 14, 5, 2, 'rgba(0,0,0,0.25)');
      p.rect(7, 12, 2, 3, C.trunk);
      for (let y = 1; y < 13; y++) {
        const w = Math.floor(y / 2) + 1 - (y % 4 === 0 ? 1 : 0);
        p.rect(8 - w, y, w * 2, 1, y % 4 < 2 ? C.pine : C.pineD);
        p.px(8 - w, y, C.pineL);
      }
    },
    '~': (p, v, f, nb) => {
      p.fill(C.water);
      for (let i = 0; i < 3; i++) {
        const y = (i * 5 + f * 2 + v) % 16, x = (i * 6 + v * 3 + f * 3) % 12;
        p.rect(x, y, 4, 1, C.waterL); p.rect(x + 1, y + 1, 2, 1, C.waterD);
      }
      if (nb) {
        const land = (c) => c !== undefined && c !== '~' && c !== '=' && c !== 'H' && c !== '$';
        if (land(nb.u)) { p.rect(0, 0, 16, 2, C.sand); p.rect(0, 2, 16, 1, C.foam); }
        if (land(nb.d)) { p.rect(0, 14, 16, 2, C.sand); p.rect(0, 13, 16, 1, C.foam); }
        if (land(nb.l)) { p.rect(0, 0, 2, 16, C.sand); p.rect(2, 0, 1, 16, C.foam); }
        if (land(nb.r)) { p.rect(14, 0, 2, 16, C.sand); p.rect(13, 0, 1, 16, C.foam); }
      }
    },
    '=': (p) => {
      p.fill(C.water);
      p.rect(0, 1, 16, 14, C.wood);
      for (let x = 0; x < 16; x += 4) p.rect(x, 1, 1, 14, C.woodD);
      p.rect(0, 1, 16, 1, C.woodD); p.rect(0, 14, 16, 1, C.woodD);
      p.rect(0, 2, 16, 1, C.woodL);
    },
    'H': (p) => {
      p.fill(C.water);
      p.rect(1, 0, 14, 16, C.wood);
      for (let y = 0; y < 16; y += 4) p.rect(1, y, 14, 1, C.woodD);
      p.rect(1, 0, 1, 16, C.woodD); p.rect(14, 0, 1, 16, C.woodD);
    },
    ':': (p, v) => {
      p.fill(C.path);
      p.noise([C.pathD, C.pathL], 0.1, 31 + v);
      p.px(4 + v, 5, '#9c7b47'); p.px(11 - v, 11, '#9c7b47');
    },
    's': (p, v) => { p.fill(C.sand); p.noise([C.sandD, '#f0e0aa'], 0.12, 41 + v); },
    '^': (p, v) => {
      grass(p, v);
      for (let y = 1; y < 16; y++) {
        const w = Math.floor((y * 7) / 15) + 1;
        p.rect(8 - w, y, w, 1, '#a39176');
        p.rect(8, y, w, 1, '#6f6150');
      }
      p.rect(7, 1, 2, 3, '#f4f4f4'); p.px(6, 3, '#f4f4f4'); p.px(9, 3, '#dcdce6');
      p.line(3, 14, 7, 7, '#8a7a62');
    },
    'r': (p) => {
      p.ellipse(8, 13, 6, 2, 'rgba(0,0,0,0.25)');
      p.ellipse(8, 9, 6, 5, C.stoneD); p.ellipse(7, 8, 5, 4, C.stone); p.px(5, 6, C.stoneL); p.px(6, 6, C.stoneL); p.px(5, 7, C.stoneL);
    },
    'F': (p) => {
      p.rect(0, 5, 16, 2, '#9a6a38'); p.rect(0, 10, 16, 2, '#9a6a38');
      p.rect(0, 5, 16, 1, '#c08850');
      p.rect(2, 3, 3, 12, '#8a5a2c'); p.rect(11, 3, 3, 12, '#8a5a2c'); p.rect(2, 3, 3, 1, '#c08850'); p.rect(11, 3, 3, 1, '#c08850');
    },
    'e': (p) => {
      p.ellipse(8, 9, 7, 6, '#245e2c'); p.ellipse(8, 8, 7, 6, '#357a38'); p.circle(5, 6, 2, '#4f9a48'); p.circle(11, 8, 2, '#4f9a48');
    },
    'u': (p, v) => {
      p.fill('#8a5a34');
      for (let y = 1; y < 16; y += 4) { p.rect(0, y, 16, 2, '#6f4426'); }
      for (let x = 2 + v; x < 16; x += 5) { p.px(x, 0, '#5ea84a'); p.px(x, 4, '#5ea84a'); p.px(x + 1, 8, '#5ea84a'); p.px(x, 12, '#5ea84a'); }
    },
    'q': (p, v) => {
      p.fill('#a49f94');
      for (let y = 0; y < 16; y += 5) for (let x = (y / 5) % 2 ? 0 : 3; x < 16; x += 6) {
        p.rect(x, y, 5, 4, '#bdb8ac'); p.rect(x, y + 3, 5, 1, '#8a857a');
      }
      p.noise(['#8a857a'], 0.04, 50 + v);
    },
    'l': (p, v, f) => {
      p.rect(7, 6, 2, 9, '#3a3a48'); p.rect(6, 14, 4, 2, '#3a3a48');
      p.rect(5, 1, 6, 5, '#2a2a36'); p.rect(6, 2, 4, 3, f ? '#ffe9a0' : '#ffd86a');
    },
    'S': (p) => {
      p.rect(7, 8, 2, 8, '#6b4426');
      p.rect(2, 3, 12, 7, '#4c2f18'); p.rect(3, 4, 10, 5, '#c08a50');
      p.rect(4, 5, 7, 1, '#7a5230'); p.rect(4, 7, 5, 1, '#7a5230');
    },
    'o': (p) => {
      p.ellipse(8, 9, 7, 6, '#6f6e7c'); p.ellipse(8, 9, 6, 5, '#8e8d9c'); p.ellipse(8, 9, 4, 3, '#1d3e70'); p.ellipse(8, 10, 3, 2, '#2c5ca0');
      p.rect(2, 1, 1, 8, '#6b4426'); p.rect(13, 1, 1, 8, '#6b4426'); p.rect(1, 0, 14, 2, '#8e2e28');
    },
    'x': (p) => {
      p.ellipse(8, 14, 5, 2, 'rgba(0,0,0,0.3)');
      p.rect(3, 3, 10, 11, '#8a5a2c'); p.rect(4, 2, 8, 1, '#8a5a2c'); p.rect(4, 14, 8, 1, '#6b4426');
      p.rect(3, 5, 10, 1, '#444'); p.rect(3, 11, 10, 1, '#444'); p.rect(5, 3, 2, 11, '#a8743e');
      p.ellipse(8, 3, 4, 1, '#6b4426');
    },
    'X': (p) => {
      p.rect(2, 3, 12, 12, '#a8743e'); p.rect(2, 3, 12, 1, '#cf9658'); p.rect(2, 14, 12, 1, '#6b4426');
      p.rect(2, 3, 1, 12, '#6b4426'); p.rect(13, 3, 1, 12, '#6b4426');
      p.line(3, 4, 12, 13, '#6b4426'); p.line(12, 4, 3, 13, '#6b4426');
    },
    'j': (p) => {
      p.ellipse(8, 14, 5, 1, 'rgba(0,0,0,0.3)');
      p.ellipse(8, 10, 5, 5, '#a8582e'); p.rect(6, 3, 5, 3, '#a8582e'); p.rect(5, 2, 7, 2, '#c8784a'); p.px(6, 8, '#d89068'); p.px(6, 9, '#d89068');
    },
    'P': (p) => {
      p.rect(3, 13, 10, 3, C.stoneD); p.rect(4, 2, 8, 12, C.stone); p.rect(4, 2, 2, 12, C.stoneL); p.rect(10, 2, 2, 12, C.stoneD);
      p.rect(3, 0, 10, 3, C.stoneL); p.rect(3, 2, 10, 1, C.stoneD);
    },
    'g': (p) => {
      p.rect(4, 4, 8, 11, '#8e8d9c'); p.ellipse(8, 4, 4, 3, '#8e8d9c'); p.rect(7, 5, 2, 6, '#5d5c6a'); p.rect(5, 7, 6, 2, '#5d5c6a');
      p.rect(3, 14, 10, 2, '#5d7a40');
    },
    'm': (p, v) => {
      p.fill('#d8c8a0');
      for (let y = 2; y < 16; y += 5) p.rect(0, y, 16, 1, '#b4a07a');
      p.rect(0, 0, 1, 16, '#b4a07a'); p.rect(15, 0, 1, 16, '#9c8a64');
      p.noise(['#c4b48c'], 0.08, 61 + v);
    },
    'W': (p, v, f, nb) => {
      p.fill(C.wood);
      for (let y = 0; y < 16; y += 4) { p.rect(0, y + 3, 16, 1, C.woodD); p.rect(0, y, 16, 1, C.woodL); }
      p.rect(0, 0, 2, 16, C.woodD);
      p.rect(0, 14, 16, 2, '#6f6e7c');
    },
    'B': (p) => { bricks(p, C.stone, C.stoneD, C.stoneL); p.rect(0, 14, 16, 2, '#5c5b6a'); },
    'n': (p, v, f, nb) => {
      D['W'](p, v, f, nb);
      p.rect(3, 3, 10, 8, '#5b3b1e'); p.rect(4, 4, 8, 6, '#9fd3ff'); p.rect(4, 4, 3, 2, '#e0f2ff');
      p.rect(7, 4, 1, 6, '#5b3b1e'); p.rect(4, 7, 8, 1, '#5b3b1e'); p.rect(2, 11, 12, 1, '#7a5230');
    },
    'N': (p, v, f, nb) => {
      D['B'](p, v, f, nb);
      p.rect(4, 2, 8, 9, '#3a3a48'); p.rect(5, 3, 6, 7, '#ffe9a0'); p.rect(5, 3, 6, 2, '#fff6cc'); p.rect(7, 3, 2, 7, '#3a3a48');
    },
    'R': (p, v, f, nb) => roof(p, nb, C.roofR, C.roofRD, C.roofRL, 'R'),
    'Q': (p, v, f, nb) => roof(p, nb, C.roofB, C.roofBD, C.roofBL, 'Q'),
    'G': (p, v, f, nb) => roof(p, nb, C.roofG, C.roofGD, C.roofGL, 'G'),
    'D': (p) => {
      p.fill(C.woodD);
      p.rect(2, 1, 12, 15, '#3d2410'); p.rect(3, 2, 10, 14, '#7a4a22');
      for (let x = 5; x < 13; x += 3) p.rect(x, 3, 1, 13, '#5e3818');
      p.rect(3, 2, 10, 1, '#9a6234'); p.px(11, 9, C.gold); p.px(11, 10, '#b88a2a');
    },
    'V': (p, v, f) => {
      grass(p, 1);
      // 작은 마을: 집 세 채 + 깃발
      const house = (x, y, roofCol) => {
        p.rect(x, y + 3, 6, 4, '#e8dcc0'); p.rect(x + 2, y + 5, 2, 2, '#5b3b1e');
        for (let i = 0; i < 4; i++) p.rect(x - 1 + i, y + 3 - i, 8 - i * 2, 1, roofCol);
      };
      house(1, 7, C.roofR); house(9, 6, C.roofB); house(5, 1, C.roofR);
      p.rect(14, 0, 1, 6, '#5b3b1e'); p.rect(11, 0 + f, 3, 2, '#ffd75e');
    },
    'U': (p) => {
      grass(p, 2);
      p.rect(1, 2, 14, 13, C.stoneD); p.rect(2, 1, 12, 2, C.stone);
      p.rect(2, 3, 3, 12, C.stone); p.rect(11, 3, 3, 12, C.stone);
      p.rect(5, 5, 6, 10, '#100c18'); p.rect(6, 4, 4, 1, '#100c18');
      p.px(3, 6, C.stoneL); p.px(12, 9, C.stoneL); p.rect(7, 2, 2, 1, '#7cc4ff');
    },
    'K': (p) => {
      grass(p, 3);
      p.rect(3, 8, 10, 7, '#8a5a2c'); p.rect(3, 8, 10, 1, '#a8743e'); p.rect(7, 11, 3, 4, '#3d2410');
      for (let i = 0; i < 5; i++) p.rect(2 + i, 7 - i, 12 - i * 2, 1, '#6b4426');
      p.rect(11, 1, 2, 4, '#5d5c6a'); p.px(12, 0, '#ddd');
    },
    // 실내
    'I': (p, v, f, nb) => {
      const face = nb && nb.d !== undefined && nb.d !== 'I';
      if (face) {
        p.fill(C.wallIn);
        p.rect(0, 0, 16, 2, '#6b4a30'); p.rect(0, 13, 16, 3, '#8a6440'); p.rect(0, 13, 16, 1, '#a88058');
        p.noise([C.wallInD], 0.05, 71 + v);
      } else {
        p.fill(C.ceil); p.noise(['#33251d', '#45342a'], 0.15, 73 + v);
      }
    },
    'w': (p, v) => floorWood(p, v),
    'c': (p, v, f, nb) => {
      p.fill('#a8304a'); p.noise(['#962840', '#b83c58'], 0.12, 81 + v);
      const edge = (c) => c !== undefined && c !== 'c';
      if (nb) {
        if (edge(nb.u)) p.rect(0, 0, 16, 2, C.gold);
        if (edge(nb.d)) p.rect(0, 14, 16, 2, C.gold);
        if (edge(nb.l)) p.rect(0, 0, 2, 16, C.gold);
        if (edge(nb.r)) p.rect(14, 0, 2, 16, C.gold);
      }
    },
    'k': (p, v) => {
      floorWood(p, v);
      p.rect(0, 0, 16, 10, '#c8925a'); p.rect(0, 0, 16, 2, '#e0aa70'); p.rect(0, 10, 16, 6, '#7a4a22'); p.rect(0, 10, 16, 1, '#5e3818');
      p.px(3 + v * 3, 4, '#a8743e');
    },
    'L': (p) => {
      p.fill('#5e3818'); p.rect(1, 1, 14, 14, '#3d2410');
      const cols = ['#c0443a', '#3f63b8', '#4b8a4c', '#d8b040', '#8a4ab0', '#e07a40'];
      for (let row = 0; row < 3; row++) {
        let x = 2;
        let i = row * 2;
        while (x < 14) {
          const w = 1 + ((i * 7) % 3 === 0 ? 1 : 0);
          p.rect(x, 2 + row * 5, w, 4, cols[i % cols.length]);
          x += w + (i % 4 === 0 ? 1 : 0); i++;
        }
        p.rect(1, 6 + row * 5, 14, 1, '#7a4a22');
      }
    },
    'b': (p) => {
      p.rect(1, 0, 14, 16, '#7a4a22'); p.rect(2, 1, 12, 14, '#f0f0f0'); p.rect(3, 2, 10, 4, '#ffffff'); p.rect(3, 5, 10, 1, '#c8c8d8');
      p.rect(2, 7, 12, 8, '#4a6ec8'); p.rect(2, 7, 12, 1, '#6a8ee8'); p.rect(2, 14, 12, 1, '#2b4587');
    },
    't': (p) => {
      p.ellipse(8, 14, 6, 1, 'rgba(0,0,0,0.3)');
      p.rect(1, 3, 14, 9, '#9a6234'); p.rect(1, 3, 14, 2, '#c08050'); p.rect(2, 12, 2, 3, '#5e3818'); p.rect(12, 12, 2, 3, '#5e3818');
      p.rect(6, 5, 4, 3, '#f0f0f0'); p.px(7, 4, '#ffd75e');
    },
    'h': (p) => { p.ellipse(8, 12, 4, 1, 'rgba(0,0,0,0.3)'); p.ellipse(8, 8, 4, 3, '#8a5a2c'); p.ellipse(8, 7, 3, 2, '#b4783f'); p.rect(5, 9, 1, 4, '#5e3818'); p.rect(10, 9, 1, 4, '#5e3818'); },
    'p': (p) => {
      p.rect(5, 10, 6, 5, '#a8582e'); p.rect(4, 10, 8, 2, '#c8784a');
      p.circle(8, 6, 4, '#2e7a3a'); p.circle(6, 4, 2, '#4aa048'); p.circle(10, 5, 2, '#4aa048'); p.px(8, 2, '#ff6b8a');
    },
    'f': (p, v, f) => {
      bricks(p, '#8a6a5a', '#5e463a', '#a88878', 4);
      p.rect(3, 6, 10, 10, '#1a1010');
      const fl = f ? ['#ffb040', '#ff7020', '#ffe080'] : ['#ff9030', '#ff5a20', '#ffd060'];
      p.rect(5, 11, 6, 4, fl[1]); p.rect(6, 9 + f, 4, 4, fl[0]); p.rect(7, 8 - f, 2, 3, fl[2]);
      p.rect(4, 14, 8, 2, '#5e3818');
    },
    'E': (p, v) => { floorWood(p, v); p.rect(2, 4, 12, 10, '#7a3a2a'); p.rect(3, 5, 10, 8, '#a8503a'); p.rect(3, 8, 10, 1, '#c8784a'); },
    'A': (p) => {
      p.rect(1, 5, 14, 11, '#9d9cab'); p.rect(1, 5, 14, 2, '#bcbcca'); p.rect(3, 7, 10, 8, '#f0e8d0'); p.rect(7, 7, 2, 8, '#c4473a');
      p.rect(3, 1, 2, 4, '#f4f4f4'); p.px(3, 0, '#ffd75e'); p.rect(11, 1, 2, 4, '#f4f4f4'); p.px(12, 0, '#ffd75e');
    },
    'a': (p) => {
      p.ellipse(8, 14, 6, 1, 'rgba(0,0,0,0.3)');

    '|': (p) => {

      if (nb.u !== self) { p.rect(0, 0, 16, 2, light); p.rect(0, 2, 16, 1, dark); }

  function get(ch, v, f, nbKey, nb) {

    let c = cache.get(key);

    c = Pix.make(S, S, (p) => {

  const MINI = {
    '.': '#5fae4c', ',': '#4f9b3f', '"': '#7cc760', ';': '#4f9b3f', 'T': '#2e7a3a', 'Y': '#1f6038', 'Z': '#2e7a3a',
    '~': '#3c7fd6', '=': '#b4783f', 'H': '#b4783f', ':': '#c9a56a', 's': '#e2cd90', '^': '#8a7a64', 'r': '#9d9cab',

    'I': '#3b2b22', 'w': '#b98852', 'c': '#a8304a', '#': '#25222f', '_': '#4b4759', '-': '#4b4759', '>': '#ffd75e', '<': '#ffd75e',

// ── src/gfx/chars.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// Chars: 인물 스프라이트 생성기 (16x20, 4방향 x 2프레임)
//  기본 몸 템플릿 + 머리 모양(스타일) 오버레이 + 자동 외곽선/음영
// ─────────────────────────────────────────────────────────────
const Chars = (() => {
  const W = 16, H = 20;
  const T = {
    down: [
      '................', '................', '................', '................', '................',
      '.....hhhhhh.....', '....hhhhhhhh....', '....hhhhhhhh....', '....hssssssh....', '....ssessess....',
      '....ssssssss....', '.....ssssss.....', '....cccccccc....', '...cccccccccc...', '...sccccccccs...',
      '....aaaaaaaa....', '....pppppppp....', '....ppp..ppp....', '....bbb..bbb....', '................',
    ],
    downStep: [
      null, null, null, null, null, null, null, null, null, null, null, null,
      '....cccccccc....', '...cccccccccc...', '...sccccccccs...', '....aaaaaaaa....', '....pppppppp....',
      '....ppp..bbb....', '....bbb.........', '................',
    ],
    up: [
      '................', '................', '................', '................', '................',
      '.....hhhhhh.....', '....hhhhhhhh....', '....hhhhhhhh....', '....hhhhhhhh....', '....hhhhhhhh....',
      '....hhhhhhhh....', '.....hhhhhh.....', '....cccccccc....', '...cccccccccc...', '...sccccccccs...',
      '....aaaaaaaa....', '....pppppppp....', '....ppp..ppp....', '....bbb..bbb....', '................',
    ],
    upStep: [
      null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null,
      '....ppp..bbb....', '....bbb.........', '................',
    ],
    left: [
      '................', '................', '................', '................', '................',
      '.....hhhhhh.....', '....hhhhhhhh....', '...hhhhhhhhh....', '...hsshhhhhh....', '...sesshhhhh....',
      '...sssshhhhh....', '....ssssshh.....', '.....cccccc.....', '.....cccccc.....', '.....cscccc.....',
      '.....aaaaaa.....', '.....pppppp.....', '......pppp......', '.....bbbbb......', '................',
    ],
    leftStep: [
      null, null, null, null, null, null, null, null, null, null, null, null,
      '.....cccccc.....', '....ccccccc.....', '....sccccccs....', '.....aaaaaa.....', '.....pppppp.....',
      '....ppp..pp.....', '...bbb....bb....', '................',
    ],
  };

  function baseGrid(dir, step) {
    const key = dir === 'right' ? 'left' : dir;
    const rows = T[key].slice();
    if (step) {
      const s = T[key + 'Step'];
      for (let i = 0; i < s.length; i++) if (s[i]) rows[i] = s[i];
    }
    return rows.map((r) => r.split(''));
  }

  function set(g, x, y, ch) { if (y >= 0 && y < H && x >= 0 && x < W) g[y][x] = ch; }
  function fillRow(g, y, x0, x1, ch) { for (let x = x0; x <= x1; x++) set(g, x, y, ch); }

  // 머리/장식 스타일 적용
  function applyStyle(g, dir, style, extras) {
    const d = dir === 'right' ? 'left' : dir;
    switch (style) {
      case 'spiky':
        if (d === 'down') { set(g, 5, 4, 'h'); set(g, 7, 3, 'h'); set(g, 7, 4, 'h'); set(g, 10, 4, 'h'); set(g, 3, 8, 'h'); set(g, 12, 8, 'h'); set(g, 9, 8, 's'); set(g, 6, 8, 'h'); }
        if (d === 'up') { set(g, 5, 4, 'h'); set(g, 7, 3, 'h'); set(g, 7, 4, 'h'); set(g, 10, 4, 'h'); set(g, 3, 8, 'h'); set(g, 12, 8, 'h'); }
        if (d === 'left') { set(g, 6, 4, 'h'); set(g, 9, 3, 'h'); set(g, 9, 4, 'h'); set(g, 12, 6, 'h'); set(g, 12, 8, 'h'); }
        break;
      case 'long':
        if (d === 'down') for (let y = 7; y <= 14; y++) { set(g, 3, y, 'h'); set(g, 12, y, 'h'); }
        if (d === 'up') for (let y = 11; y <= 15; y++) fillRow(g, y, 4, 11, 'h');
        if (d === 'left') for (let y = 9; y <= 15; y++) fillRow(g, y, 9, 11, 'h');
        break;
      case 'pony':
        if (d === 'up') for (let y = 9; y <= 15; y++) fillRow(g, y, 7, 8, 'h');
        if (d === 'left') for (let y = 8; y <= 13; y++) set(g, 12, y, 'h');
        if (d === 'down') { set(g, 12, 9, 'h'); set(g, 12, 10, 'h'); set(g, 3, 9, 'h'); }
        break;
      case 'bun':
        fillRow(g, 3, 6, 9, 'h'); fillRow(g, 4, 6, 9, 'h');
        break;
      case 'bald':
        if (d === 'down') { fillRow(g, 5, 5, 10, 's'); fillRow(g, 6, 5, 10, 's'); fillRow(g, 7, 5, 10, 's'); }
        if (d === 'left') { fillRow(g, 5, 5, 8, 's'); fillRow(g, 6, 4, 8, 's'); fillRow(g, 7, 4, 7, 's'); }
        if (d === 'up') { fillRow(g, 5, 5, 10, 's'); fillRow(g, 6, 5, 10, 's'); }
        break;
      case 'hood':
        if (d === 'down') { fillRow(g, 4, 6, 9, 'h'); for (let y = 8; y <= 11; y++) { set(g, 3, y, 'h'); set(g, 12, y, 'h'); } set(g, 4, 9, 'h'); set(g, 11, 9, 'h'); }
        if (d === 'up') { fillRow(g, 4, 6, 9, 'h'); for (let y = 11; y <= 14; y++) fillRow(g, y, 5, 10, 'h'); }
        if (d === 'left') { fillRow(g, 4, 6, 9, 'h'); for (let y = 8; y <= 13; y++) fillRow(g, y, 9, 12, 'h'); }
        break;
      case 'hat':
        if (d === 'left') {
          set(g, 11, 0, 't'); fillRow(g, 1, 9, 11, 't'); fillRow(g, 2, 8, 10, 't'); fillRow(g, 3, 6, 10, 't'); fillRow(g, 4, 5, 10, 't');
          fillRow(g, 5, 2, 13, 't'); fillRow(g, 6, 3, 12, 'T');
        } else {
          set(g, 9, 0, 't'); fillRow(g, 1, 8, 9, 't'); fillRow(g, 2, 7, 9, 't'); fillRow(g, 3, 6, 10, 't'); fillRow(g, 4, 5, 10, 't');
          fillRow(g, 5, 2, 13, 't'); fillRow(g, 6, 4, 11, 'T');
        }
        break;
      case 'helmet':
        for (let y = 5; y <= 7; y++) for (let x = 3; x <= 12; x++) if (g[y][x] === 'h' || y === 7) { if (x >= 4 && x <= 11) set(g, x, y, 'm'); }
        fillRow(g, 4, 6, 9, 'm'); set(g, 7, 3, 'r'); set(g, 8, 3, 'r'); set(g, 7, 2, 'r');
        if (d === 'down') { set(g, 4, 8, 'm'); set(g, 11, 8, 'm'); }
