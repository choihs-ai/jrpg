      case 'bandana':
        if (d !== 'up') fillRow(g, 7, 4, 11, 't');
        else { fillRow(g, 7, 4, 11, 't'); set(g, 9, 8, 't'); set(g, 10, 9, 't'); }
        break;
      case 'cap':
        fillRow(g, 5, 5, 10, 't'); fillRow(g, 6, 4, 11, 't');
        if (d === 'down') fillRow(g, 7, 3, 12, 'T');
        if (d === 'left') { fillRow(g, 7, 1, 6, 'T'); }
        break;
    }
    for (const ex of extras || []) {
      if (ex === 'long') applyStyle(g, dir, 'long', []);
      if (ex === 'beard') {
        if (d === 'down') { fillRow(g, 10, 4, 11, 'h'); fillRow(g, 11, 5, 10, 'h'); fillRow(g, 12, 6, 9, 'h'); set(g, 6, 10, 's'); set(g, 9, 10, 's'); }
        if (d === 'left') { fillRow(g, 10, 3, 6, 'h'); fillRow(g, 11, 4, 7, 'h'); fillRow(g, 12, 5, 6, 'h'); }
      }
      if (ex === 'apron') {
        if (d === 'down') for (let y = 13; y <= 17; y++) fillRow(g, y, 5, 10, y === 15 ? 'W' : 'W');
        if (d === 'left') for (let y = 13; y <= 16; y++) fillRow(g, y, 5, 6, 'W');
      }
      if (ex === 'cape') {
        if (d === 'up') for (let y = 12; y <= 17; y++) fillRow(g, y, 4, 11, 'C');
        if (d === 'left') for (let y = 12; y <= 17; y++) fillRow(g, y, 10, 11, 'C');
        if (d === 'down') { set(g, 3, 12, 'C'); set(g, 12, 12, 'C'); }
      }
      if (ex === 'robe') {
        if (d !== 'left') { fillRow(g, 16, 4, 11, 'c'); fillRow(g, 17, 3, 12, 'c'); }
        else { fillRow(g, 16, 5, 10, 'c'); fillRow(g, 17, 4, 11, 'c'); }
      }
      if (ex === 'blush' && d === 'down') { set(g, 5, 10, 'k'); set(g, 10, 10, 'k'); }
      if (ex === 'glasses' && d === 'down') { set(g, 6, 9, 'G'); set(g, 9, 9, 'G'); fillRow(g, 9, 5, 10, 'G'); set(g, 6, 9, 'e'); set(g, 9, 9, 'e'); }
      if (ex === 'scarf') {
        if (d === 'down') fillRow(g, 12, 4, 11, 'r');
        if (d === 'left') { fillRow(g, 12, 5, 11, 'r'); set(g, 12, 13, 'r'); }
        if (d === 'up') { fillRow(g, 12, 4, 11, 'r'); set(g, 9, 13, 'r'); set(g, 9, 14, 'r'); }

      if (ex === 'sword') {

      if (ex === 'axe') {
        if (d === 'down') { for (let y = 9; y <= 15; y++) set(g, 13, y, 'S'); fillRow(g, 9, 13, 14, 'M'); fillRow(g, 10, 13, 15, 'M'); }
        if (d === 'up') { for (let y = 11; y <= 17; y++) set(g, 9, y, 'S'); fillRow(g, 11, 8, 10, 'M'); }

    }
  }

  const DEF_PAL = {
    h: '#5a3a22', s: '#f6cfa6', e: '#1b1430', c: '#3f63b8', a: '#6b4426', p: '#3a3a48', b: '#5e3818',
    t: '#6a3fa0', T: '#4a2a78', m: '#b8bccc', r: '#c4473a', W: '#f4f4f4', C: '#a8304a', k: '#f4a0a0',
    G: '#3a3a48', S: '#7a4a22', y: '#7cc4ff', M: '#d8dce8',
  };

  function shadeGrid(c) {

    const g = c.getContext('2d');
    const d = g.getImageData(0, 0, c.width, c.height);
    const w = c.width, h = c.height;
    const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 0 : d.data[(y * w + x) * 4 + 3]);
    const out = new Uint8ClampedArray(d.data);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {

        if (!d.data[i + 3]) continue;

        else if (!A(x - 1, y) || !A(x, y - 1)) { out[i] = Math.min(255, out[i] * 1.08 + 6); out[i + 1] = Math.min(255, out[i + 1] * 1.08 + 6); out[i + 2] = Math.min(255, out[i + 2] * 1.08 + 6); }
      }
    d.data.set(out);
    g.putImageData(d, 0, 0);
  }

  const cache = new Map();

  // look: {hair, skin, cloth, accent, pants, boots, hat, hatDark, style, extras:[...]}
  function build(look) {
    const key = JSON.stringify(look);
    if (cache.has(key)) return cache.get(key);
    const pal = Object.assign({}, DEF_PAL, {
      h: look.hair || DEF_PAL.h, s: look.skin || DEF_PAL.s, c: look.cloth || DEF_PAL.c, a: look.accent || DEF_PAL.a,
      p: look.pants || DEF_PAL.p, b: look.boots || DEF_PAL.b, t: look.hat || DEF_PAL.t,

      r: look.scarf || DEF_PAL.r, W: look.apron || DEF_PAL.W, e: look.eye || DEF_PAL.e,
    });
    const frames = {};
    for (const dir of ['down', 'up', 'left', 'right']) {
      frames[dir] = [0, 1].map((step) => {
        const g = baseGrid(dir, step);
        applyStyle(g, dir, look.style || 'short', look.extras);
        let c = Pix.fromTemplate(g.map((r) => r.join('')), pal);
        shadeGrid(c);
        Pix.outline(c, '#1a1226');
        if (dir === 'right') c = Pix.flipH(c);
        return c;
      });
    }
    // 위/아래 걷기: 디딤 프레임을 좌우반전해 반대 발도 표현
    frames.downAlt = Pix.flipH(frames.down[1]);
    frames.upAlt = Pix.flipH(frames.up[1]);

  // 걷기 사이클: 서기 → 디딤 → 서기 → 반대 디딤
  function frameFor(frames, dir, phase) {
    const p = phase % 4;
    if (p === 0 || p === 2) return frames[dir][0];
    if (p === 1) return frames[dir][1];
    if (dir === 'down') return frames.downAlt;
    if (dir === 'up') return frames.upAlt;
    return frames[dir][1];
  }

  const CRITTERS = {

      rows: [

        '................', '................', '................', '.B.B............', '.fffB...........', 'nefef.......f...', '.ffff......f....',
        '..ffffffffff....', '..fwffffffff....', '..ff.f...f.f....', '..ff.f...f.f....', '................', '................',
      ],
      step: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, '..f..f..f..f....', '.ff..f..f...f...'],
    },

        '..rwrrrrrrwrr...', '..RRRRRRRRRRR...', '....sssssss.....', '....seesees.....', '....smmmmms.....', '....sssssss.....', '.....sssss......',
        '.....ss.ss......', '................', '................', '................', '................', '................',
      ],
      step: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, '....ss...ss.....'],
    },
  };
  const critterCache = new Map();
  function critter(kind) {
    if (critterCache.has(kind)) return critterCache.get(kind);
    const def = CRITTERS[kind];
    const mk = (step) => {
      const rows = def.rows.slice();
      if (step && def.step) def.step.forEach((r, i) => { if (r) rows[i] = r; });
      const c = Pix.fromTemplate(rows, def.pal);
      shadeGrid(c);
      return Pix.outline(c, '#1a1226');
    };
    const l0 = mk(0), l1 = mk(1);
    const r0 = Pix.flipH(l0), r1 = Pix.flipH(l1);
    const frames = { left: [l0, l1], right: [r0, r1], down: [l0, l1], up: [r0, r1], downAlt: l1, upAlt: r1, critter: true };
    critterCache.set(kind, frames);
    return frames;
  }

  return { build, frameFor, critter, W, H };

  const cache = new Map();
  function render(artId, pal, opts = {}) {
    const key = artId + JSON.stringify(pal) + (opts.scale || 1);
    if (cache.has(key)) return cache.get(key);
    const a = ART[artId] || ART.jelly;
    const scale = opts.scale || 1;
    const { c, g } = Pix.canvas(Math.ceil(a.w * scale) + 2, Math.ceil(a.h * scale) + 2);
    g.save();
    g.translate(1, 1);
    g.scale(scale, scale);
    a.draw(g, pal);
    g.restore();
    Pix.crisp(c, 100);
    Pix.outline(c, '#120a1a');
    cache.set(key, c);
    return c;
  }
  // 몬스터 ID로 그리기 (전투용)
  function forMonster(id, variant) {
    const m = MONSTERS[id];
    const pal = Object.assign({}, m.pal, m.shiny ? { shiny: true } : {}, variant === 2 ? { phase2: true } : {});
    return render(m.art, pal);
  }
  return { render, forMonster, ART };
})();

'use strict';
// ─────────────────────────────────────────────────────────────
// ObjArt: 필드 오브젝트 그림 (보물상자, 레버, 약초, 쪽지, 반짝임, 풍차 날개, 거대한 종)
// ─────────────────────────────────────────────────────────────
const ObjArt = (() => {
  const cache = {};
  const once = (k, w, h, fn) => cache[k] || (cache[k] = (() => { const c = Pix.make(w, h, fn); return c; })());

  function chest(open, color = 'wood') {
    return once('chest' + open + color, 16, 16, (p) => {
      const body = color === 'red' ? '#a8304a' : '#a8743e', dark = color === 'red' ? '#701a30' : '#6b4426', band = '#f2c84b';
      p.ellipse(8, 14, 7, 2, 'rgba(0,0,0,0.3)');
      p.rect(1, 7, 14, 8, dark); p.rect(2, 8, 12, 6, body);
      if (!open) {
        p.rect(1, 3, 14, 5, dark); p.rect(2, 3, 12, 4, body); p.rect(2, 3, 12, 1, '#d8a060');
        p.rect(1, 7, 14, 1, band); p.rect(7, 6, 2, 4, band); p.px(7, 8, '#5a3418');
      } else {
        p.rect(1, 1, 14, 4, dark); p.rect(2, 2, 12, 2, body); p.rect(2, 5, 12, 3, '#1a1010'); p.rect(1, 7, 14, 1, band);
      }
      p.rect(1, 13, 14, 1, band);
    });
  }
  function lever(on) {
    return once('lever' + on, 16, 16, (p) => {
      p.rect(3, 10, 10, 5, '#4a4658'); p.rect(3, 10, 10, 1, '#8a86a0'); p.rect(6, 11, 4, 2, '#1a1724');
      if (on) { p.line(8, 11, 12, 3, '#8a8aa0'); p.circle(12, 3, 2, '#e04040'); }
      else { p.line(8, 11, 4, 3, '#8a8aa0'); p.circle(4, 3, 2, '#e04040'); }
    });
  }
  function herb(frame) {
    return once('herb' + frame, 16, 16, (p) => {
      const glow = frame ? '#c8f0ff' : '#9fe0ff';
      p.ellipse(8, 13, 5, 2, 'rgba(160,230,255,0.35)');
      p.line(8, 14, 8, 6, '#3f8a35'); p.line(8, 10, 4, 7, '#4aa048'); p.line(8, 11, 12, 8, '#4aa048');
      p.circle(8, 5, 2, glow); p.px(4, 6, glow); p.px(12, 7, glow); p.px(8, 4, '#ffffff');
    });
  }
  function note() {
    return once('note', 16, 16, (p) => { p.rect(4, 7, 9, 6, '#e8e0c8'); p.rect(4, 7, 9, 1, '#fff8e0'); p.rect(5, 9, 6, 1, '#7a6a5a'); p.rect(5, 11, 4, 1, '#7a6a5a'); p.px(12, 12, '#b0a080'); });
  }
  function rope() {
    return once('rope', 16, 16, (p) => { for (let y = 0; y < 16; y += 2) { p.px(7, y, '#c8a060'); p.px(8, y + 1, '#a07a40'); } p.rect(5, 0, 6, 2, '#6b4426'); });
  }
  function sparkle(t) {
    // 숨겨진 보물 반짝임 (넬이 일행일 때)
    const f = Math.floor(t * 6) % 4;
    return once('spk' + f, 16, 16, (p) => {
      const s = [2, 3, 2, 1][f];
      const c = '#fff6a0';
      p.px(8, 8, '#ffffff');
      for (let i = 1; i <= s; i++) { p.px(8 - i, 8, c); p.px(8 + i, 8, c); p.px(8, 8 - i, c); p.px(8, 8 + i, c); }
    });
  }
  // 풍차 날개 (중심 기준 회전)
  function windmill(g, cx, cy, t) {
    g.save();
    g.translate(cx, cy);
    g.rotate(t * 0.8);
    for (let i = 0; i < 4; i++) {
      g.rotate(Math.PI / 2);
      g.fillStyle = '#6b4426'; g.fillRect(-1, 0, 2, 22);
      g.fillStyle = '#f0e8d0'; g.fillRect(1, 5, 5, 16);
      g.fillStyle = '#c8b890'; g.fillRect(1, 5, 5, 1); g.fillRect(1, 12, 5, 1);
    }
    g.restore();
    g.fillStyle = '#4a3020'; g.fillRect(cx - 2, cy - 2, 4, 4);
  }
  // 종의 방의 거대한 종
  function bell(rung) {
    return once('bell' + rung, 48, 48, (p, g) => {
      const body = rung ? '#d8b860' : '#b89848', dark = '#7a6028', light = '#f0d888';
      g.fillStyle = dark; g.fillRect(22, 0, 4, 6);
      g.fillStyle = body;
      g.beginPath(); g.moveTo(14, 8); g.quadraticCurveTo(24, 0, 34, 8); g.lineTo(38, 34); g.lineTo(44, 40); g.lineTo(4, 40); g.lineTo(10, 34); g.closePath(); g.fill();
      g.fillStyle = dark; g.fillRect(4, 38, 40, 4);
      g.fillStyle = light; g.fillRect(15, 10, 3, 24);
      g.fillStyle = dark; g.fillRect(10, 26, 28, 2);
      g.fillStyle = '#5a4818'; g.beginPath(); g.ellipse(24, 43, 4, 3, 0, 0, Math.PI * 2); g.fill();
      // 별 문양
      g.fillStyle = rung ? '#ffffff' : '#7cc4ff';
      g.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 2.5 : 6, a = -Math.PI / 2 + (i * Math.PI) / 5; g.lineTo(24 + Math.cos(a) * r, 18 + Math.sin(a) * r); } g.fill();
    });
  }
  return { chest, lever, herb, note, rope, sparkle, windmill, bell };
})();

  const map = Field.map;
  if (map && map.kind === 'dungeon' && t.dungeon && Util.chance(0.5)) return t.dungeon;
  const p = Game.progress();
  let best = null;
  for (const k of Object.keys(t).filter((k) => !isNaN(k)).map(Number).sort((a, b) => a - b)) if (k <= p) best = t[k];

// ─────────────────────────────────────────────────────────────
const Settings = (() => {
  const KEY = 'starbell-jrpg.settings';
  const DEFAULTS = { bgm: 6, sfx: 7, textSpeed: 1, battleSpeed: 1, autoRun: 1, showGoal: 1, touch: 0 };
  const LABELS = {
    bgm: { name: '음악 볼륨', values: null, max: 10 },
    sfx: { name: '효과음 볼륨', values: null, max: 10 },
    textSpeed: { name: '메시지 속도', values: ['느림', '보통', '빠름', '즉시'] },
    battleSpeed: { name: '전투 속도', values: ['느림', '보통', '빠름'] },
    autoRun: { name: '항상 달리기', values: ['끄기', '켜기'] },
    showGoal: { name: '목표 표시', values: ['끄기', '켜기'] },
    touch: { name: '터치 버튼', values: ['자동', '항상 표시', '숨기기'] },
  };
  let data = Object.assign({}, DEFAULTS);
  const listeners = [];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const o = JSON.parse(raw);
        for (const k in DEFAULTS) if (typeof o[k] === 'number' && isFinite(o[k])) data[k] = o[k];
      }
    } catch (e) { /* 저장소를 못 써도 기본값으로 동작 */ }
    clampAll();
  }
  function clampAll() {
    for (const k in LABELS) {
      const L = LABELS[k];
      const max = L.values ? L.values.length - 1 : L.max;
      data[k] = Util.clamp(Math.round(data[k]), 0, max);
    }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 무시 */ }
  }
  return {
    load, save, LABELS,
    get: (k) => data[k],
    set(k, v) { data[k] = v; clampAll(); save(); for (const l of listeners) l(k, data[k]); },
    step(k, d) {
      const L = LABELS[k];
      const max = L.values ? L.values.length - 1 : L.max;
      const nv = Util.clamp(data[k] + d, 0, max);
      if (nv === data[k]) return false;
      this.set(k, nv);
      return true;
    },
    display(k) { const L = LABELS[k]; return L.values ? L.values[data[k]] : '■'.repeat(data[k]) + '□'.repeat(L.max - data[k]); },
    onChange(fn) { listeners.push(fn); },
  };
})();

'use strict';
// ─────────────────────────────────────────────────────────────
// Game: 진행 상태(파티·인벤토리·골드·플래그·위치) 단일 관리 지점
//  저장되는 것은 Game.state 하나뿐 — 모든 시스템이 이 객체를 통해 연결된다.
// ─────────────────────────────────────────────────────────────
const Game = (() => {
  const MAX_PARTY = 4;
  const MAX_STACK = 99;
  let state = null;

  function newState(heroName = '하루') {
    state = {
      version: 1,
      heroName,
      members: {},
      party: [],
      reserve: [],
      gold: 30,
      inv: {},
      flags: {},
      quests: {},
      pos: { map: 'inn', x: 3, y: 3, dir: 'down' },
      respawn: { map: 'shrine', x: 6, y: 6, dir: 'up' },
      playTime: 0,
      steps: 0,
      ward: 0,
      kills: {},
      seen: {},
      visited: {},
      starsGiven: 0,
      created: Date.now(),
    };
    join('hero', 1, true);
    addItem('herb', 2);
    return state;
  }

  // ── 동료 ──
  function makeMember(id, level) {
    const def = CHARACTERS[id];
    const m = { id, level: 1, exp: 0, hp: 1, mp: 0, equip: {}, status: {}, skills: [] };
    for (const s of EQUIP_SLOTS) m.equip[s] = def.equip[s] || null;
    m.level = level;
    m.exp = expForLevel(level);
    for (let l = 1; l <= level; l++) for (const sk of def.learn[l] || []) if (!m.skills.includes(sk)) m.skills.push(sk);
    return m;
  }
  function join(id, level, silent) {
    if (state.members[id]) {
      // 이미 있던 동료(예: 재합류) — 파티에 다시 넣기만 한다
      if (!state.party.includes(id) && !state.reserve.includes(id)) placeMember(id);
      return state.members[id];
    }
    const heroLv = state.members.hero ? state.members.hero.level : 1;
    const lv = Math.max(level || 1, heroLv - 1);
    const m = makeMember(id, lv);
    state.members[id] = m;
    const st = stats(id);
    m.hp = st.maxhp; m.mp = st.maxmp;
    placeMember(id);
    return m;
  }
  function placeMember(id) {
    if (state.party.length < MAX_PARTY) state.party.push(id);
    else state.reserve.push(id);
  }
  function leave(id) {
    state.party = state.party.filter((x) => x !== id);
    state.reserve = state.reserve.filter((x) => x !== id);
    if (!state.party.length && state.reserve.length) state.party.push(state.reserve.shift());
  }
  const member = (id) => state.members[id];
  const name = (id) => (id === 'hero' ? state.heroName : CHARACTERS[id].name);

  // 능력치 계산: 레벨 성장 + 장비
  function baseStats(id, level) {
    const def = CHARACTERS[id];
    const L = level - 1;
    const o = {};
    for (const k of ['hp', 'mp', 'atk', 'def', 'mag', 'spd']) o[k] = Math.floor(def.base[k] + def.grow[k] * L + def.grow[k] * 0.015 * L * L);
    return { maxhp: o.hp, maxmp: o.mp, atk: o.atk, def: o.def, mag: o.mag, spd: o.spd };
  }
  function stats(id, equipOverride) {
    const m = state.members[id];
    const s = baseStats(id, m.level);
    const eq = equipOverride || m.equip;
    s.resist = {};
    s.element = null;
    s.onHit = null;
    s.healBonus = 0;
    for (const slot of EQUIP_SLOTS) {
      const it = eq[slot] && ITEMS[eq[slot]];
      if (!it) continue;
      const st = it.stats || {};
      s.atk += st.atk || 0; s.def += st.def || 0; s.mag += st.mag || 0; s.spd += st.spd || 0;
      s.maxhp += st.hp || 0; s.maxmp += st.mp || 0;
      if (it.resist) for (const k in it.resist) s.resist[k] = Math.max(s.resist[k] || 0, it.resist[k]);
      if (it.element) s.element = it.element;
      if (it.onHit) s.onHit = it.onHit;
      if (it.healBonus) s.healBonus += it.healBonus;
    }
    return s;
  }
  // HP/MP를 최대치 이내로 보정 (장비 변경 후 등)
  function clampMember(id) {
    const m = state.members[id];
    const s = stats(id);
    m.hp = Util.clamp(m.hp, 0, s.maxhp);
    m.mp = Util.clamp(m.mp, 0, s.maxmp);
  }

  // 경험치 → 레벨업. 레벨업 정보 배열 반환
  function addExp(id, amount) {
    const m = state.members[id];
    const ups = [];
    if (!m || amount <= 0) return ups;
    m.exp += amount;
    while (m.level < MAX_LEVEL && m.exp >= expForLevel(m.level + 1)) {
      const before = baseStats(id, m.level);
      m.level++;
      const after = baseStats(id, m.level);
      const gains = {};
      for (const k of ['maxhp', 'maxmp', 'atk', 'def', 'mag', 'spd']) gains[k] = after[k] - before[k];
      const learned = [];
      for (const sk of CHARACTERS[id].learn[m.level] || []) if (!m.skills.includes(sk)) { m.skills.push(sk); learned.push(sk); }
      // 레벨업 시 늘어난 만큼 HP/MP도 함께 오른다
      if (m.hp > 0) m.hp += gains.maxhp;
      m.mp += gains.maxmp;
      ups.push({ id, level: m.level, gains, learned });
    }
    clampMember(id);
    return ups;
  }

  // ── 장비 ──
  function canEquip(id, itemId) {
    const it = ITEMS[itemId];
    return !!(it && EQUIP_SLOTS.includes(it.kind) && (!it.who || it.who.includes(id)));
  }
  function equip(id, slot, itemId) {
    const m = state.members[id];
    if (!m) return false;
    if (itemId) {
      if (!canEquip(id, itemId) || ITEMS[itemId].kind !== slot) return false;
      if (count(itemId) <= 0) return false;
      removeItem(itemId, 1);
    }
    const old = m.equip[slot];
    if (old) addItem(old, 1, true);
    m.equip[slot] = itemId || null;
    clampMember(id);
    return true;
  }

  // ── 인벤토리 ──
  function count(itemId) { return state.inv[itemId] || 0; }
  function addItem(itemId, n = 1, force = false) {
    if (!ITEMS[itemId]) { console.warn('unknown item', itemId); return 0; }
    const cur = state.inv[itemId] || 0;
    const cap = force ? 999 : MAX_STACK;
    const add = Math.max(0, Math.min(n, cap - cur));
    state.inv[itemId] = cur + add;
    return add;
  }
  function removeItem(itemId, n = 1) {
    const cur = state.inv[itemId] || 0;
    if (cur < n) return false;
    if (cur - n <= 0) delete state.inv[itemId];
    else state.inv[itemId] = cur - n;
    return true;
  }
  function itemList(filter) {
    const order = ['consumable', 'weapon', 'armor', 'shield', 'helm', 'accessory', 'key'];
    return Object.keys(state.inv)
      .filter((id) => state.inv[id] > 0 && ITEMS[id] && (!filter || filter(ITEMS[id])))
      .sort((a, b) => order.indexOf(ITEMS[a].kind) - order.indexOf(ITEMS[b].kind) || ITEMS[a].price - ITEMS[b].price);
  }
  // 장착 중인 것까지 포함한 소지 수
  function ownedTotal(itemId) {
    let n = count(itemId);
    for (const id in state.members) for (const s of EQUIP_SLOTS) if (state.members[id].equip[s] === itemId) n++;
    return n;
  }

  // ── 플래그 ──
  const flag = (k) => state.flags[k];
  function setFlag(k, v = true) { if (v === false || v === null) delete state.flags[k]; else state.flags[k] = v; }

  // ── 파티 상태 ──
  const activeIds = () => state.party.slice();
  const aliveIds = () => state.party.filter((id) => state.members[id].hp > 0);
  function healAll(revive = true) {
    for (const id in state.members) {
      const m = state.members[id];
      if (m.hp <= 0 && !revive) continue;
      const s = stats(id);
      m.hp = s.maxhp; m.mp = s.maxmp; m.status = {};
    }
  }
  function partyAvgLevel() {
    const ids = state.party;
    return ids.reduce((n, id) => n + state.members[id].level, 0) / Math.max(1, ids.length);
  }

  // 메인 스토리 진행도 (NPC 대사 분기 기준)
  //  0 깨어남 · 1 장로 만남 · 2 사냥꾼 방문 · 3 철엄니 격파 · 4 봉인 확인 · 5 미오 합류 · 6 봉인 해제 · 7 벨가르 격파 · 8 1장 완료
  function progress() {
    const f = state.flags;
    if (f.chapter1_done) return 8;
    if (f.velgar_defeated) return 7;
    if (f.seal_opened) return 6;
    if (f.mio_joined) return 5;
    if (f.saw_seal) return 4;
    if (f.ironfang_defeated) return 3;
    if (f.visited_hunter) return 2;
    if (f.met_elder) return 1;
    return 0;
  }

  return {
    MAX_PARTY,
    get state() { return state; },
    set state(s) { state = s; },
    newState, join, leave, member, name, stats, baseStats, clampMember, addExp,
    canEquip, equip, count, addItem, removeItem, itemList, ownedTotal,
    flag, setFlag, activeIds, aliveIds, healAll, partyAvgLevel, progress,
    heroName: () => (state ? state.heroName : '하루'),
    get gold() { return state.gold; },
    addGold(n) { state.gold = Util.clamp(state.gold + n, 0, 999999); },
    spend(n) { if (state.gold < n) return false; state.gold -= n; return true; },
    inParty: (id) => !!state && (state.party.includes(id) || state.reserve.includes(id)),
  };
})();

  return {

    status: (id) => (get(id) ? get(id).status : 'none'),
    isActive: (id) => !!get(id) && get(id).status === 'active',
    isDone: (id) => !!get(id) && get(id).status === 'done',
    stage: (id) => (get(id) ? get(id).stage : -1),
    data(id) { const q = get(id); return q ? q.data : {}; },
    start(id) {
      if (get(id)) return false;
      st()[id] = { status: 'active', stage: 0, data: {}, t: Date.now() };
      return true;
    },
    setStage(id, n) { const q = get(id); if (q && q.status === 'active') q.stage = Math.max(q.stage, n); },
    complete(id, outcome) {
      const q = get(id);
      if (!q || q.status === 'done') return null;
      q.status = 'done';
      q.outcome = outcome || null;
      const r = QUESTS[id].reward || {};
      if (r.gold) Game.addGold(r.gold);
      for (const [it, n] of r.items || []) Game.addItem(it, n);
      return r;
    },
    // 현재 목표 텍스트 (진행 수치 포함)
    goal(id) {
      const q = get(id);
      if (!q) return '';
      if (q.status === 'done') return '완료';
      const s = QUESTS[id].stages[Math.min(q.stage, QUESTS[id].stages.length - 1)];
      let t = s.goal;
      if (s.count) t += ` (${s.count()}/${s.max})`;
      return t;
    },
    target(id) {
      const q = get(id);
      if (!q || q.status !== 'active') return null;
      const s = QUESTS[id].stages[Math.min(q.stage, QUESTS[id].stages.length - 1)];
      return s.target || null;
    },
    // 현재 화면에 띄울 대표 목표 (메인 우선)
    currentGoal() {

'use strict';
// ─────────────────────────────────────────────────────────────
// Save: localStorage 3슬롯 저장/불러오기 + 데이터 검증
// ─────────────────────────────────────────────────────────────
const Save = (() => {
  const PREFIX = 'starbell-jrpg.save.';
  const SLOTS = 3;
  const VERSION = 1;
  let memory = {}; // localStorage를 쓸 수 없는 환경용 대체 저장소

  function storageGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return memory[k] || null; }
  }
  function storageSet(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { memory[k] = v; return false; }
  }

  function summary() {
    const s = Game.state;
    const map = MAPS[s.pos.map];
    return {
      name: s.heroName,
      level: s.members.hero ? s.members.hero.level : 1,
      place: map ? map.name : '???',
      time: s.playTime,
      party: s.party.slice(),
      date: Date.now(),
      chapter: Game.flag('chapter1_done') ? '제1장 완료' : '제1장',
    };
  }

  function write(slot) {
    if (!Game.state) return false;
    const data = { v: VERSION, summary: summary(), state: Game.state };
    const ok = storageSet(PREFIX + slot, JSON.stringify(data));
    return ok !== null;
  }

  function readRaw(slot) {
    const raw = storageGet(PREFIX + slot);
    if (!raw) return null;
    try {
      const d = JSON.parse(raw);
      if (!d || typeof d !== 'object' || !d.state) return { corrupt: true };
      return d;
    } catch (e) { return { corrupt: true }; }
  }

  // 저장 데이터 검증 + 누락 필드 보정 (구버전 호환)
  function validate(s) {
    if (!s || typeof s !== 'object') return null;
    const base = (() => { const keep = Game.state; const fresh = Game.newState(s.heroName || '하루'); Game.state = keep; return fresh; })();
    const out = Object.assign({}, base, s);
    for (const k of ['members', 'inv', 'flags', 'quests', 'kills', 'seen', 'visited']) if (!out[k] || typeof out[k] !== 'object') out[k] = {};
    if (!Array.isArray(out.party)) out.party = ['hero'];
    if (!Array.isArray(out.reserve)) out.reserve = [];
    out.party = out.party.filter((id) => CHARACTERS[id] && out.members[id]);
    out.reserve = out.reserve.filter((id) => CHARACTERS[id] && out.members[id] && !out.party.includes(id));
    if (!out.members.hero) return null;
    if (!out.party.length) out.party = ['hero'];
    for (const id in out.members) {
      const m = out.members[id];
      if (!CHARACTERS[id]) { delete out.members[id]; continue; }
      m.level = Util.clamp(m.level | 0 || 1, 1, MAX_LEVEL);
      m.equip = m.equip || {};
      for (const sl of EQUIP_SLOTS) if (m.equip[sl] && !ITEMS[m.equip[sl]]) m.equip[sl] = null;
      m.status = m.status || {};
      m.skills = Array.isArray(m.skills) ? m.skills.filter((sk) => SKILLS[sk]) : [];
      if (typeof m.hp !== 'number') m.hp = 1;
      if (typeof m.mp !== 'number') m.mp = 0;
    }
    for (const it in out.inv) if (!ITEMS[it] || !(out.inv[it] > 0)) delete out.inv[it];
    out.gold = Util.clamp(out.gold | 0, 0, 999999);
    if (!out.pos || !MAPS[out.pos.map]) out.pos = { map: 'rivel', x: 19, y: 27, dir: 'up' };
    if (!out.respawn || !MAPS[out.respawn.map]) out.respawn = { map: 'shrine', x: 6, y: 6, dir: 'up' };
    return out;
  }

  return {
    SLOTS,
    write,
    info(slot) {
      const d = readRaw(slot);
      if (!d) return null;
      if (d.corrupt) return { corrupt: true };
      return d.summary || { name: '?', level: 1, place: '?', time: 0 };
    },
    any() { for (let i = 1; i <= SLOTS; i++) { const inf = this.info(i); if (inf && !inf.corrupt) return true; } return false; },
    latest() {
      let best = null, slot = 0;
      for (let i = 1; i <= SLOTS; i++) { const inf = this.info(i); if (inf && !inf.corrupt && (!best || inf.date > best.date)) { best = inf; slot = i; } }
      return slot;
    },
    load(slot) {
      const d = readRaw(slot);
      if (!d || d.corrupt) return false;
      const s = validate(d.state);
      if (!s) return false;
      Game.state = s;
      for (const id in s.members) Game.clampMember(id);
      return true;
    },
    remove(slot) { try { localStorage.removeItem(PREFIX + slot); } catch (e) { delete memory[PREFIX + slot]; } },
    validate,
  };
})();

'use strict';
// ─────────────────────────────────────────────────────────────
// BattleCore: 턴제 전투 규칙 (화면과 분리된 순수 로직)
//  execute()는 상태를 바꾸고 '연출 이벤트' 배열을 돌려준다 → 전투 화면이 순서대로 재생
// ─────────────────────────────────────────────────────────────
const SUFFIX = ['A', 'B', 'C', 'D', 'E', 'F'];

class Actor {
  constructor(side, data) {
    this.side = side;
    this.buffs = {};
    this.defending = false;
    this.coveredBy = null;
    this.taunt = false;
    this.mem = {};
    this.uid = Actor.next++;
    if (side === 'party') {
      this.id = data;
      this.ref = Game.state.members[data];
      this.name = Game.name(data);
    } else {
      const def = MONSTERS[data];
      this.defId = data;
      this.def = def;

        const chance = Util.clamp(0.45 + (a.spd - t.spd) * 0.012, 0.2, 0.9) * (st.p >= 0.3 ? 1 : 0.7);
        if (Util.chance(chance)) {

      }

        ev.push({ type: 'msg', text: `${a.name}의 HP가 ${a.hp - before} 회복되었다! [y](그림자 잔향을 먼저 쓰러뜨려 두면 막을 수 있다)[/]` });

  physicalHit(a, t, sk) {
    const ev = [];
    let hitChance = (0.95 + (sk.hit || 0)) * a.buff('hit') * (1 - t.evade);
    if (t.disabled) hitChance = 1;
    if (!Util.chance(hitChance)) {
      ev.push({ type: 'anim', name: 'slash', targets: [t], user: a, miss: true });
      ev.push({ type: 'miss', target: t });
      ev.push({ type: 'msg', text: `그러나 ${t.name}${Util.josa(t.name, '은')} 재빨리 피했다!` });
      return ev;
    }
    const critChance = 0.04 + (sk.crit || 0) + (a.isParty && a.id === 'nell' ? 0.06 : 0);
    const crit = a.isParty ? Util.chance(critChance) : !a.def.boss && Util.chance(0.02);
    const atk = a.atk, def = t.defense;
    let dmg;
    if (crit) dmg = atk * 1.5;
    else if (!t.isParty && t.def.shiny) dmg = Util.randInt(0, 1);
    else dmg = (atk * atk) / (atk + def);
    const element = sk.element || (sk.id === 'attack' && a.isParty ? a.st.element : null);
    const em = t.elemMult(element);
    if (!(t.def && t.def.shiny && !crit)) dmg *= (sk.mult || 1) * Util.randRange(0.88, 1.12) * em;
    if (t.defending) dmg *= 0.5;
    dmg = Math.max(t.def && t.def.shiny && !crit ? 0 : 1, Math.round(dmg));
    ev.push({ type: 'anim', name: sk.anim || 'slash', targets: [t], user: a, crit });
    if (crit) ev.push({ type: 'msg', text: a.isParty ? '[y]회심의 일격![/]' : '[r]통한의 일격![/]' });
    ev.push(...this.damage(t, dmg, { crit, em, physical: true, from: a }));
    if (sk.type === 'drain' && dmg > 0) {
      const before = a.hp; a.hp = Math.min(a.mhp, a.hp + Math.round(dmg * 0.6));
      if (a.hp > before) { ev.push({ type: 'heal', target: a, amount: a.hp - before, hpAfter: a.hp }); ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} HP를 ${a.hp - before} 빨아들였다!` }); }
    }
    if (t.alive) {
      if (sk.status) ev.push(...this.inflict(t, sk.status, false));
      if (sk.id === 'attack' && a.isParty && a.st.onHit) ev.push(...this.inflict(t, a.st.onHit, false));
      if (sk.debuff && Util.chance(sk.debuff.chance || 0.3)) {
        t.buffs.def = { mult: sk.debuff.def, turns: sk.debuff.turns || 3 };
        ev.push({ type: 'buff', target: t, up: false });
        ev.push({ type: 'msg', text: `${t.name}의 방어력이 떨어졌다!` });
      }
      if (t.status.sleep && Util.chance(0.5)) { delete t.status.sleep; ev.push({ type: 'status', target: t }); ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '은')} 충격으로 잠에서 깼다!` }); }
    }
    return ev;
  }

  magicHit(a, t, sk) {
    const ev = [];
    const em = t.elemMult(sk.element);
    let dmg = (sk.power + (sk.type === 'damage' ? 0 : a.mag * (sk.scale || 0))) * Util.randRange(0.92, 1.08) * em;
    if (t.defending) dmg *= 0.5;
    dmg = Math.round(dmg);
    if (em === 0) { ev.push({ type: 'msg', text: `${t.name}에게는 ${ELEMENTS[sk.element] || ''} 속성이 전혀 통하지 않는다!` }); ev.push({ type: 'miss', target: t }); return ev; }
    dmg = Math.max(1, dmg);
    ev.push(...this.damage(t, dmg, { em, from: a }));
    if (t.alive && sk.status) ev.push(...this.inflict(t, sk.status, false));
    return ev;
  }

  damage(t, dmg, info = {}) {
    const ev = [];
    t.hp = Math.max(0, t.hp - dmg);
    ev.push({ type: 'damage', target: t, amount: dmg, crit: info.crit, weak: info.em > 1, resist: info.em < 1, hpAfter: t.hp });
    let txt = t.isParty ? `${t.name}${Util.josa(t.name, '은')} [r]${dmg}[/]의 피해를 입었다!` : `${t.name}에게 [y]${dmg}[/]의 피해!`;
    if (info.em > 1) txt += ' [y]약점을 찔렀다![/]';
    else if (info.em < 1 && info.em > 0) txt += ' [d](잘 통하지 않는다)[/]';
    ev.push({ type: 'msg', text: txt });
    if (t.hp <= 0) ev.push(...this.kill(t));
    else if (!t.isParty && t.def.phases) ev.push(...this.checkPhases(t));
    return ev;
  }

  kill(t) {
    const ev = [];
    t.hp = 0;
    t.buffs = {};
    t.charging = null;
    if (t.isParty) {
      for (const k of ['sleep', 'paralyze', 'silence', 'poison']) delete t.status[k];
      ev.push({ type: 'die', target: t });
      ev.push({ type: 'msg', text: `[r]${t.name}${Util.josa(t.name, '은')} 쓰러졌다…[/]` });
    } else {
      this.killed.push(t);
      if (t.pilfered) { Game.addGold(t.pilfered); this.recoveredGold += t.pilfered; }
      ev.push({ type: 'die', target: t });
      ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '을')} 쓰러뜨렸다!` + (t.pilfered ? ` [y](${t.pilfered}G를 되찾았다)[/]` : '') });
    }
    return ev;
  }

  checkPhases(t) {
    const ev = [];
    for (const ph of t.def.phases) {
      if (t.mem['phase_' + ph.key]) continue;
      if (t.hp / t.mhp <= ph.below) {
        t.mem['phase_' + ph.key] = true;
        ev.push({ type: 'phase', target: t, variant: 2 });
        ev.push(...t.def.onPhase(t, this, ph.key));
      }
    }
    return ev;
  }

  inflict(t, statusMap, verbose) {
    const ev = [];
    for (const s in statusMap) {
      if (t.status[s]) { if (verbose) ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '은')} 이미 ${STATUS_NAMES[s]} 상태다.` }); continue; }
      const res = t.resist(s);
      if (res >= 1) { if (verbose) ev.push({ type: 'msg', text: `${t.name}에게는 ${STATUS_NAMES[s]}${Util.josa(STATUS_NAMES[s], '이')} 통하지 않는다!` }); continue; }
      if (!Util.chance(statusMap[s] * (1 - res))) { if (verbose) ev.push({ type: 'msg', text: `${t.name}에게는 효과가 없었다.` }); continue; }
      t.status[s] = s === 'poison' ? 1 : s === 'sleep' ? Util.randInt(2, 4) : s === 'paralyze' ? Util.randInt(1, 3) : Util.randInt(3, 4);
      ev.push({ type: 'status', target: t, status: s, on: true });
      const msg = { poison: '독에 걸렸다!', sleep: '잠들어 버렸다!', paralyze: '몸이 마비되었다!', silence: '주문이 봉인되었다!' }[s];
      ev.push({ type: 'msg', text: `${t.name}${Util.josa(t.name, '은')} ${msg}` });
    }
    return ev;
  }

  analyze(t) {
    const ev = [];
    const d = t.def;
    Game.state.seen[t.defId] = true;
    const weak = [], res = [], immune = [];
    for (const k in ELEMENTS) {
      const m = t.elemMult(k);
      if (m > 1) weak.push(ELEMENTS[k]); else if (m === 0) immune.push(ELEMENTS[k]); else if (m < 1) res.push(ELEMENTS[k]);
    }
    const sres = Object.keys(d.resist || {}).filter((k) => d.resist[k] >= 1).map((k) => STATUS_NAMES[k]);
    ev.push({ type: 'analyze', target: t });
    ev.push({ type: 'msg', text: `[b]【${t.name}】[/] HP ${t.hp}/${t.mhp} · 공격 ${Math.round(t.atk)} · 방어 ${Math.round(t.defense)}` });
    ev.push({ type: 'msg', text: `약점: [y]${weak.join('·') || '없음'}[/]  내성: ${res.join('·') || '없음'}${immune.length ? `  무효: ${immune.join('·')}` : ''}${sres.length ? `  상태이상 무효: ${sres.join('·')}` : ''}` });
    ev.push({ type: 'msg', text: `[d]${d.desc}[/]` });
    return ev;
  }

  // 라운드 종료 처리
  endRound() {
    const ev = [];
    for (const a of [...this.party, ...this.enemies]) {
      if (!a.alive) continue;
      a.defending = false; a.coveredBy = null; a.taunt = false;
      if (a.status.poison) {
        let dmg = Math.max(1, Math.round(a.mhp * (a.isParty ? 0.06 : 0.08)));
        if (!a.isParty && a.def.boss) dmg = Math.min(dmg, 30);
        if (a.isParty) dmg = Math.min(dmg, a.hp - 1);
        if (dmg > 0) {
          a.hp -= dmg;
          ev.push({ type: 'damage', target: a, amount: dmg, poison: true, hpAfter: a.hp });
          ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} 독으로 [p]${dmg}[/]의 피해를 입었다!` });
          if (a.hp <= 0) ev.push(...this.kill(a));
        }
      }
      for (const s of ['sleep', 'paralyze', 'silence']) {
        if (!a.status[s]) continue;
        a.status[s]--;
        const wake = s === 'sleep' && Util.chance(0.25);
        if (a.status[s] <= 0 || wake) {
          delete a.status[s];
          ev.push({ type: 'status', target: a });
          ev.push({ type: 'msg', text: `${a.name}${Util.josa(a.name, '은')} ${{ sleep: '잠에서 깨어났다!', paralyze: '마비가 풀렸다!', silence: '다시 주문을 외울 수 있게 되었다!' }[s]}` });
        }
      }
      for (const k in a.buffs) {
        const b = a.buffs[k];
        if (b.turns >= 99) continue;
        b.turns--;
        if (b.turns <= 0) {
          delete a.buffs[k];
          ev.push({ type: 'buff', target: a, reset: true });
          ev.push({ type: 'msg', text: `${a.name}의 ${BUFF_NAMES[k]}${Util.josa(BUFF_NAMES[k], '이')} 원래대로 돌아왔다.` });
        }
      }
    }
    this.checkEnd();
    return ev;
  }

  tryEscape() {
    if (!this.canEscape) return { ok: false, impossible: true };
    const ps = this.alivePartyList, es = this.aliveEnemyList;
    const avg = (l) => l.reduce((n, a) => n + a.spd, 0) / Math.max(1, l.length);
    const chance = Util.clamp(0.55 + (avg(ps) - avg(es)) * 0.02 + this.escapeTries * 0.15, 0.3, 0.95);
    this.escapeTries++;
    const ok = Util.chance(chance);
    if (ok) this.result = 'escape';
    return { ok };
  }

  // 승리 보상: 경험치·골드·드롭 적용, 레벨업 목록 반환
  rewards() {
    let exp = 0, gold = 0;
    const drops = [];
    for (const e of this.killed) {
      if (e.absorbed) continue;
      exp += e.def.exp; gold += e.def.gold;
      for (const d of e.def.drops || []) if (Util.chance(d.p)) { drops.push(d.item); break; }
      Game.state.kills[e.defId] = (Game.state.kills[e.defId] || 0) + 1;
    }
    Game.addGold(gold);
    for (const it of drops) Game.addItem(it, 1);
    const ups = [];
    for (const id of Game.state.party) if (Game.state.members[id].hp > 0) ups.push(...Game.addExp(id, exp));
    for (const id of Game.state.reserve) ups.push(...Game.addExp(id, Math.floor(exp / 2)));
    const questMsgs = [];
    for (const e of this.killed) { const m = Quests.onKill(e.defId); if (m) questMsgs.push(m); }
    return { exp, gold, drops, ups, questMsgs };
  }
}

// 맵 레지스트리
//  각 맵: { name, kind(town|interior|field|dungeon), bgm, base, tiles[], enc, edge, warps[], npcs[], objects[], triggers[], tileFlags[], onEnter }
// ─────────────────────────────────────────────────────────────
const MAPS = {};
function defMap(id, def) {
  def.id = id;
  const w = def.tiles[0].length;
  def.tiles.forEach((r, i) => { if (r.length !== w) console.error(`[map ${id}] row ${i} width ${r.length} != ${w}`); });
  def.w = w; def.h = def.tiles.length;
  def.warps = def.warps || [];
  def.npcs = def.npcs || [];
  def.objects = def.objects || [];
  def.triggers = def.triggers || [];
  def.tileFlags = def.tileFlags || [];
  MAPS[id] = def;
  return def;
}

// 대사 진행도 분기 도우미: byP({0:'…', 3:'…'}) → 현재 진행도 이하 중 가장 큰 키
function byP(table) {
  const p = Game.progress();
  let best = null;
  for (const k of Object.keys(table).map(Number).sort((a, b) => a - b)) if (k <= p) best = table[k];
  return best;
}

      await S.say('수집가 피포', ['오오! 그대들, 혹시 「별조각」을 본 적 있나? 밤하늘에서 떨어진 작은 별의 파편이지!', '나는 세상의 별조각을 모두 모으는 게 꿈이라네! 모두 여덟 개가 이 근방에 떨어졌다는 계산이 나왔지.', '찾아오면 내 소장품과 바꿔 주겠네. 2개, 4개, 6개, 그리고 8개! 놀라운 보물이 기다리고 있다고!']);

    }

      await S.say('수집가 피포', ['자, 잠깐! 그 가방 속의 물건은…! 접었다 폈다 하는 휴대용 지붕?!', '이세계의 유물이로군!! 내 「은방울 머리꽂이」와 바꾸지 않겠나?!']);

      Sound.sfx('chime');
      await S.say('수집가 피포', `오오! 별조각을 ${have}개나! 이제 내 수집품은 모두 ${Game.state.starsGiven}개라네!`);
      const tiers = [[2, 'starwater'], [4, 'power_ring'], [6, 'sage_robe'], [8, 'star_blade']];

'use strict';
// ─────────────────────────────────────────────────────────────
// Events / S: 이벤트 스크립트 실행기와 스크립트 API
//  모든 대화·연출·보상은 async 함수로 작성하고 Events.run()으로 실행한다.
//  예외가 나도 게임이 멈추지 않도록 busy 카운터를 항상 되돌린다.
// ─────────────────────────────────────────────────────────────
const Events = (() => {
  let running = 0;
  async function run(fn) {
    Field.busy = Field.busy + 1;
    running++;
    try {
      await fn();
    } catch (err) {
      if (!(err instanceof AbortSignalError)) {
        console.error('[Event] error:', err);
        try { await UI.message('[r](알 수 없는 문제가 생겼지만 모험은 계속된다.)[/]'); } catch (e) { /* */ }
      }
    } finally {
      running--;
      Field.busy = Math.max(0, Field.busy - 1);
      Field.refreshNpcs();
      Input.clearQueue();
    }
  }
  return { run, get running() { return running; } };
})();

const S = {
  // 대화: name이 null이면 지문
  say(name, text, opts = {}) {
    const pages = Array.isArray(text) ? text : [text];
    return UI.message(pages.map((t) => Util.fill(t)), Object.assign({ name: name ? Util.fill(name) : null }, opts));
  },
  async talk(seq) {
    for (const [name, text] of seq) await S.say(name, text);
  },
  // 선택지 — 선택한 인덱스 반환 (취소 시 cancelIndex)
  async ask(name, text, options, cancelIndex = options.length - 1) {
    const msg = new UI.MessageLayer([Util.fill(text)], { name: name ? Util.fill(name) : null, keepOpen: true });
    await msg.open();
    const w = Math.max(160, ...options.map((o) => Text.width(Engine.ctx, o, 18) + 60));
    const r = await UI.list({ x: Engine.W - w - 16, y: Engine.H - 150, anchor: 'bottom', w, items: options.map((o, i) => ({ label: o, value: i })), cancel: true });
    msg.close();
    return r ? r.value : cancelIndex;
  },
  async yesno(name, text) { return (await S.ask(name, text, ['예', '아니요'], 1)) === 0; },

  async give(itemId, n = 1, opts = {}) {
    const it = ITEMS[itemId];
    const got = Game.addItem(itemId, n);
    if (got < n) {
      await S.say(null, `${it.name}을(를) 더 가질 수 없다…`);
      return false;
    }
    if (!opts.silent) {
      const jingle = it.kind === 'key' || ['weapon', 'armor', 'shield', 'helm', 'accessory'].includes(it.kind) || itemId === 'starwater';
      if (jingle) Sound.jingle('item'); else Sound.sfx('chest');
      await S.say(null, `${opts.from || ''}[y]${it.name}[/]${n > 1 ? ` ${n}개` : ''}${Util.josa(it.name + (n > 1 ? `${n}개` : ''), '을')} 손에 넣었다!`);
    }
    const q = Quests.onItem(itemId);
    if (q) await S.say(null, q);
    return true;
  },
  take(itemId, n = 1) { return Game.removeItem(itemId, n); },
  async gold(n, fromChest) {
    Game.addGold(n);
    Sound.sfx('coin');
    await S.say(null, `[y]${n}G[/]를 손에 넣었다!`);
  },
  async join(id) {
    Game.join(id);
    Field.resetFollowers();
    Sound.jingle('join');
    await S.say(null, `[y]${Game.name(id)}[/]${Util.josa(Game.name(id), '이')} 동료가 되었다!`);
    if (!Game.state.party.includes(id)) await S.say(null, `(파티가 가득 차서 ${Game.name(id)}${Util.josa(Game.name(id), '은')} 대기 멤버가 되었다. 메뉴의 「편성」에서 바꿀 수 있다.)`);
  },
  flag: (k) => Game.flag(k),
  set(k, v = true) { Game.setFlag(k, v); },

  // 전투: 패배 시 게임오버 처리 후 스크립트 중단
  async battle(enemies, opts = {}) {
    const r = await Battle.run(Object.assign({ enemies }, opts));
    if (r === 'lose') {
      if (opts.loseOk) return 'lose';
      await GameOver.run();
      throw new AbortSignalError('gameover');
    }
    return r;
  },

  wait: (ms) => Engine.wait(ms),
  fadeOut: (ms = 400) => Engine.fadeOut(ms),
  fadeIn: (ms = 400) => Engine.fadeIn(ms),
  shake: (m = 4, s = 0.3) => Engine.shake(m, s),
  flash: (c = '#fff', s = 0.3) => Engine.flash(c, s),
  sfx: (n) => Sound.sfx(n),
  bgm: (n) => Sound.bgm(n),
  warp: (map, x, y, dir, opts) => Field.warp(map, x, y, dir, opts),
  walk: (dirs) => Field.walkPlayer(dirs.slice(), true),
  walkNpc: (id, dirs, speed) => Field.walkNpc(id, dirs.slice(), speed),
  face(id, dir) { const n = Field.npc(id); if (n) n.dir = dir; },
  facePlayer(dir) { Field.player.dir = dir; },
  hideNpc(id) { const n = Field.npc(id); if (n) n.visible = false; },

  // 퀘스트
  async startQuest(id) {
    if (!Quests.start(id)) return;
    Sound.jingle('quest');
    await S.say(null, `[${QUESTS[id].type === 'main' ? 'y' : 'g'}]${QUESTS[id].type === 'main' ? '메인' : '서브'} 퀘스트 「${QUESTS[id].name}」[/] 시작!\n[d]${Quests.goal(id)}[/]`);
  },
  stage(id, n) { Quests.setStage(id, n); },
  async completeQuest(id, outcome) {
    const r = Quests.complete(id, outcome);
    if (!r) return;
    Sound.jingle('quest');
    let t = `[${QUESTS[id].type === 'main' ? 'y' : 'g'}]퀘스트 「${QUESTS[id].name}」 완료![/]`;
    const parts = [];
    if (r.gold) parts.push(`${r.gold}G`);
    for (const [it, n] of r.items || []) parts.push(ITEMS[it].name + (n > 1 ? ` ×${n}` : ''));
    if (parts.length) t += `\n보상: ${parts.join(', ')}`;
    if (r.text) t += `\n[d]${r.text}[/]`;
    await S.say(null, t);
  },

  // 여관: 하룻밤 묵고 전원 회복
  async inn(price, keeper = '마르타') {
    const free = Game.flag('inn_free');
    const p = free ? 0 : price;
    const ok = await S.ask(keeper, free ? '어서 와요! 우리 은인에겐 숙박비 안 받아요. 쉬고 갈래요?' : `하룻밤에 [y]${p}G[/]예요. 쉬고 갈래요?`, ['묵는다', '그만둔다'], 1);
    if (ok !== 0) { await S.say(keeper, '언제든지 들러요!'); return false; }
    if (!Game.spend(p)) { Sound.sfx('buzzer'); await S.say(keeper, '어머, 돈이 모자라네요… 다음에 와요.'); return false; }
    await S.say(keeper, '편히 쉬어요. 좋은 꿈 꾸고요!');
    await Engine.fadeOut(600);
    Sound.stop();
    Game.healAll(true);
    await Sound.jingle('inn');
    await Engine.wait(300);
    Field.refreshNpcs();
    Sound.bgm(typeof Field.map.bgm === 'function' ? Field.map.bgm() : Field.map.bgm);
    await Engine.fadeIn(600);
    await S.say(keeper, '좋은 아침이에요! 오늘도 힘내요.');
    if (Events.afterInn) await Events.afterInn();
    return true;
  },

  // 저장 지점: 회복 + 저장
  async savePoint(healText) {
    if (healText) { Sound.sfx('save'); Game.healAll(true); Engine.flash('#9fe0ff', 0.4); await S.say(null, healText); }
    if (await S.yesno(null, '모험을 기록할까요?')) await Menu.saveScreen();
  },
};

// 게임오버: 신전에서 깨어나고 소지금 절반을 잃는다 (막힌 진행 없음)
const GameOver = {
  async run() {
    Sound.stop();
    Sound.jingle('gameover');
    await UI.message(['[r]일행은 모두 쓰러지고 말았다…[/]']);
    await Engine.fadeOut(900);
    const lost = Math.floor(Game.gold / 2);
    Game.addGold(-lost);
    Game.healAll(true);
    const r = Game.state.respawn;
    Field.enter(r.map, r.x, r.y, r.dir);
    await Engine.wait(400);
    await Engine.fadeIn(800);
    await S.say('대신관 세나', [`…정신이 드나요? 들판에 쓰러져 있던 걸 마을 사람들이 옮겨 왔어요.`, `소지금의 절반(${lost}G)은 치료비로 썼답니다. 무리하지 말고, 준비를 단단히 하세요.`]);
  },
};
