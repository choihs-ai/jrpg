'use strict';
// ─────────────────────────────────────────────────────────────
// Field: 맵 탐험 장면 — 이동, 충돌, NPC, 오브젝트, 동료 따라오기, 인카운터, 맵 전환
// ─────────────────────────────────────────────────────────────
const Field = (() => {
  const TS = 16, VW = 20, VH = 15;
  const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const SPEED_WALK = 4.6, SPEED_RUN = 7.6, NPC_SPEED = 2.6;

  let map = null, rt = null;
  const pl = { x: 0, y: 0, dir: 'down', fromX: 0, fromY: 0, t: 1, moving: false, phase: 0, speed: SPEED_WALK };
  let npcs = [];
  let followers = [];
  let busy = 0;
  let encLeft = 20;
  let grace = 0;
  let banner = null;
  let toast = null;
  let path = null;
  let pathInteract = null;
  let bumpT = 0;
  let lastMapId = null;
  let mapTime = 0;
  const cam = { x: 0, y: 0 };
  const layer = { modal: true, update: (dt) => update(dt), draw: (c) => draw(c), onAction: (a) => onAction(a), onPointer: (e) => onPointer(e) };

  // ── 맵 정보 조회 ──
  const inBounds = (x, y) => x >= 0 && y >= 0 && x < map.w && y < map.h;
  const tileAt = (x, y) => (inBounds(x, y) ? rt[y][x] : ' ');
  function objectsAt(x, y) { return map.objects.filter((o) => o.x === x && o.y === y && objVisible(o)); }
  function objVisible(o) {
    if (o.show && !o.show()) return false;
    if (o.type === 'gather' && Game.flag('got:' + o.id)) return false;
    if (o.type === 'note' && o.item && Game.flag('got:' + o.id)) return false;
    return true;
  }
  function objSolid(o) {
    return ['chest', 'lever', 'note-solid', 'block'].includes(o.type) || o.solid === true;
  }
  const npcAt = (x, y) => npcs.find((n) => n.visible && ((n.x === x && n.y === y) || (n.moving && n.fromX === x && n.fromY === y)));
  function blocked(x, y, who) {
    if (!inBounds(x, y)) return true;
    const ch = rt[y][x];
    const td = TILES[ch];
    if (!td || td.solid) return true;
    if (objectsAt(x, y).some(objSolid)) return true;
    const n = npcAt(x, y);
    if (n && n !== who) return true;
    if (who && who !== 'player' && ((pl.x === x && pl.y === y) || (pl.moving && pl.fromX === x && pl.fromY === y))) return true;
    return false;
  }
  const warpAt = (x, y) => map.warps.find((w) => w.x === x && w.y === y);

  // ── 맵 진입 ──
  function buildRuntime() {
    rt = map.tiles.map((r) => r.split(''));
    for (const tf of map.tileFlags) {
      const on = typeof tf.flag === 'function' ? tf.flag() : Game.flag(tf.flag);
      if (on) for (const [x, y] of tf.at || [[tf.x, tf.y]]) rt[y][x] = tf.tile;
    }
  }
  function refreshTiles() { buildRuntime(); }

  function makeNpc(def) {
    return {
      def, id: def.id, x: def.x, y: def.y, dir: def.dir || 'down', fromX: def.x, fromY: def.y, t: 1, moving: false,
      homeX: def.x, homeY: def.y, wait: 1 + Util.rand() * 2, phase: 0, visible: true, frames: null,
    };
  }
  function npcFrames(n) {
    if (n.frames) return n.frames;
    const look = n.def.look;
    if (typeof look === 'string' && look.startsWith('critter:')) n.frames = Chars.critter(look.slice(8));
    else if (typeof look === 'string' && look.startsWith('monster:')) {
      const id = look.slice(8);
      const m = MONSTERS[id];
      const img = MonsterArt.render(m.art, m.pal, { scale: n.def.scale || 0.4 });
      n.frames = { big: img };
    } else n.frames = Chars.build(typeof look === 'string' ? LOOKS[look] : look);
    return n.frames;
  }
  function refreshNpcs() {
    for (const n of npcs) n.visible = !n.def.show || !!n.def.show();
  }

  function findOpen(x, y) {
    // 목표 칸이 막혀 있으면 가까운 빈 칸을 찾는다 (잘못된 위치 생성 방지)
    if (!blocked(x, y, 'player') && !warpAt(x, y)) return [x, y];
    const seen = new Set([x + ',' + y]);
    const q = [[x, y]];
    while (q.length) {
      const [cx, cy] = q.shift();
      for (const d of Object.values(DIRV)) {
        const nx = cx + d[0], ny = cy + d[1];
        const k = nx + ',' + ny;
        if (seen.has(k) || !inBounds(nx, ny)) continue;
        seen.add(k);
        if (!blocked(nx, ny, 'player') && !warpAt(nx, ny)) return [nx, ny];
        q.push([nx, ny]);
      }
    }
    return [x, y];
  }

  function enter(mapId, x, y, dir) {
    if (!MAPS[mapId]) { console.error('unknown map', mapId); mapId = 'rivel'; x = 19; y = 27; }
    map = MAPS[mapId];
    buildRuntime();
    npcs = map.npcs.map(makeNpc);
    refreshNpcs();
    if (!inBounds(x, y) || blocked(x, y, 'player')) {
      const [ox, oy] = findOpen(Util.clamp(x, 0, map.w - 1), Util.clamp(y, 0, map.h - 1));
      console.warn(`[Field] spawn ${mapId}(${x},${y}) blocked → (${ox},${oy})`);
      x = ox; y = oy;
    }
    pl.x = pl.fromX = x; pl.y = pl.fromY = y; pl.dir = dir || 'down'; pl.t = 1; pl.moving = false;
    resetFollowers();
    Game.state.pos = { map: mapId, x, y, dir: pl.dir };
    path = null; pathInteract = null;
    grace = 4;
    resetEnc();
    mapTime = 0;
    if (lastMapId !== mapId && map.kind !== 'interior') banner = { text: map.name, t: 2.6 };
    else if (lastMapId !== mapId && map.kind === 'interior') banner = { text: map.name, t: 1.6 };
    lastMapId = mapId;
    if (map.bgm) Sound.bgm(typeof map.bgm === 'function' ? map.bgm() : map.bgm);
    markVisited();
    updateCamera();
  }

  function resetFollowers() {
    followers = Game.state.party.slice(1).map((id) => ({ id, x: pl.x, y: pl.y, fromX: pl.x, fromY: pl.y, dir: pl.dir }));
  }
  function resetEnc() {
    const z = encZone(pl.x, pl.y);
    const rate = z ? ENCOUNTERS[z].rate : [16, 26];
    encLeft = Util.randInt(rate[0], rate[1]);
  }
  function encZone(x, y) {
    const e = map.enc;
    if (!e) return null;
    if (typeof e === 'string') return e;
    for (const z of e.zones || []) if (x >= z.x && y >= z.y && x < z.x + z.w && y < z.y + z.h) return z.enc;
    return e.default || null;
  }

  async function warp(mapId, x, y, dir, opts = {}) {
    busy++;
    try {
      path = null;
      if (opts.sfx) Sound.sfx(opts.sfx);
      await Engine.fadeOut(opts.slow ? 500 : 200);
      enter(mapId, x, y, dir);
      if (opts.during) await opts.during();
      await Engine.fadeIn(opts.slow ? 500 : 200);
      if (map.onEnter) await Events.run(map.onEnter);
    } finally { busy--; }
  }

  // ── 방문 기록 (던전 미니맵) ──
  function markVisited() {
    if (map.kind !== 'dungeon') return;
    const v = Game.state.visited;
    let s = v[map.id];
    if (!s || s.length !== map.w * map.h) s = '0'.repeat(map.w * map.h);
    const arr = s.split('');
    for (let dy = -3; dy <= 3; dy++) for (let dx = -4; dx <= 4; dx++) {
      const x = pl.x + dx, y = pl.y + dy;
      if (inBounds(x, y)) arr[y * map.w + x] = '1';
    }
    v[map.id] = arr.join('');
  }

  // ── 이동 ──
  function startMove(dir) {
    pl.dir = dir;
    const [dx, dy] = DIRV[dir];
    const nx = pl.x + dx, ny = pl.y + dy;
    if (!inBounds(nx, ny)) {
      if (map.edge) {
        const e = typeof map.edge === 'function' ? map.edge(dir) : map.edge;
        if (e) { Events.run(() => warp(e.map, e.x, e.y, e.dir || dir)); return true; }
      }
      bump();
      return false;
    }
    if (blocked(nx, ny, 'player')) {
      bump();
      return false;
    }
    // 동료 이동 (앞 사람의 이전 위치로)
    let px = pl.x, py = pl.y, pdir = pl.dir;
    for (const f of followers) {
      const ox = f.x, oy = f.y, od = f.dir;
      f.fromX = f.x; f.fromY = f.y;
      if (f.x !== px || f.y !== py) { f.dir = px > f.x ? 'right' : px < f.x ? 'left' : py > f.y ? 'down' : 'up'; }
      f.x = px; f.y = py;
      px = ox; py = oy; pdir = od;
    }
    pl.fromX = pl.x; pl.fromY = pl.y;
    pl.x = nx; pl.y = ny;
    pl.t = 0; pl.moving = true;
    pl.speed = (Input.isHeld('run') ? !Settings.get('autoRun') : Settings.get('autoRun')) ? SPEED_RUN : SPEED_WALK;
    return true;
  }
  function bump() {
    if (bumpT <= 0) { Sound.sfx('bump'); bumpT = 0.3; }
  }

  function onStepEnd() {
    const st = Game.state;
    st.steps++;
    st.pos = { map: map.id, x: pl.x, y: pl.y, dir: pl.dir };
    pl.phase++;
    markVisited();
    if (grace > 0) grace--;
    // 독: 4걸음마다 HP 감소 (1 미만으로는 떨어지지 않음)
    if (st.steps % 4 === 0) {
      let hurt = false;
      for (const id of st.party) {
        const m = st.members[id];
        if (m.hp > 0 && m.status.poison) { const loss = Math.max(1, Math.floor(Game.stats(id).maxhp * 0.03)); if (m.hp > 1) { m.hp = Math.max(1, m.hp - loss); hurt = true; } }
      }
      if (hurt) { Engine.flash('#a040c0', 0.15); Sound.sfx('poison'); }
    }
    if (st.ward > 0) {
      st.ward--;
      if (st.ward === 0) showToast('정령의 향의 효과가 사라졌다.');
    }
    // 워프
    const w = warpAt(pl.x, pl.y);
    if (w) {
      if (w.cond && !w.cond()) {
        if (w.blocked) Events.run(async () => { await w.blocked(); await stepBack(); });
        return true;
      }
      const sfx = w.sfx || ({ D: 'door', E: 'door', '<': 'stairs', '>': 'stairs' }[tileAt(pl.x, pl.y)] || null);
      Events.run(() => warp(w.to, w.tx, w.ty, w.dir || pl.dir, { sfx }));
      return true;
    }
    // 밟으면 발동하는 이벤트
    for (const tr of map.triggers) {
      if (pl.x >= tr.x && pl.y >= tr.y && pl.x < tr.x + (tr.w || 1) && pl.y < tr.y + (tr.h || 1)) {
        if (tr.once && Game.flag(tr.once)) continue;
        if (tr.when && !tr.when()) continue;
        path = null;
        Events.run(async () => { await tr.run(); if (tr.once) Game.setFlag(tr.once); });
        return true;
      }
    }
    // 인카운터
    const z = encZone(pl.x, pl.y);
    if (z && grace <= 0 && st.ward <= 0 && !Game.flag('debug_noenc')) {
      encLeft -= TILES[tileAt(pl.x, pl.y)].road ? 0.6 : 1;
      if (encLeft <= 0) {
        resetEnc();
        path = null;
        const zone = ENCOUNTERS[z];
        const group = Util.weighted(zone.groups);
        Events.run(async () => { await S.battle(group.e, { bg: zone.bg }); grace = 3; });
        return true;
      }
    }
    return false;
  }

  // 막힌 문 등에서 한 칸 뒤로
  async function stepBack() {
    const back = { up: 'down', down: 'up', left: 'right', right: 'left' }[pl.dir];
    await walkPlayer([back], true);
  }

  // ── 상호작용 ──
  function frontTile() { const [dx, dy] = DIRV[pl.dir]; return [pl.x + dx, pl.y + dy]; }
  function interact() {
    if (pl.moving || busy) return;
    let [fx, fy] = frontTile();
    let n = npcAt(fx, fy);
    if (!n && TILES[tileAt(fx, fy)] && TILES[tileAt(fx, fy)].counter) {
      const [dx, dy] = DIRV[pl.dir];
      n = npcAt(fx + dx, fy + dy);
    }
    if (n && n.def.talk) {
      path = null;
      Events.run(async () => {
        const prev = n.dir;
        if (!n.def.noTurn) n.dir = { up: 'down', down: 'up', left: 'right', right: 'left' }[pl.dir];
        n.talking = true;
        try { await n.def.talk(n); } finally { n.talking = false; if (n.def.move === 'static') n.dir = n.def.keepDir ? prev : n.dir; }
      });
      return;
    }
    const objs = objectsAt(fx, fy);
    if (objs.length) { Events.run(() => useObject(objs[0])); return; }
    // 발밑 조사
    const feet = objectsAt(pl.x, pl.y).filter((o) => o.type === 'search' || o.type === 'gather' || o.type === 'note');
    if (feet.length) { Events.run(() => useObject(feet[0])); return; }
  }

  async function useObject(o) {
    switch (o.type) {
      case 'sign': Sound.sfx('cursor'); await S.say(null, o.text); break;
      case 'chest': {
        const key = 'chest:' + o.id;
        if (Game.flag(key)) { await S.say(null, '빈 상자다.'); break; }
        if (o.mimic) {
          await S.say(null, '상자를 열려고 하자 뚜껑이 저절로 덜컹거린다…!');
          Engine.shake(5, 0.4);
          const r = await S.battle(['greed_chest'], { bg: map.kind === 'dungeon' ? 'ruins' : 'plains', ambushSafe: true });
          if (r !== 'win') break;
          Game.setFlag(key);
          await S.say(null, '탐욕상자가 품고 있던 보물이 쏟아졌다!');
        } else {
          Sound.sfx('chest');
          Game.setFlag(key);
          await Engine.wait(250);
        }
        if (o.gold) await S.gold(o.gold, true);
        if (o.item) await S.give(o.item, o.n || 1, { from: '보물상자에서 ' });
        if (o.after) await o.after();
        break;
      }
      case 'search': {
        const key = 'got:' + o.id;
        if (Game.flag(key)) { if (o.empty) await S.say(null, o.empty); break; }
        if (o.cond && !o.cond()) { if (o.empty) await S.say(null, o.empty); break; }
        Game.setFlag(key);
        if (o.msg) await S.say(null, o.msg);
        if (o.gold) await S.gold(o.gold, true);
        if (o.item) await S.give(o.item, o.n || 1);
        if (o.after) await o.after();
        break;
      }
      case 'gather': {
        const key = 'got:' + o.id;
        if (Game.flag(key)) break;
        Game.setFlag(key);
        if (o.msg) await S.say(null, o.msg);
        await S.give(o.item, o.n || 1);
        break;
      }
      case 'note': {
        await S.say(null, o.text);
        if (o.item && !Game.flag('got:' + o.id)) { Game.setFlag('got:' + o.id); await S.give(o.item, 1); }
        if (o.after) await o.after();
        break;
      }
      case 'lever': {
        const on = !Game.flag(o.flag);
        Game.setFlag(o.flag, on);
        Sound.sfx('door');
        Engine.shake(2, 0.15);
        await S.say(null, on ? '레버를 당겼다. 어딘가에서 철컥 하는 소리가 났다.' : '레버를 원래대로 되돌렸다.');
        if (o.after) await o.after(on);
        refreshTiles();
        break;
      }
      case 'event':
      case 'block':
        if (o.run) await o.run(o);
        break;
    }
    refreshNpcs();
  }

  // ── 자동 이동 (마우스/터치 클릭) ──
  function findPath(tx, ty, adjacent) {
    const goal = (x, y) => (adjacent ? Math.abs(x - tx) + Math.abs(y - ty) === 1 : x === tx && y === ty);
    const start = [pl.x, pl.y];
    if (goal(pl.x, pl.y)) return [];
    const prev = new Map();
    const key = (x, y) => x + ',' + y;
    prev.set(key(pl.x, pl.y), null);
    const q = [start];
    let found = null;
    let guard = 0;
    while (q.length && guard++ < 4000) {
      const [cx, cy] = q.shift();
      for (const dname of ['up', 'down', 'left', 'right']) {
        const [dx, dy] = DIRV[dname];
        const nx = cx + dx, ny = cy + dy;
        const k = key(nx, ny);
        if (prev.has(k) || !inBounds(nx, ny)) continue;
        if (blocked(nx, ny, 'player')) continue;
        // 워프 칸은 목적지일 때만 통과
        if (warpAt(nx, ny) && !(nx === tx && ny === ty)) continue;
        prev.set(k, [cx, cy, dname]);
        if (goal(nx, ny)) { found = [nx, ny]; q.length = 0; break; }
        q.push([nx, ny]);
      }
    }
    if (!found) return null;
    const dirs = [];
    let cur = found;
    while (true) {
      const p = prev.get(key(cur[0], cur[1]));
      if (!p) break;
      dirs.unshift(p[2]);
      cur = [p[0], p[1]];
    }
    return dirs;
  }

  function onPointer(ev) {
    if (ev.type !== 'down' || busy || !Engine.isTop(layer) || Engine.fading) return true;
    // 메뉴 버튼
    if (ev.x > Engine.W - 54 && ev.y < 50) { openMenu(); return true; }
    const wx = Math.floor((ev.x / 2 + cam.x) / TS), wy = Math.floor((ev.y / 2 + cam.y) / TS);
    if (wx === pl.x && wy === pl.y) { interact(); return true; }
    const target = npcAt(wx, wy) || objectsAt(wx, wy)[0];
    const solid = blocked(wx, wy, 'player') || !!target;
    let dirs = findPath(wx, wy, solid);
    if (dirs === null && solid && TILES[tileAt(wx, wy)] && TILES[tileAt(wx, wy)].counter) dirs = null;
    if (dirs === null) { bump(); return true; }
    path = dirs;
    pathInteract = solid ? [wx, wy] : null;
    if (!path.length && pathInteract) { faceToward(wx, wy); interact(); path = null; }
    return true;
  }
  function faceToward(x, y) {
    if (x > pl.x) pl.dir = 'right'; else if (x < pl.x) pl.dir = 'left'; else if (y > pl.y) pl.dir = 'down'; else if (y < pl.y) pl.dir = 'up';
  }

  function onAction(a) {
    if (busy || Engine.fading) return;
    if (a === 'confirm') interact();
    else if (a === 'cancel' || a === 'menu') { if (!pl.moving) openMenu(); }
    else if (a === 'map') { if (!pl.moving) Events.run(() => MapView.open()); }
    if (['up', 'down', 'left', 'right'].includes(a)) path = null;
  }

  function openMenu() {
    if (busy) return;
    path = null;
    Sound.sfx('menu');
    Events.run(() => Menu.open());
  }

  // ── 업데이트 ──
  function update(dt) {
    if (!map) return;
    mapTime += dt;
    if (bumpT > 0) bumpT -= dt;
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
    updateNpcs(dt);
    const canControl = Engine.isTop(layer) && !busy && !Engine.fading;
    if (pl.moving) {
      pl.t += dt * pl.speed;
      if (pl.t >= 1) {
        pl.t = 1; pl.moving = false;
        for (const f of followers) { f.fromX = f.x; f.fromY = f.y; }
        if (pl.onArrive) { const cb = pl.onArrive; pl.onArrive = null; cb(); }
        else {
          const stop = onStepEnd();
          if (!stop && canControl && !busy) continueMove();
        }
      }
    } else if (canControl) {
      continueMove();
    }
    updateCamera();
  }
  function continueMove() {
    const d = Input.dir();
    if (d) { path = null; if (!startMove(d)) pl.dir = d; return; }
    if (path && path.length) {
      const nd = path.shift();
      if (!startMove(nd)) { path = null; pathInteract = null; }
      return;
    }
    if (path && !path.length) {
      path = null;
      if (pathInteract) { const [ix, iy] = pathInteract; pathInteract = null; faceToward(ix, iy); interact(); }
    }
  }

  function updateNpcs(dt) {
    for (const n of npcs) {
      if (!n.visible) continue;
      if (n.moving) {
        n.t += dt * (n.speed || NPC_SPEED);
        if (n.t >= 1) { n.t = 1; n.moving = false; n.phase++; if (n.onArrive) { const f = n.onArrive; n.onArrive = null; f(); } }
        continue;
      }
      if (n.scripted || n.talking || busy) continue;
      const mv = n.def.move || 'static';
      if (mv === 'static') continue;
      n.wait -= dt;
      if (n.wait > 0) continue;
      n.wait = 1.2 + Util.rand() * 2.5;
      const dname = Util.pick(['up', 'down', 'left', 'right']);
      if (mv === 'turn') { n.dir = dname; continue; }
      const [dx, dy] = DIRV[dname];
      const nx = n.x + dx, ny = n.y + dy;
      const r = n.def.radius || 2;
      n.dir = dname;
      if (Math.abs(nx - n.homeX) > r || Math.abs(ny - n.homeY) > r) continue;
      if (blocked(nx, ny, n) || warpAt(nx, ny)) continue;
      if (followers.some((f) => f.x === nx && f.y === ny)) continue;
      n.fromX = n.x; n.fromY = n.y; n.x = nx; n.y = ny; n.t = 0; n.moving = true;
    }
  }

  // 스크립트용: NPC 이동 (충돌 무시)
  function walkNpc(id, dirs, speed = NPC_SPEED) {
    const n = npcs.find((x) => x.id === id);
    if (!n) return Promise.resolve();
    n.scripted = true;
    return new Promise((resolve) => {
      const next = () => {
        if (!dirs.length) { n.scripted = false; resolve(); return; }
        const d = dirs.shift();
        n.dir = d;
        const [dx, dy] = DIRV[d];
        n.fromX = n.x; n.fromY = n.y; n.x += dx; n.y += dy; n.t = 0; n.moving = true; n.speed = speed;
        n.onArrive = next;
      };
      next();
    });
  }
  // 스크립트용: 주인공 이동 (동료도 따라온다). 이동 중 워프·인카운터는 발생하지 않는다.
  function walkPlayer(dirs, ignoreBlock = false) {
    return new Promise((resolve) => {
      const step = () => {
        if (!dirs.length) { resolve(); return; }
        const d = dirs.shift();
        const [dx, dy] = DIRV[d];
        pl.dir = d;
        if (!ignoreBlock && blocked(pl.x + dx, pl.y + dy, 'player')) { resolve(); return; }
        let px = pl.x, py = pl.y;
        for (const f of followers) { const ox = f.x, oy = f.y; f.fromX = f.x; f.fromY = f.y; if (f.x !== px || f.y !== py) f.dir = px > f.x ? 'right' : px < f.x ? 'left' : py > f.y ? 'down' : 'up'; f.x = px; f.y = py; px = ox; py = oy; }
        pl.fromX = pl.x; pl.fromY = pl.y; pl.x += dx; pl.y += dy; pl.t = 0; pl.moving = true; pl.speed = SPEED_WALK;
        pl.onArrive = () => {
          pl.phase++;
          Game.state.pos = { map: map.id, x: pl.x, y: pl.y, dir: pl.dir };
          step();
        };
      };
      step();
    });
  }

  function updateCamera() {
    const ppx = Util.lerp(pl.fromX, pl.x, pl.t) * TS, ppy = Util.lerp(pl.fromY, pl.y, pl.t) * TS;
    const mw = map.w * TS, mh = map.h * TS;
    cam.x = mw <= Engine.LW ? -(Engine.LW - mw) / 2 : Util.clamp(ppx + 8 - Engine.LW / 2, 0, mw - Engine.LW);
    cam.y = mh <= Engine.LH ? -(Engine.LH - mh) / 2 : Util.clamp(ppy + 8 - Engine.LH / 2, 0, mh - Engine.LH);
    cam.x = Math.round(cam.x); cam.y = Math.round(cam.y);
  }

  // ── 그리기 ──
  function hasNell() { return Game.state.party.includes('nell'); }
  function draw(ctx) {
    if (!map) return;
    const g = Engine.lctx;
    g.fillStyle = '#000';
    g.fillRect(0, 0, Engine.LW, Engine.LH);
    const x0 = Math.max(0, Math.floor(cam.x / TS)), y0 = Math.max(0, Math.floor(cam.y / TS));
    const x1 = Math.min(map.w - 1, Math.floor((cam.x + Engine.LW) / TS)), y1 = Math.min(map.h - 1, Math.floor((cam.y + Engine.LH) / TS));
    const T = Engine.time;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) Tiles.drawAt(g, { rt, base: map.base, baseAt: map.baseAt }, x, y, x * TS - cam.x, y * TS - cam.y, T);
    // 오브젝트
    for (const o of map.objects) {
      if (!objVisible(o)) continue;
      const sx = o.x * TS - cam.x, sy = o.y * TS - cam.y;
      if (sx < -48 || sy < -48 || sx > Engine.LW + 48 || sy > Engine.LH + 48) continue;
      if (o.type === 'chest') g.drawImage(ObjArt.chest(Game.flag('chest:' + o.id), o.color), sx, sy);
      else if (o.type === 'lever') g.drawImage(ObjArt.lever(!!Game.flag(o.flag)), sx, sy);
      else if (o.type === 'gather') g.drawImage(ObjArt.herb(Math.floor(T * 2) % 2), sx, sy);
      else if (o.type === 'note') g.drawImage(ObjArt.note(), sx, sy);
      else if (o.type === 'rope') g.drawImage(ObjArt.rope(), sx, sy);
      else if (o.type === 'deco' && o.draw === 'windmill') ObjArt.windmill(g, sx + 8, sy + 6, T);
      else if (o.type === 'deco' && o.draw === 'bell') g.drawImage(ObjArt.bell(!!Game.flag('velgar_defeated')), sx - 24, sy - 30);
      else if (o.type === 'search' && o.hidden && hasNell() && !Game.flag('got:' + o.id)) g.drawImage(ObjArt.sparkle(T + o.x), sx, sy);
      else if (o.art === 'circle') {
        // 귀환의 마법진
        g.save();
        g.globalAlpha = 0.55 + 0.25 * Math.sin(T * 3);
        g.strokeStyle = '#9fd3ff'; g.lineWidth = 1;
        g.beginPath(); g.ellipse(sx + 8, sy + 9, 7, 4, 0, 0, Math.PI * 2); g.stroke();
        g.beginPath(); g.ellipse(sx + 8, sy + 9, 4, 2, 0, 0, Math.PI * 2); g.stroke();
        g.fillStyle = '#ffffff'; g.fillRect(sx + 7, sy + 1 + ((T * 12) % 8), 1, 2); g.fillRect(sx + 4, sy + 3 + ((T * 9) % 6), 1, 1); g.fillRect(sx + 11, sy + 2 + ((T * 10) % 7), 1, 1);
        g.restore();
      }
    }
    // 인물 (y 정렬)
    const sprites = [];
    const party = Game.state.party;
    const lead = party[0];
    sprites.push({ y: Util.lerp(pl.fromY, pl.y, pl.t), x: Util.lerp(pl.fromX, pl.x, pl.t), frames: Chars.build(LOOKS[CHARACTERS[lead].look]), dir: pl.dir, moving: pl.moving, phase: pl.phase, t: pl.t, alpha: 1, order: 2 });
    followers.forEach((f, i) => {
      const m = Game.state.members[f.id];
      if (!m) return;
      const t = pl.t;
      sprites.push({ y: Util.lerp(f.fromY, f.y, t), x: Util.lerp(f.fromX, f.x, t), frames: Chars.build(LOOKS[CHARACTERS[f.id].look]), dir: f.dir, moving: pl.moving, phase: pl.phase + i + 1, t: pl.t, alpha: m.hp > 0 ? 1 : 0.45, order: 1 });
    });
    for (const n of npcs) {
      if (!n.visible) continue;
      const fr = npcFrames(n);
      sprites.push({ y: Util.lerp(n.fromY, n.y, n.t), x: Util.lerp(n.fromX, n.x, n.t), frames: fr, dir: n.dir, moving: n.moving, phase: n.phase, t: n.t, alpha: 1, order: 0, npc: n });
    }
    sprites.sort((a, b) => a.y - b.y || a.order - b.order);
    for (const s of sprites) {
      const sx = Math.round(s.x * TS - cam.x), sy = Math.round(s.y * TS - cam.y);
      g.globalAlpha = s.alpha;
      if (s.frames.big) {
        const img = s.frames.big;
        const bob = Math.sin(T * 3) > 0.6 ? 1 : 0;
        g.drawImage(img, sx + 8 - Math.floor(img.width / 2), sy + 16 - img.height - bob);
      } else {
        const img = s.frames.critter ? (s.moving ? s.frames[s.dir][s.phase % 2] : s.frames[s.dir][0]) : Chars.frameFor(s.frames, s.dir, s.moving ? s.phase * 2 + (s.t < 0.5 ? 1 : 0) : 0);
        g.drawImage(img, sx, sy - 4);
      }
      g.globalAlpha = 1;
      if (s.npc && s.npc.def.mark && s.npc.def.mark()) {
        // 퀘스트 표시 (!)
        const by = sy - 12 + Math.sin(T * 5) * 1.5;
        g.fillStyle = '#ffd75e'; g.fillRect(sx + 7, by, 2, 5); g.fillRect(sx + 7, by + 6, 2, 2);
      }
    }
    Engine.blitLow(ctx);
    drawHud(ctx);
  }

  function drawHud(ctx) {
    const top = Engine.isTop(layer) && !busy;
    if (banner) {
      const a = Math.min(1, banner.t * 2);
      ctx.globalAlpha = a;
      const w = Math.max(200, Text.width(ctx, banner.text, 22, true) + 60);
      UI.drawWindow(ctx, Engine.W / 2 - w / 2, 18, w, 46);
      Text.draw(ctx, banner.text, Engine.W / 2, 29, { size: 22, bold: true, align: 'center', color: Theme.gold });
      ctx.globalAlpha = 1;
    }
    if (top && Settings.get('showGoal') && !banner) {
      const g = Quests.currentGoal();
      if (g) {
        ctx.fillStyle = 'rgba(10,12,30,0.62)';
        const tw = Math.min(520, Text.width(ctx, g.text, 15) + 40);
        UI.roundRect(ctx, 8, 8, tw, 28, 6); ctx.fill();
        Text.draw(ctx, '★ ' + g.text, 18, 14, { size: 15, color: '#ffe9a8', maxW: tw - 20 });
      }
    }
    if (top) {
      // 메뉴 버튼
      ctx.fillStyle = 'rgba(10,12,30,0.6)';
      UI.roundRect(ctx, Engine.W - 48, 8, 40, 36, 7); ctx.fill();
      ctx.fillStyle = '#f4f1e6';
      for (let i = 0; i < 3; i++) ctx.fillRect(Engine.W - 38, 16 + i * 8, 20, 3);
    }
    if (toast) {
      ctx.globalAlpha = Math.min(1, toast.t * 2);
      const w = Text.width(ctx, toast.text, 17) + 40;
      UI.drawWindow(ctx, Engine.W / 2 - w / 2, Engine.H - 70, w, 40);
      Text.draw(ctx, toast.text, Engine.W / 2, Engine.H - 60, { size: 17, align: 'center' });
      ctx.globalAlpha = 1;
    }
  }

  function showToast(text, sec = 2.2) { toast = { text, t: sec }; }

  return {
    layer, enter, warp, walkNpc, walkPlayer, refreshNpcs, refreshTiles, showToast, findPath, interact,
    get map() { return map; }, get player() { return pl; }, get npcs() { return npcs; },
    get busy() { return busy; }, set busy(v) { busy = v; },
    npc: (id) => npcs.find((n) => n.id === id),
    blocked: (x, y) => blocked(x, y, 'player'),
    tileAt, objectsAt, warpAt, resetFollowers, encZone,
    setBanner(text) { banner = { text, t: 2.4 }; },
    get cam() { return cam; },
    get encLeft() { return encLeft; },
    set encLeft(v) { encLeft = v; },
  };
})();


// ── src/scenes/battle.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// Battle: 전투 화면 (연출 + 명령 입력). 규칙은 BattleCore가 담당.
// ─────────────────────────────────────────────────────────────
const BattleBG = (() => {
  const cache = {};
  function sky(p, top, bot, h) {
    for (let y = 0; y < h; y++) { const t = y / h; p.rect(0, y, 320, 1, Pix.mix(top, bot, t)); }
  }
  const DEFS = {
    plains(p, g) {
      sky(p, '#5ea8ec', '#bfe4ff', 110);
      g.fillStyle = '#ffffff'; for (const [x, y, w] of [[30, 20, 40], [200, 34, 56], [140, 12, 30]]) { g.fillRect(x, y, w, 6); g.fillRect(x + 6, y - 4, w - 14, 4); }
      g.fillStyle = '#7aa6c8'; g.beginPath(); g.moveTo(0, 100); for (let x = 0; x <= 320; x += 20) g.lineTo(x, 84 + Math.sin(x * 0.04) * 10); g.lineTo(320, 110); g.lineTo(0, 110); g.fill();
      g.fillStyle = '#4f9b3f'; g.beginPath(); g.moveTo(0, 104); for (let x = 0; x <= 320; x += 16) g.lineTo(x, 98 + Math.sin(x * 0.07 + 1) * 5); g.lineTo(320, 240); g.lineTo(0, 240); g.fill();
      p.rect(0, 112, 320, 128, '#5fae4c');
      p.noise(['#4f9b3f', '#76c45e'], 0.06, 3, [0, 112, 320, 128]);
      for (let i = 0; i < 6; i++) p.ellipse(40 + i * 50, 150 + (i % 2) * 12, 30, 6, 'rgba(60,120,50,0.5)');
    },
    forest(p, g) {
      sky(p, '#3a6a5a', '#9ad0a8', 110);
      for (let i = 0; i < 14; i++) { const x = i * 24 - 6, h = 60 + (i * 37) % 30; g.fillStyle = i % 2 ? '#1f5a30' : '#2a6a3a'; g.beginPath(); g.moveTo(x, 112); g.lineTo(x + 14, 112 - h); g.lineTo(x + 28, 112); g.fill(); }
      p.rect(0, 112, 320, 128, '#4a8a3a'); p.noise(['#3a7a30', '#5a9a48'], 0.08, 7, [0, 112, 320, 128]);
      for (let i = 0; i < 5; i++) p.ellipse(30 + i * 66, 160, 26, 5, 'rgba(30,70,30,0.5)');
    },
    ruins(p, g) {
      p.rect(0, 0, 320, 240, '#1c1a26');
      for (let y = 0; y < 112; y += 8) for (let x = (y / 8) % 2 ? 0 : 12; x < 320; x += 24) { p.rect(x, y, 23, 7, '#2e2a3c'); p.rect(x, y, 23, 1, '#3a3650'); }
      for (const x of [40, 270]) { p.rect(x, 20, 18, 92, '#4a465c'); p.rect(x, 20, 4, 92, '#5e5a72'); p.rect(x - 4, 16, 26, 6, '#5e5a72'); }
      for (const x of [100, 220]) { p.rect(x, 50, 3, 10, '#5e3818'); p.circle(x + 1, 46, 3, '#ff9030'); p.circle(x + 1, 45, 1, '#ffe080'); }
      p.rect(0, 112, 320, 128, '#3c384a'); for (let x = 0; x < 320; x += 32) p.rect(x, 112, 1, 128, '#2e2a3c'); for (let y = 112; y < 240; y += 16) p.rect(0, y, 320, 1, '#2e2a3c');
      g.fillStyle = 'rgba(124,196,255,0.08)'; g.beginPath(); g.ellipse(160, 150, 120, 26, 0, 0, Math.PI * 2); g.fill();
    },
    cave(p, g) {
      p.rect(0, 0, 320, 240, '#241c16');
      for (let i = 0; i < 12; i++) { const x = i * 30; g.fillStyle = '#3a2e22'; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 15, 26 + (i * 13) % 20); g.lineTo(x + 30, 0); g.fill(); }
      p.rect(0, 112, 320, 128, '#4a3c2e'); p.noise(['#3a2e22', '#5a4a38'], 0.1, 11, [0, 112, 320, 128]);
      g.fillStyle = 'rgba(60,120,200,0.25)'; g.beginPath(); g.ellipse(250, 140, 50, 10, 0, 0, Math.PI * 2); g.fill();
    },
    bell(p, g) {
      sky(p, '#140c24', '#3a2050', 112);
      g.fillStyle = 'rgba(200,160,80,0.25)'; g.beginPath(); g.moveTo(130, 10); g.quadraticCurveTo(160, -4, 190, 10); g.lineTo(204, 96); g.lineTo(116, 96); g.fill();
      for (const x of [30, 280]) { p.rect(x, 10, 16, 102, '#3a3650'); p.rect(x, 10, 3, 102, '#4a465c'); }
      p.rect(0, 112, 320, 128, '#2a2438'); p.rect(120, 112, 80, 128, '#5a1a2a'); p.rect(120, 112, 3, 128, '#c4a050'); p.rect(197, 112, 3, 128, '#c4a050');
    },
  };
  function get(name) {
    if (!cache[name]) cache[name] = Pix.make(320, 240, (p, g) => (DEFS[name] || DEFS.plains)(p, g));
    return cache[name];
  }
  return { get };
})();

const Battle = (() => {
  let core = null;
  let opts = null;
  let disp = new Map();       // actor → 표시 상태
  let popups = [];
  let effects = [];
  let msgLines = [];
  let msgShown = 0;
  let msgTotal = 0;
  let skipWait = false;
  let active = null;          // 명령 입력 중인 동료
  let targeting = null;       // {list, index, all}
  let introText = null;
  let darken = 0;
  let resultText = null;
  const PANEL_W = 152;

  const speedDelay = () => [900, 520, 240][Settings.get('battleSpeed')] || 520;

  // ── 레이어 ──
  const layer = {
    modal: true,
    update(dt) {
      for (const p of popups) p.t += dt;
      popups = popups.filter((p) => p.t < p.dur);
      for (const e of effects) e.t += dt;
      effects = effects.filter((e) => e.t < e.dur);
      for (const [, d] of disp) {
        if (d.flash > 0) d.flash -= dt;
        if (d.shake > 0) d.shake -= dt;
        if (d.dying > 0) d.dying = Math.max(0, d.dying - dt);
        if (d.appear < 1) d.appear = Math.min(1, d.appear + dt * 3);
      }
      if (msgShown < msgTotal) msgShown = Math.min(msgTotal, msgShown + dt * [70, 120, 260][Settings.get('battleSpeed')]);
      if (introText) introText.t += dt;
    },
    onAction(a) { if (a === 'confirm' || a === 'cancel') skipWait = true; },
    onPointer(ev) { if (ev.type === 'down') skipWait = true; return true; },
    draw(ctx) { draw(ctx); },
  };

  // ── 배치 ──
  function layoutEnemies() {
    const list = core.enemies.filter((e) => e.alive || (disp.get(e) && disp.get(e).dying > 0));
    let total = 0;
    const imgs = list.map((e) => { const d = disp.get(e) || {}; const img = MonsterArt.forMonster(e.defId, d.variant); total += img.width; return img; });
    total += (list.length - 1) * 10;
    let x = Math.max(4, (320 - total) / 2);
    list.forEach((e, i) => {
      const img = imgs[i];
      let d = disp.get(e);
      if (!d) { d = { flash: 0, shake: 0, dying: 0, appear: 0, variant: 1 }; disp.set(e, d); }
      d.img = img; d.w = img.width; d.h = img.height;
      d.x = Math.round(x); d.y = Math.round(170 - img.height);
      x += img.width + 10;
    });
  }
  function partyPanelX(i) {
    const n = core.party.length;
    const total = n * PANEL_W + (n - 1) * 6;
    return (Engine.W - total) / 2 + i * (PANEL_W + 6);
  }
  function actorCenter(a) {
    if (a.isParty) { const i = core.party.indexOf(a); return { x: partyPanelX(i) + PANEL_W / 2, y: 46 }; }
    const d = disp.get(a);
    if (!d) return { x: 320, y: 220 };
    return { x: (d.x + d.w / 2) * 2, y: (d.y + d.h / 2) * 2 };
  }

  // ── 메시지 ──
  async function say(text, opts2 = {}) {
    const ctx = Engine.ctx;
    const lines = Text.layout(ctx, Util.fill(text), Engine.W - 60, 18);
    for (const l of lines) msgLines.push(l);
    while (msgLines.length > 3) msgLines.shift();
    msgTotal = msgLines.reduce((n, l) => n + Text.lineLen(l), 0);
    msgShown = Math.max(0, msgTotal - lines.reduce((n, l) => n + Text.lineLen(l), 0));
    skipWait = false;
    while (msgShown < msgTotal) { if (skipWait) { msgShown = msgTotal; skipWait = false; break; } await Engine.frames(1); }
    await hold(opts2.wait !== undefined ? opts2.wait : speedDelay());
  }
  async function hold(ms) {
    skipWait = false;
    const end = performance.now() + ms;
    while (performance.now() < end) { if (skipWait) { skipWait = false; return; } await Engine.frames(1); }
  }
  async function waitConfirm() {
    skipWait = false;
    resultText = '▼';
    while (!skipWait) await Engine.frames(1);
    resultText = null;
    skipWait = false;
  }
  function clearMsg() { msgLines = []; msgShown = msgTotal = 0; }

  function popup(a, text, color, big) {
    const c = actorCenter(a);
    popups.push({ x: c.x + Util.randInt(-8, 8), y: a.isParty ? 70 : c.y - 10, text, color, t: 0, dur: 0.9, big });
  }

  // ── 연출 이벤트 재생 ──
  async function present(events) {
    for (const e of events) {
      switch (e.type) {
        case 'msg': await say(e.text); break;
        case 'anim': await playAnim(e); break;
        case 'damage': {
          const d = disp.get(e.target);
          if (e.target.isParty) {
            d.hp = e.hpAfter; d.shake = 0.35; d.flash = 0.3;
            if (!e.poison) { Sound.sfx(e.crit ? 'crit' : 'hurt'); Engine.shake(e.crit ? 6 : 3, 0.25); }
            else Sound.sfx('poison');
          } else {
            d.flash = 0.35;
            if (e.poison) Sound.sfx('poison'); else Sound.sfx(e.crit ? 'crit' : 'hit');
            if (e.crit) Engine.shake(5, 0.25);
          }
          popup(e.target, String(e.amount), e.poison ? Theme.purple : e.crit ? Theme.gold : e.weak ? '#ffb347' : '#ffffff', e.crit || e.weak);
          await Engine.wait(120);
          break;
        }
        case 'heal': { const d = disp.get(e.target); if (d) d.hp = e.hpAfter; popup(e.target, '+' + e.amount, Theme.green); break; }
        case 'mp': { const d = disp.get(e.target); if (d) d.mp = e.mpAfter; if (e.gain) popup(e.target, '+' + e.gain + ' MP', Theme.blue); break; }
        case 'miss': popup(e.target, 'MISS', '#b0b0c0'); Sound.sfx('miss'); break;
        case 'die': {
          const d = disp.get(e.target);
          if (e.target.isParty) { d.hp = 0; Sound.sfx('hurt'); }
          else { d.dying = 0.5; Sound.sfx('enemyDie'); await Engine.wait(e.silent ? 150 : 350); }
          break;
        }
        case 'revive': { const d = disp.get(e.target); d.hp = e.hpAfter; Sound.sfx('heal'); break; }
        case 'status': Sound.sfx(e.on ? 'status' : 'heal'); break;
        case 'buff': Sound.sfx(e.reset ? 'cursor' : e.up ? 'buff' : 'debuff'); effects.push({ name: e.up ? 'up' : 'down', pos: [actorCenter(e.target)], t: 0, dur: 0.6 }); break;
        case 'summon': for (const a of e.actors) disp.set(a, { flash: 0, shake: 0, dying: 0, appear: 0, variant: 1 }); layoutEnemies(); Engine.flash('#c040ff', 0.3); await Engine.wait(300); break;
        case 'flee': { const d = disp.get(e.target); d.dying = 0.5; Sound.sfx('escape'); await say(Util.fill(SKILLS.flee.msg, { A: e.target.name })); break; }
        case 'phase': { const d = disp.get(e.target); d.variant = e.variant; d.flash = 0.6; layoutEnemies(); break; }
        case 'shake': Engine.shake(e.mag || 5, 0.5); break;
        case 'sfx': Sound.sfx(e.name); break;
        case 'analyze': effects.push({ name: 'scan', pos: [actorCenter(e.target)], t: 0, dur: 0.6 }); Sound.sfx('confirm'); await Engine.wait(350); break;
      }
      // 적이 모두 사라지면 남은 사망 연출만 정리
    }
    layoutEnemies();
  }

  async function playAnim(e) {
    const pos = (e.targets || []).filter(Boolean).map(actorCenter);
    const name = e.name;
    const dur = { slash: 0.25, bigslash: 0.35, starslash: 0.4, fire: 0.6, ice: 0.6, thunder: 0.5, light: 0.6, dark: 0.6, heal: 0.6, buff: 0.5, debuff: 0.5, mist: 0.7, wave: 0.8, impact: 0.4, quake: 0.6, guard: 0.4, scan: 0.5, steal: 0.3 }[name] || 0.4;
    const sfx = { fire: 'fire', ice: 'ice', thunder: 'thunder', light: 'light', dark: 'dark', heal: 'heal', buff: 'buff', debuff: 'debuff', mist: 'mist', wave: 'bell', impact: 'impact', quake: 'impact', guard: 'buff', starslash: 'light' }[name];
    if (sfx) Sound.sfx(sfx);
    if (name === 'thunder') Engine.flash('#fff6b0', 0.25);
    if (name === 'wave') { Engine.shake(7, 0.7); Engine.flash('#c8a0ff', 0.3); }
    if (name === 'impact' || name === 'quake') Engine.shake(6, 0.4);
    // 적 공격은 화면 흔들림만 (아군 패널이 흔들림)
    if (e.user && !e.user.isParty && (name === 'slash' || !name)) return;
    effects.push({ name, pos, t: 0, dur, miss: e.miss });
    await Engine.wait(dur * 1000 * (e.miss ? 0.5 : 0.85));
  }

  // ── 그리기 ──
  function draw(ctx) {
    const g = Engine.lctx;
    g.drawImage(BattleBG.get(opts.bg || 'plains'), 0, 0);
    // 적
    for (const e of core.enemies) {
      const d = disp.get(e);
      if (!d || !d.img) continue;
      if (!e.alive && !(d.dying > 0)) continue;
      let alpha = d.appear;
      if (d.dying > 0) alpha = d.dying / 0.5;
      if (!e.alive && d.dying <= 0) continue;
      g.globalAlpha = Util.clamp(alpha, 0, 1);
      const bob = e.def.boss ? Math.round(Math.sin(Engine.time * 2) * 1.5) : Math.round(Math.sin(Engine.time * 3 + e.uid) * 1);
      const flash = d.flash > 0 && Math.floor(d.flash * 20) % 2 === 0;
      const dx = d.x + (d.flash > 0 ? Math.round(Math.sin(d.flash * 60) * 2) : 0);
      if (d.dying > 0) {
        // 사라질 때 아래로 녹아내림
        const k = 1 - d.dying / 0.5;
        const h = Math.round(d.h * (1 - k));
        g.drawImage(d.img, 0, 0, d.w, h, dx, d.y + (d.h - h), d.w, h);
      } else g.drawImage(flash ? Pix.silhouette(d.img) : d.img, dx, d.y + bob);
      g.globalAlpha = 1;
      if (e.status.sleep) { g.fillStyle = '#ffffff'; g.font = '8px sans-serif'; g.fillText('z', d.x + d.w - 6, d.y + 6 + Math.sin(Engine.time * 3) * 2); }
    }
    Engine.blitLow(ctx);
    if (darken > 0) { ctx.fillStyle = `rgba(0,0,0,${darken})`; ctx.fillRect(0, 0, Engine.W, Engine.H); }
    // 적 상태 표시 (차지·상태이상)
    for (const e of core.enemies) {
      const d = disp.get(e);
      if (!d || !e.alive) continue;
      const cx = (d.x + d.w / 2) * 2, top = d.y * 2;
      const tags = [];
      if (e.charging) tags.push(['!!', '#ff5050']);
      for (const s of ['poison', 'sleep', 'paralyze', 'silence']) if (e.status[s]) tags.push([STATUS_NAMES[s], { poison: '#c070ff', sleep: '#70a8ff', paralyze: '#ffd050', silence: '#a0a0b0' }[s]]);
      if (e.buffs.atk && e.buffs.atk.mult > 1) tags.push(['공↑', '#ff8a5a']);
      if (e.buffs.def && e.buffs.def.mult > 1) tags.push(['방↑', '#ffd050']);
      if (e.buffs.spd && e.buffs.spd.mult < 1) tags.push(['속↓', '#70a8ff']);
      if (e.buffs.hit && e.buffs.hit.mult < 1) tags.push(['명↓', '#a0a0b0']);
      let tx = cx - (tags.length * 34) / 2;
      for (const [t, c] of tags) { drawTag(ctx, tx, top - 4, t, c); tx += 34; }
      // 보스/분석된 적은 HP 막대
      if (e.def.boss || Game.state.seen[e.defId]) UI.gauge(ctx, cx - 40, d.y * 2 + d.h * 2 + 4, 80, 5, e.hp / e.mhp, e.def.boss ? '#ff6060' : '#63e07a');
    }
    // 아군 패널
    core.party.forEach((a, i) => drawPanel(ctx, a, i));
    // 이펙트
    for (const fx of effects) drawEffect(ctx, fx);
    // 팝업 숫자
    for (const p of popups) {
      const k = p.t / p.dur;
      const y = p.y - 26 * Math.min(1, k * 2.5) + (k > 0.5 ? 0 : 0);
      ctx.globalAlpha = k > 0.75 ? (1 - k) * 4 : 1;
      Text.draw(ctx, p.text, p.x, y, { size: p.big ? 30 : 24, bold: true, align: 'center', color: p.color, outline: 4, outlineColor: '#1a1020', shadow: false });
      ctx.globalAlpha = 1;
    }
    // 메시지 창
    const my = Engine.H - 124;
    UI.drawWindow(ctx, 8, my, Engine.W - 16, 116);
    if (active) {
      Text.draw(ctx, `[y]${active.name}[/]${Util.josa(active.name, '은')} 어떻게 할까?`, 224, my + 18, { size: 18 });
      const sk = targeting && targeting.skill;
      if (sk && sk.desc) { const lines = Text.layout(ctx, sk.desc, Engine.W - 250, 15); Text.drawLines(ctx, lines.slice(0, 3), 224, my + 48, 21, 15); }
    } else {
      Text.drawLines(ctx, msgLines, 26, my + 16, 30, 18, Math.floor(msgShown));
      if (resultText && Math.floor(Engine.time * 2.5) % 2 === 0) Text.draw(ctx, '▼', Engine.W - 34, Engine.H - 36, { size: 16, color: Theme.gold });
    }
    if (introText) {
      const a = Math.min(1, introText.t * 3);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 196, Engine.W, 56);
      Text.draw(ctx, introText.text, Engine.W / 2, 208, { size: 28, bold: true, align: 'center', color: '#ff8a8a', outline: 3 });
      ctx.globalAlpha = 1;
    }
  }

  function drawTag(ctx, x, y, text, color) {
    ctx.fillStyle = 'rgba(10,10,20,0.75)';
    UI.roundRect(ctx, x, y - 16, 32, 17, 4); ctx.fill();
    Text.draw(ctx, text, x + 16, y - 15, { size: 12, align: 'center', color, bold: true, shadow: false });
  }

  function drawPanel(ctx, a, i) {
    let d = disp.get(a);
    const x = partyPanelX(i) + (d.shake > 0 ? Math.sin(d.shake * 70) * 4 : 0), y = 6, w = PANEL_W, h = 82;
    const isActive = active === a;
    const isTarget = targeting && targeting.side === 'party' && (targeting.all || targeting.list[targeting.index] === a);
    UI.drawWindow(ctx, x, y + (isActive ? -2 : 0), w, h, {
      border: isTarget ? '#7cf08a' : isActive ? Theme.gold : Theme.border,
      top: d.hp <= 0 ? 'rgba(70,20,30,0.95)' : d.flash > 0 ? 'rgba(140,40,40,0.95)' : undefined,
    });
    const dead = d.hp <= 0;
    const col = dead ? Theme.red : CHARACTERS[a.id].color;
    Text.draw(ctx, a.name, x + 10, y + 7, { size: 16, bold: true, color: col, maxW: 80 });
    Text.draw(ctx, 'Lv' + a.ref.level, x + w - 10, y + 9, { size: 13, color: Theme.dim, align: 'right' });
    const st = a.st;
    const low = d.hp > 0 && d.hp <= st.maxhp * 0.25;
    Text.draw(ctx, 'HP', x + 10, y + 31, { size: 12, color: Theme.dim });
    Text.draw(ctx, String(d.hp), x + w - 10, y + 28, { size: 16, bold: true, align: 'right', color: dead ? Theme.red : low ? '#ffb347' : Theme.text });
    UI.gauge(ctx, x + 34, y + 44, w - 44, 4, d.hp / st.maxhp, low ? '#ffb347' : Theme.hp);
    Text.draw(ctx, 'MP', x + 10, y + 53, { size: 12, color: Theme.dim });
    Text.draw(ctx, String(d.mp), x + w - 10, y + 50, { size: 16, bold: true, align: 'right' });
    UI.gauge(ctx, x + 34, y + 66, w - 44, 4, st.maxmp ? d.mp / st.maxmp : 0, Theme.mp);
    // 상태 태그
    const tags = [];
    if (dead) tags.push(['전투불능', Theme.red]);
    for (const s of ['poison', 'sleep', 'paralyze', 'silence']) if (a.status[s]) tags.push([STATUS_NAMES[s], { poison: '#c070ff', sleep: '#70a8ff', paralyze: '#ffd050', silence: '#a0a0b0' }[s]]);
    if (a.defending) tags.push(['방어', '#7cc4ff']);
    if (a.buffs.atk) tags.push(['공↑', '#ff8a5a']);
    if (a.buffs.def && a.buffs.def.mult > 1) tags.push(['방↑', '#ffd050']);
    if (a.buffs.def && a.buffs.def.mult < 1) tags.push(['방↓', '#a0a0b0']);
    let tx = x + 4;
    for (const [t, c] of tags.slice(0, 4)) { const tw = Math.max(32, Text.width(ctx, t, 12) + 10); ctx.fillStyle = 'rgba(10,10,20,0.85)'; UI.roundRect(ctx, tx, y + h - 2, tw, 17, 4); ctx.fill(); Text.draw(ctx, t, tx + tw / 2, y + h - 1, { size: 12, align: 'center', color: c, bold: true, shadow: false }); tx += tw + 3; }
  }

  function drawEffect(ctx, fx) {
    const k = fx.t / fx.dur;
    for (const p of fx.pos) {
      ctx.save();
      switch (fx.name) {
        case 'slash': case 'bigslash': case 'starslash': {
          if (fx.miss) break;
          const big = fx.name !== 'slash';
          ctx.strokeStyle = fx.name === 'starslash' ? '#fff6a0' : '#ffffff';
          ctx.lineWidth = big ? 6 : 4;
          ctx.globalAlpha = 1 - k;
          const r = big ? 50 : 36;
          ctx.beginPath();
          ctx.moveTo(p.x - r + k * 20, p.y - r);
          ctx.lineTo(p.x + r * (k * 2 - 1), p.y + r * (k * 2 - 1));
          ctx.stroke();
          if (big) { ctx.beginPath(); ctx.moveTo(p.x + r, p.y - r + 10); ctx.lineTo(p.x - r * (k * 2 - 1), p.y + r * (k * 2 - 1) + 10); ctx.stroke(); }
          if (fx.name === 'starslash') for (let i = 0; i < 6; i++) { const a = i * 1.05 + k * 4; ctx.fillStyle = '#ffe680'; ctx.fillRect(p.x + Math.cos(a) * k * 60, p.y + Math.sin(a) * k * 60, 4, 4); }
          break;
        }
        case 'fire':
          for (let i = 0; i < 16; i++) {
            const a = i * 0.39, rr = 10 + ((i * 13) % 30);
            const yy = p.y + 30 - k * 80 - (i % 4) * 8;
            ctx.globalAlpha = 1 - k;
            ctx.fillStyle = i % 3 === 0 ? '#ffe080' : i % 3 === 1 ? '#ff8030' : '#ff4020';
            ctx.beginPath(); ctx.arc(p.x + Math.cos(a + k * 3) * rr, yy, 8 - k * 5, 0, Math.PI * 2); ctx.fill();
          }
          break;
        case 'ice':
          for (let i = 0; i < 10; i++) {
            const xx = p.x - 50 + i * 11, yy = p.y - 70 + k * 90 + ((i * 17) % 30);
            ctx.globalAlpha = 1 - k * 0.8; ctx.fillStyle = i % 2 ? '#bfe6ff' : '#5ab4ff';
            ctx.beginPath(); ctx.moveTo(xx, yy - 14); ctx.lineTo(xx + 5, yy); ctx.lineTo(xx, yy + 6); ctx.lineTo(xx - 5, yy); ctx.fill();
          }
          break;
        case 'thunder': {
          ctx.strokeStyle = '#fff6b0'; ctx.lineWidth = 5; ctx.globalAlpha = k < 0.6 ? 1 : (1 - k) * 2.5;
          ctx.beginPath(); let xx = p.x, yy = 0; ctx.moveTo(xx, yy);
          while (yy < p.y) { xx += ((yy * 7) % 23) - 11; yy += 22; ctx.lineTo(xx, Math.min(yy, p.y)); }
          ctx.stroke(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
          break;
        }
        case 'light': {
          ctx.globalAlpha = Math.sin(k * Math.PI);
          const gr = ctx.createLinearGradient(p.x - 30, 0, p.x + 30, 0);
          gr.addColorStop(0, 'rgba(255,240,160,0)'); gr.addColorStop(0.5, 'rgba(255,250,210,0.95)'); gr.addColorStop(1, 'rgba(255,240,160,0)');
          ctx.fillStyle = gr; ctx.fillRect(p.x - 30, 0, 60, p.y + 40);
          for (let i = 0; i < 8; i++) { ctx.fillStyle = '#ffffff'; ctx.fillRect(p.x - 30 + ((i * 23 + k * 100) % 60), p.y - ((i * 37 + k * 200) % 120), 3, 3); }
          break;
        }
        case 'dark':
          for (let i = 0; i < 14; i++) {
            const a = i * 0.45 + k * 6, rr = (1 - k) * 60 + 6;
            ctx.globalAlpha = 0.8; ctx.fillStyle = i % 2 ? '#8a40c0' : '#4a1a70';
            ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr * 0.7, 7, 0, Math.PI * 2); ctx.fill();
          }
          break;
        case 'heal': case 'up':
          for (let i = 0; i < 10; i++) {
            ctx.globalAlpha = 1 - k; ctx.fillStyle = fx.name === 'heal' ? (i % 2 ? '#a0ffb0' : '#ffffff') : '#ffd75e';
            const xx = p.x - 40 + i * 9, yy = p.y + 30 - k * 60 - (i % 3) * 10;
            if (fx.name === 'up') { ctx.beginPath(); ctx.moveTo(xx, yy - 6); ctx.lineTo(xx + 5, yy); ctx.lineTo(xx - 5, yy); ctx.fill(); }
            else ctx.fillRect(xx, yy, 4, 4);
          }
          break;
        case 'down':
          for (let i = 0; i < 6; i++) { ctx.globalAlpha = 1 - k; ctx.fillStyle = '#7cc4ff'; const xx = p.x - 30 + i * 12, yy = p.y - 20 + k * 40; ctx.beginPath(); ctx.moveTo(xx, yy + 6); ctx.lineTo(xx + 5, yy); ctx.lineTo(xx - 5, yy); ctx.fill(); }
          break;
        case 'buff': case 'debuff': case 'guard':
          ctx.globalAlpha = 1 - k; ctx.strokeStyle = fx.name === 'debuff' ? '#7cc4ff' : '#ffd75e'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(p.x, p.y, 20 + k * 40, 0, Math.PI * 2); ctx.stroke();
          break;
        case 'mist':
          for (let i = 0; i < 8; i++) { ctx.globalAlpha = Math.sin(k * Math.PI) * 0.6; ctx.fillStyle = i % 2 ? '#e0c8ff' : '#c8c8d8'; ctx.beginPath(); ctx.arc(p.x - 40 + i * 12 + Math.sin(k * 6 + i) * 10, p.y + Math.cos(i) * 20, 20, 0, Math.PI * 2); ctx.fill(); }
          break;
        case 'wave':
          for (let i = 0; i < 3; i++) { const r = ((k + i * 0.25) % 1) * 400; ctx.globalAlpha = 1 - ((k + i * 0.25) % 1); ctx.strokeStyle = '#e0c0ff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(Engine.W / 2, 200, r, 0, Math.PI * 2); ctx.stroke(); }
          break;
        case 'impact': case 'quake':
          ctx.globalAlpha = 1 - k; ctx.fillStyle = '#ffffff';
          for (let i = 0; i < 8; i++) { const a = i * 0.785; ctx.fillRect(p.x + Math.cos(a) * k * 50, p.y + Math.sin(a) * k * 50, 6, 6); }
          break;
        case 'scan':
          ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#7cc4ff'; ctx.lineWidth = 2;
          ctx.strokeRect(p.x - 50, p.y - 50, 100, 100);
          ctx.fillStyle = 'rgba(124,196,255,0.5)'; ctx.fillRect(p.x - 50, p.y - 50 + k * 100, 100, 3);
          break;
        case 'steal':
          ctx.globalAlpha = 1 - k; ctx.fillStyle = '#ffffff'; ctx.fillRect(p.x - 2 + k * 40, p.y - 2 - k * 20, 5, 5);
          break;
      }
      ctx.restore();
    }
  }

  // ── 명령 입력 ──
  function battleItems(reserved) {
    return Game.itemList((it) => it.kind === 'consumable' && it.battle).map((id) => ({ id, n: Game.count(id) - (reserved[id] || 0) }));
  }

  async function selectTarget(user, kind, skill) {
    let side, list, all = false;
    if (kind === 'enemy') { side = 'enemy'; list = core.aliveEnemyList; }
    else if (kind === 'enemies') { side = 'enemy'; list = core.aliveEnemyList; all = true; }
    else if (kind === 'allies') { side = 'party'; list = core.alivePartyList; all = true; }
    else if (kind === 'ally') { side = 'party'; list = core.alivePartyList; }
    else if (kind === 'allyOther') { side = 'party'; list = core.alivePartyList.filter((a) => a !== user); }
    else if (kind === 'deadAlly') { side = 'party'; list = core.party.filter((a) => !a.alive); }
    else if (kind === 'self' || kind === 'none') return user;
    if (!list.length) { Sound.sfx('buzzer'); return null; }
    if (side === 'enemy') list = list.slice().sort((a, b) => disp.get(a).x - disp.get(b).x);
    let index = 0;
    if (side === 'party' && list.includes(user) && kind === 'ally' && skill && skill.type !== 'heal') index = list.indexOf(user);
    if (side === 'party' && skill && skill.type === 'heal') { let worst = 0; list.forEach((a, i) => { if (a.hp / a.mhp < list[worst].hp / list[worst].mhp) worst = i; }); index = worst; }
    targeting = { side, list, index, all, skill };
    return new Promise((resolve) => {
      const tl = {
        modal: true,
        onAction(a) {
          if (a === 'left' || a === 'up') { if (!all) { targeting.index = (targeting.index - 1 + list.length) % list.length; Sound.sfx('cursor'); } }
          else if (a === 'right' || a === 'down') { if (!all) { targeting.index = (targeting.index + 1) % list.length; Sound.sfx('cursor'); } }
          else if (a === 'confirm') { Sound.sfx('confirm'); done(all ? 'all' : list[targeting.index]); }
          else if (a === 'cancel') { Sound.sfx('cancel'); done(null); }
        },
        onPointer(ev) {
          if (ev.type !== 'down' && ev.type !== 'move') return true;
          let hit = -1;
          list.forEach((a, i) => {
            if (a.isParty) { const x = partyPanelX(core.party.indexOf(a)); if (ev.x >= x && ev.x <= x + PANEL_W && ev.y < 92) hit = i; }
            else { const d = disp.get(a); if (ev.x >= d.x * 2 && ev.x <= (d.x + d.w) * 2 && ev.y >= d.y * 2 - 20 && ev.y <= (d.y + d.h) * 2) hit = i; }
          });
          if (hit >= 0 && !all) targeting.index = hit;
          if (ev.type === 'down') { if (hit >= 0) { Sound.sfx('confirm'); done(all ? 'all' : list[targeting.index]); } else if (ev.y < 340) { Sound.sfx('cancel'); done(null); } }
          return true;
        },
        draw(ctx) {
          const targets = all ? list : [list[targeting.index]];
          for (const t of targets) {
            if (t.isParty) continue;
            const d = disp.get(t);
            const cx = (d.x + d.w / 2) * 2, top = d.y * 2 - 14 + Math.sin(Engine.time * 8) * 4;
            ctx.fillStyle = Theme.gold;
            ctx.beginPath(); ctx.moveTo(cx - 10, top - 12); ctx.lineTo(cx + 10, top - 12); ctx.lineTo(cx, top); ctx.closePath(); ctx.fill();
          }
          const label = all ? (side === 'enemy' ? '적 전체' : '아군 전체') : list[targeting.index].name;
          let extra = '';
          const t0 = list[targeting.index];
          if (!all && !t0.isParty && skill && skill.element && Game.state.seen[t0.defId]) {
            const m = t0.elemMult(skill.element);
            extra = m > 1 ? ' [y]약점![/]' : m === 0 ? ' [r]무효[/]' : m < 1 ? ' [d]내성[/]' : '';
          }
          const w = Text.width(ctx, label + Text.strip(extra), 18, true) + 40;
          UI.drawWindow(ctx, Engine.W / 2 - w / 2, 100, w, 38);
          Text.draw(ctx, label + extra, Engine.W / 2, 109, { size: 18, bold: true, align: 'center' });
        },
      };
      function done(v) { Engine.remove(tl); targeting = null; resolve(v); }
      Engine.push(tl);
    });
  }

  async function chooseCommand(a, reserved) {
    const spells = a.ref.skills.filter((s) => SKILLS[s].kind === 'spell');
    const skills = a.ref.skills.filter((s) => SKILLS[s].kind === 'skill');
    const items = [
      { label: '공격', value: 'attack' },
      { label: '주문', value: 'spell', disabled: !spells.length || !!a.status.silence },
      { label: '특기', value: 'skill', disabled: !skills.length },
      { label: '도구', value: 'item', disabled: !battleItems(reserved).some((x) => x.n > 0) },
      { label: '방어', value: 'defend' },
      { label: '도망', value: 'escape', disabled: !core.canEscape },
    ];
    const menu = new UI.ListWindow({ x: 8, y: Engine.H - 124, w: 208, h: 116, cols: 2, rowH: 32, items, initial: a.lastCmd || 0, cancel: true, size: 18, padY: 10 });
    Engine.push(menu);
    try {
      for (;;) {
        const r = await menu.choose();
        if (r === null) return 'back';
        a.lastCmd = r.index;
        if (r.value === 'attack') {
          const t = await selectTarget(a, 'enemy', SKILLS.attack);
          if (t) return { kind: 'attack', target: t };
          continue;
        }
        if (r.value === 'defend') return { kind: 'defend' };
        if (r.value === 'escape') return { escape: true };
        if (r.value === 'spell' || r.value === 'skill') {
          const ids = r.value === 'spell' ? spells : skills;
          const deadCount = core.party.filter((x) => !x.alive).length;
          const sub = new UI.ListWindow({
            x: 224, y: Engine.H - 132, anchor: 'bottom', w: 400, maxRows: 6, rowH: 30, cancel: true,
            title: r.value === 'spell' ? `${a.name}의 주문 (MP ${a.mp})` : `${a.name}의 특기 (MP ${a.mp})`,
            items: ids.map((id) => {
              const sk = SKILLS[id];
              const bad = (sk.mp || 0) > a.mp || (sk.target === 'deadAlly' && !deadCount);
              return { label: sk.name, right: sk.mp ? `MP ${sk.mp}` : '-', value: id, disabled: bad, desc: sk.desc };
            }),
            initial: a['last_' + r.value] || 0,
            onHover: (it) => { targeting = it ? { skill: SKILLS[it.value], side: null, list: [] } : null; },
          });
          Engine.push(sub);
          let chosen = null;
          for (;;) {
            const s = await sub.choose();
            if (s === null) break;
            a['last_' + r.value] = s.index;
            const sk = SKILLS[s.value];
            const t = await selectTarget(a, sk.target, sk);
            if (t) { chosen = { kind: 'skill', skill: s.value, target: t === 'all' ? null : t }; break; }
          }
          sub.close();
          targeting = null;
          if (chosen) return chosen;
          continue;
        }
        if (r.value === 'item') {
          const list = battleItems(reserved).filter((x) => x.n > 0);
          const sub = new UI.ListWindow({
            x: 224, y: Engine.H - 132, anchor: 'bottom', w: 400, maxRows: 6, rowH: 30, cancel: true, title: '도구',
            items: list.map((x) => ({ label: ITEMS[x.id].name, right: '×' + x.n, value: x.id, desc: ITEMS[x.id].desc, disabled: ITEMS[x.id].use.target === 'deadAlly' && !core.party.some((p) => !p.alive) })),
            onHover: (it) => { targeting = it ? { skill: { desc: ITEMS[it.value].desc }, side: null, list: [] } : null; },
          });
          Engine.push(sub);
          let chosen = null;
          for (;;) {
            const s = await sub.choose();
            if (s === null) break;
            const use = ITEMS[s.value].use;
            const t = await selectTarget(a, use.target, Object.assign({ type: use.type }, use));
            if (t) { chosen = { kind: 'item', item: s.value, target: t === 'all' ? null : t }; break; }
          }
          sub.close();
          targeting = null;
          if (chosen) return chosen;
          continue;
        }
      }
    } finally {
      menu.close();
    }
  }

  async function commandPhase() {
    const cmds = new Map();
    const reserved = {};
    const list = core.party;
    let i = 0;
    const can = (a) => a.alive && !a.disabled;
    while (i < list.length) {
      const a = list[i];
      if (!can(a)) { i++; continue; }
      active = a;
      const r = await chooseCommand(a, reserved);
      if (r === 'back') {
        let j = i - 1;
        while (j >= 0 && !can(list[j])) j--;
        if (j >= 0) {
          const prev = cmds.get(list[j]);
          if (prev && prev.kind === 'item') reserved[prev.item]--;
          cmds.delete(list[j]);
          i = j;
        }
        continue;
      }
      if (r.escape) { active = null; return { escape: true }; }
      cmds.set(a, r);
      if (r.kind === 'item') reserved[r.item] = (reserved[r.item] || 0) + 1;
      i++;
    }
    active = null;
    return { cmds };
  }

  // ── 전투 진행 ──
  async function loop() {
    let first = true;
    let preempt = false, ambush = false;
    if (!core.boss && !opts.ambushSafe) {
      const r = Util.rand();
      if (r < 0.07) preempt = true;
      else if (r < 0.12) ambush = true;
    }
    const names = core.enemies.map((e) => e.name);
    if (opts.intro) {
      introText = { text: opts.intro, t: 0 };
      Engine.shake(6, 0.8); Sound.sfx('roar');
      await Engine.wait(1300);
      introText = null;
    }
    const groupName = (() => {
      const u = [...new Set(core.enemies.map((e) => e.def.name))];
      if (u.length === 1 && core.enemies.length > 1) return `${u[0]} 무리가`;
      if (u.length === 1) return `${u[0]}${Util.josa(u[0], '이')}`;
      return `${u[0]} 일행이`;
    })();
    await say(core.boss ? `${groupName} 앞을 가로막았다!` : `${groupName} 나타났다!`);
    if (preempt) await say('[y]마물들은 아직 이쪽을 눈치채지 못했다! (선제공격)[/]');
    if (ambush) await say('[r]기습이다! 마물들이 먼저 덤벼든다![/]');
    for (;;) {
      let cmds = null;
      let enemiesAct = true;
      if (ambush && first) { cmds = new Map(); }
      else {
        clearMsg();
        const r = await commandPhase();
        if (r.escape) {
          clearMsg();
          await say(`${Game.heroName()} 일행은 도망쳤다!`, { wait: 200 });
          const er = core.tryEscape();
          if (er.impossible) { await say('그러나 도망칠 수 없다!'); continue; }
          if (er.ok) { Sound.sfx('escape'); await hold(500); return 'escape'; }
          await say('그러나 마물들이 길을 막아섰다!');
          cmds = new Map();
        } else cmds = r.cmds;
        if (preempt && first) enemiesAct = false;
      }
      first = false;
      clearMsg();
      const order = core.buildOrder(cmds, { enemiesAct });
      for (const entry of order) {
        if (core.result) break;
        if (!entry.actor.alive) continue;
        const ev = core.execute(entry);
        if (ev.length) { clearMsg(); await present(ev); }
        if (core.checkEnd()) break;
      }
      if (core.checkEnd()) break;
      const er = core.endRound();
      if (er.length) await present(er);
      if (core.checkEnd()) break;
    }
    return core.result;
  }

  async function victory() {
    clearMsg();
    Sound.stop();
    Sound.jingle('victory');
    const u = [...new Set(core.killed.map((e) => e.def.name))];
    await say(u.length === 1 && core.killed.length === 1 ? `${u[0]}${Util.josa(u[0], '을')} 물리쳤다!` : '마물들을 물리쳤다!', { wait: 300 });
    const r = core.rewards();
    if (r.exp) await say(`경험치 [y]${r.exp}[/]을 얻었다!`, { wait: 300 });
    if (r.gold) await say(`[y]${r.gold}G[/]를 손에 넣었다!`, { wait: 300 });
    for (const it of r.drops) await say(`마물이 [y]${ITEMS[it].name}[/]${Util.josa(ITEMS[it].name, '을')} 떨어뜨렸다!`, { wait: 400 });
    for (const up of r.ups) {
      Sound.jingle('levelup');
      const nm = Game.name(up.id);
      await say(`[y]${nm}의 레벨이 ${up.level}${Util.josa(String(up.level), '으로')} 올랐다![/]`, { wait: 400 });
      const g = up.gains;
      const parts = [['최대HP', g.maxhp], ['최대MP', g.maxmp], ['공격', g.atk], ['방어', g.def], ['마력', g.mag], ['민첩', g.spd]].filter(([, v]) => v > 0).map(([k, v]) => `${k}+${v}`);
      await say(`[d]${parts.join('  ')}[/]`, { wait: 500 });
      for (const sk of up.learned) {
        const s = SKILLS[sk];
        await say(`[g]${nm}${Util.josa(nm, '은')} 새로운 ${s.kind === 'spell' ? '주문' : '특기'} 「${s.name}」${Util.josa(s.name, '을')} 익혔다![/]`, { wait: 600 });
      }
      for (const [id] of disp) if (id.isParty) { const d = disp.get(id); d.hp = id.hp; d.mp = id.mp; }
    }
    for (const m of r.questMsgs) await say(m, { wait: 600 });
    await waitConfirm();
  }

  async function run(o) {
    opts = Object.assign({ bg: 'plains' }, o);
    core = new BattleCore(opts);
    disp = new Map();
    popups = []; effects = []; clearMsg(); active = null; targeting = null; introText = null; darken = 0;
    for (const a of core.party) disp.set(a, { hp: a.hp, mp: a.mp, flash: 0, shake: 0 });
    layoutEnemies();
    // 진입 연출
    Sound.sfx('encounter');
    Sound.bgm(opts.bgm || 'battle');
    for (let i = 0; i < 3; i++) { Engine.flash('#ffffff', 0.12); await Engine.wait(110); }
    await Engine.fadeOut(180);
    Engine.push(layer);
    await Engine.fadeIn(220);
    let result;
    try {
      result = await loop();
      if (result === 'win') await victory();
      else if (result === 'lose') {
        clearMsg();
        await say(`[r]${Game.heroName()} 일행은 전멸했다…[/]`, { wait: 900 });
      }
    } catch (err) {
      console.error('[Battle] error', err);
      result = 'escape';
    }
    await Engine.fadeOut(260);
    Engine.remove(layer);
    // 전투 후 상태 정리 (일시 상태 제거)
    for (const id of Game.state.party) { const m = Game.state.members[id]; for (const k of ['sleep', 'paralyze', 'silence']) delete m.status[k]; }
    if (result !== 'lose' && Field.map) Sound.bgm(typeof Field.map.bgm === 'function' ? Field.map.bgm() : Field.map.bgm);
    if (result !== 'lose') await Engine.fadeIn(260);
    core = null;
    return result;
  }

  return { run, get core() { return core; }, get active() { return active; }, layer };
})();


// ── src/scenes/menu.js ──
'use strict';
// ─────────────────────────────────────────────────────────────
// Menu: 필드 메뉴 (도구·주문·장비·상태·편성·퀘스트·지도·대화·저장·불러오기·설정)
// ─────────────────────────────────────────────────────────────
const Menu = (() => {
  const STAT_LABEL = [['maxhp', '최대 HP'], ['maxmp', '최대 MP'], ['atk', '공격력'], ['def', '방어력'], ['mag', '마력'], ['spd', '민첩']];

  function charIcon(ctx, id, x, y, scale = 2, dir = 'down') {
    const fr = Chars.build(LOOKS[CHARACTERS[id].look]);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(fr[dir][0], x, y, 16 * scale, 20 * scale);
  }

  function memberRow(ctx, id, x, y, w, opts = {}) {
    const m = Game.state.members[id];
    const s = Game.stats(id);
    charIcon(ctx, id, x, y - 4, 2);
    const dead = m.hp <= 0;
    Text.draw(ctx, Game.name(id), x + 42, y, { size: 18, bold: true, color: dead ? Theme.red : CHARACTERS[id].color });
    Text.draw(ctx, `${CHARACTERS[id].job}  Lv ${m.level}`, x + 42, y + 22, { size: 14, color: Theme.dim });
    const bx = x + Math.min(200, w * 0.45);
    const bw = w - (bx - x) - 4;
    Text.draw(ctx, 'HP', bx, y + 1, { size: 13, color: Theme.dim });
    Text.draw(ctx, `${m.hp}/${s.maxhp}`, bx + bw, y - 1, { size: 15, align: 'right', color: dead ? Theme.red : Theme.text });
    UI.gauge(ctx, bx + 26, y + 17, bw - 26, 4, m.hp / s.maxhp, Theme.hp);
    Text.draw(ctx, 'MP', bx, y + 25, { size: 13, color: Theme.dim });
    Text.draw(ctx, `${m.mp}/${s.maxmp}`, bx + bw, y + 23, { size: 15, align: 'right' });
    UI.gauge(ctx, bx + 26, y + 41, bw - 26, 4, s.maxmp ? m.mp / s.maxmp : 0, Theme.mp);
    const tags = [];
    if (dead) tags.push(['전투불능', Theme.red]);
    if (m.status.poison) tags.push(['독', '#c070ff']);
    if (opts.reserve) tags.push(['대기', Theme.dim]);
    let tx = x + 46 + Text.width(ctx, Game.name(id), 18, true);
    for (const [t, c] of tags) { Text.draw(ctx, `[${t}]`, tx, y + 2, { size: 13, color: c }); tx += Text.width(ctx, `[${t}]`, 13) + 4; }
  }

  // 메뉴 배경 레이어 (파티 요약)
  const base = {
    modal: true,
    draw(ctx) {
      ctx.fillStyle = 'rgba(0,0,10,0.35)'; ctx.fillRect(0, 0, Engine.W, Engine.H);
      UI.drawWindow(ctx, 176, 12, 452, 388);
      const st = Game.state;
      const ids = st.party.concat(st.reserve);
      const rowH = ids.length > 4 ? 72 : 90;
      ids.forEach((id, i) => memberRow(ctx, id, 196, 30 + i * rowH, 412, { reserve: i >= st.party.length }));
      UI.drawWindow(ctx, 176, 406, 452, 62);
      Text.draw(ctx, `[y]${Game.gold}G[/]`, 196, 416, { size: 20, bold: true });
      Text.draw(ctx, `⏱ ${Util.fmtTime(st.playTime)}`, 196, 442, { size: 14, color: Theme.dim });
      Text.draw(ctx, `📍 ${Field.map ? Field.map.name : ''}`, 608, 418, { size: 15, align: 'right' });
      const g = Quests.currentGoal();
      if (g) Text.draw(ctx, '★ ' + g.text, 608, 442, { size: 13, align: 'right', color: '#ffe9a8', maxW: 300 });
    },
  };

  async function open() {
    Engine.push(base);
    const items = [
      { label: '도구', value: 'items' }, { label: '주문·특기', value: 'magic' }, { label: '장비', value: 'equip' }, { label: '상태', value: 'status' },
      { label: '편성', value: 'formation' }, { label: '퀘스트', value: 'quests' }, { label: '지도', value: 'map' }, { label: '대화', value: 'talk' },
      { label: '저장', value: 'save' }, { label: '불러오기', value: 'load' }, { label: '설정', value: 'settings' }, { label: '타이틀로', value: 'title' },
    ];
    const lw = new UI.ListWindow({ x: 12, y: 12, w: 156, items, rowH: 30, maxRows: 12, cancel: true, menuCancels: true });
    Engine.push(lw);
    try {
      for (;;) {
        items[1].disabled = !Game.state.party.concat(Game.state.reserve).some((id) => Game.state.members[id].skills.length);
        const r = await lw.choose();
        if (!r) break;
        const v = r.value;
        if (v === 'items') await itemsScreen();
        else if (v === 'magic') await magicScreen();
        else if (v === 'equip') await equipScreen();
        else if (v === 'status') await statusScreen();
        else if (v === 'formation') await formationScreen();
        else if (v === 'quests') await questScreen();
        else if (v === 'map') { lw.close(); Engine.remove(base); await MapView.open(); return; }
        else if (v === 'talk') { lw.close(); Engine.remove(base); await partyTalk(); return; }
        else if (v === 'save') await saveScreen();
        else if (v === 'load') { if (await loadScreen()) { lw.close(); Engine.remove(base); return; } }
        else if (v === 'settings') await settingsScreen();
        else if (v === 'title') {
          if (await confirm('타이틀 화면으로 돌아갈까요?\n[d](저장하지 않은 진행은 사라집니다)[/]')) { lw.close(); Engine.remove(base); await Main.toTitle(); return; }
        }
      }
    } finally {
      lw.close();
      Engine.remove(base);
    }
  }

  async function confirm(text) {
    const msg = new UI.MessageLayer([text], { keepOpen: true });
    await msg.open();
    const r = await UI.list({ x: Engine.W - 180, y: Engine.H - 150, anchor: 'bottom', w: 160, items: [{ label: '예', value: true }, { label: '아니요', value: false }], initial: 1 });
    msg.close();
    return !!(r && r.value);
  }
  async function notice(text) { await UI.message(text); }

  // 동료 선택
  async function pickMember(opts = {}) {
    const ids = (opts.ids || Game.state.party.concat(Game.state.reserve));
    const items = ids.map((id) => {
      const m = Game.state.members[id], s = Game.stats(id);
      return { label: Game.name(id), right: `HP ${m.hp}/${s.maxhp}  MP ${m.mp}/${s.maxmp}`, value: id, disabled: opts.filter ? !opts.filter(id) : false, color: m.hp <= 0 ? Theme.red : undefined };
    });
    if (opts.all) items.unshift({ label: '전원', right: '', value: '__all' });
    const r = await UI.list({ x: opts.x || 200, y: opts.y || 120, w: 400, items, title: opts.title || '누구에게?', rowH: 32, cancel: true });
    return r ? r.value : null;
  }

  // ── 필드에서 효과 적용 ──
  function applyField(effect, targetId, casterId) {
    const m = Game.state.members[targetId];
    const s = Game.stats(targetId);
    const nm = Game.name(targetId);
    switch (effect.type) {
      case 'heal': {
        if (m.hp <= 0) return { ok: false, text: `${nm}${Util.josa(nm, '은')} 쓰러져 있어서 효과가 없다.` };
        if (m.hp >= s.maxhp) return { ok: false, text: `${nm}의 HP는 이미 가득하다.` };
        let amt = effect.amount;
        if (!amt) { const cs = Game.stats(casterId); amt = Math.round((effect.power + cs.mag * (effect.scale || 0)) * (1 + (cs.healBonus || 0))); }
        const before = m.hp; m.hp = Math.min(s.maxhp, m.hp + amt);
        return { ok: true, text: `${nm}의 HP가 ${m.hp - before} 회복되었다!` };
      }
      case 'mp': {
        if (m.mp >= s.maxmp) return { ok: false, text: `${nm}의 MP는 이미 가득하다.` };
        const before = m.mp; m.mp = Math.min(s.maxmp, m.mp + effect.amount);
        return { ok: true, text: `${nm}의 MP가 ${m.mp - before} 회복되었다!` };
      }
      case 'full': {
        if (m.hp <= 0) return { ok: false, text: `${nm}${Util.josa(nm, '은')} 쓰러져 있어서 효과가 없다.` };
        m.hp = s.maxhp; m.mp = s.maxmp;
        return { ok: true, text: `${nm}의 HP와 MP가 모두 회복되었다!` };
      }
      case 'cure': {
        const cured = (effect.cures || []).filter((k) => m.status[k]);
        if (!cured.length || m.hp <= 0) return { ok: false, text: `${nm}에게는 효과가 없다.` };
        for (const k of cured) delete m.status[k];
        return { ok: true, text: `${nm}의 ${cured.map((k) => STATUS_NAMES[k]).join('·')} 상태가 나았다!` };
      }
      case 'revive': {
        if (m.hp > 0) return { ok: false, text: `${nm}${Util.josa(nm, '은')} 쓰러져 있지 않다.` };
        m.hp = Math.max(1, Math.round(s.maxhp * effect.pct)); m.status = {};
        return { ok: true, text: `${nm}${Util.josa(nm, '이')} 되살아났다!` };
      }
    }
    return { ok: false, text: '아무 일도 일어나지 않았다.' };
  }

  // ── 도구 ──
  const TABS = [['소모품', (it) => it.kind === 'consumable'], ['장비품', (it) => EQUIP_SLOTS.includes(it.kind)], ['귀중품', (it) => it.kind === 'key']];
  async function itemsScreen() {
    let tab = 0;
    const header = {
      modal: false,
      draw(ctx) {
        UI.drawWindow(ctx, 12, 12, 616, 44);
        TABS.forEach(([n], i) => {
          const x = 30 + i * 130;
          if (i === tab) { ctx.fillStyle = Theme.select; ctx.fillRect(x - 10, 18, 120, 32); }
          Text.draw(ctx, n, x + 50, 24, { size: 18, bold: i === tab, align: 'center', color: i === tab ? Theme.gold : Theme.dim });
        });
        Text.draw(ctx, '◀ ▶ 탭 전환', 610, 26, { size: 13, align: 'right', color: Theme.dim });
      },
      onPointer(ev) {
        if (ev.type === 'down' && ev.y >= 12 && ev.y <= 56) {
          const i = Math.floor((ev.x - 20) / 130);
          if (i >= 0 && i < TABS.length && i !== tab) { tab = i; Sound.sfx('cursor'); refresh(); }
          return true;
        }
        return false;
      },
    };
    const build = () => Game.itemList(TABS[tab][1]).map((id) => {
      const it = ITEMS[id];
      return { label: it.name, right: '×' + Game.count(id), value: id, desc: `[d]${KIND_NAMES[it.kind]}[/] ${it.desc}${it.stats ? '  ' + statText(it) : ''}` };
    });
    const lw = new UI.ListWindow({
      x: 12, y: 62, w: 616, h: 330, items: build(), rowH: 30, maxRows: 10, cancel: true, cols: 2, empty: '(비어 있음)',
      help: { x: 12, y: 398, w: 616, h: 70 },
      onLeftRight: (it, dx) => { if (lw.cursor % 2 === (dx > 0 ? 1 : 0) || lw.items.length <= 1) { tab = (tab + dx + TABS.length) % TABS.length; refresh(); return true; } return false; },
    });
    function refresh() { lw.setItems(build(), false); }
    Engine.push(header);
    Engine.push(lw);
    try {
      for (;;) {
        const r = await lw.choose();
        if (!r) break;
        const id = r.value;
        const it = ITEMS[id];
        if (it.kind === 'key') { await notice(`[y]${it.name}[/]\n${it.desc}`); continue; }
        const acts = [];
        if (it.kind === 'consumable') acts.push({ label: '사용', value: 'use', disabled: !it.field });
        if (EQUIP_SLOTS.includes(it.kind)) acts.push({ label: '장비', value: 'equip' });
        acts.push({ label: '버린다', value: 'drop' });
        const a = await UI.list({ x: 420, y: 140, w: 150, items: acts, cancel: true });
        if (!a) continue;
        if (a.value === 'use') await useItem(id);
        else if (a.value === 'equip') {
          const who = await pickMember({ title: `${it.name} — 누가 장비할까?`, filter: (mid) => Game.canEquip(mid, id) });
          if (who) { Game.equip(who, it.kind, id); Sound.sfx('confirm'); await notice(`${Game.name(who)}${Util.josa(Game.name(who), '은')} ${it.name}${Util.josa(it.name, '을')} 장비했다.`); }
        } else if (a.value === 'drop') {
          if (await confirm(`${it.name}${Util.josa(it.name, '을')} 하나 버릴까요?`)) { Game.removeItem(id); Sound.sfx('cancel'); }
        }
        refresh();
      }
    } finally {
      lw.close();
      Engine.remove(header);
    }
  }
  function statText(it) {
    const s = it.stats || {};
    const n = { atk: '공', def: '방', mag: '마', spd: '민', hp: 'HP', mp: 'MP' };
    const parts = Object.keys(s).filter((k) => s[k]).map((k) => `${n[k]}+${s[k]}`);
    const who = (it.who || ALL).map((w) => (w === 'hero' ? Game.heroName() : CHARACTERS[w].name)).join('·');
    return `[b]${parts.join(' ')}[/] [d](${who})[/]`;
  }

  async function useItem(id) {
    const it = ITEMS[id];
    const u = it.use;
    if (u.type === 'return') {
      const k = Field.map.kind;
      if (k !== 'field' && k !== 'dungeon') { await notice('여기서는 쓸 수 없다. (필드나 던전에서 사용)'); return; }
      Game.removeItem(id);
      await notice(`${Game.heroName()}${Util.josa(Game.heroName(), '은')} 귀환의 날개를 하늘 높이 던졌다!`);
      for (const l of Engine.layers.slice()) if (l !== Field.layer) { if (l.close) l.close(); else Engine.remove(l); }
      await Field.warp('rivel', 19, 27, 'up', { sfx: 'escape', slow: true });
      throw new AbortSignalError('warped');
    }
    if (u.type === 'ward') {
      Game.removeItem(id);
      Game.state.ward = u.steps;
      Sound.sfx('mist');
      await notice('정령의 향을 피웠다. 마물들이 한동안 다가오지 않을 것이다.');
      return;
    }
    const who = await pickMember({ title: `${it.name} — 누구에게?` });
    if (!who) return;
    const r = applyField(u, who);
    if (r.ok) { Game.removeItem(id); Sound.sfx('heal'); } else Sound.sfx('buzzer');
    await notice(r.text);
  }

  // ── 주문·특기 ──
  async function magicScreen() {
    const casterId = await pickMember({ title: '누구의 주문·특기?', filter: (id) => Game.state.members[id].skills.length > 0 });
    if (!casterId) return;
    for (;;) {
      const m = Game.state.members[casterId];
      const items = m.skills.map((sid) => {
        const sk = SKILLS[sid];
        const usable = sk.field && m.hp > 0 && m.mp >= (sk.mp || 0);
        return { label: sk.name, right: (sk.kind === 'spell' ? '주문 ' : '특기 ') + (sk.mp ? `MP ${sk.mp}` : '-'), value: sid, disabled: !usable, desc: sk.desc + (sk.field ? '' : ' [d](전투 전용)[/]') };
      });
      const r = await UI.list({ x: 12, y: 60, w: 616, items, title: `${Game.name(casterId)} — MP ${m.mp}/${Game.stats(casterId).maxmp}`, maxRows: 9, rowH: 30, help: { x: 12, y: 398, w: 616, h: 70 }, onDisabled: () => {} });
      if (!r) return;
      const sk = SKILLS[r.value];
      if (sk.target === 'allies') {
        m.mp -= sk.mp;
        const texts = [];
        for (const id of Game.state.party) { const res = applyField(sk, id, casterId); if (res.ok) texts.push(res.text); }
        Sound.sfx('heal');
        await notice(texts.length ? texts.join('\n') : '아무 효과도 없었다.');
        continue;
      }
      const who = await pickMember({ title: `${sk.name} — 누구에게?` });
      if (!who) continue;
      const res = applyField(sk, who, casterId);
      if (res.ok) { m.mp -= sk.mp; Sound.sfx('heal'); } else Sound.sfx('buzzer');
      await notice(res.text);
    }
  }

      const L = {
        modal: true,
        onAction(a) {
          if (a === 'left' || a === 'up') { idx = (idx - 1 + ids.length) % ids.length; Sound.sfx('cursor'); }
          else if (a === 'right' || a === 'down') { idx = (idx + 1) % ids.length; Sound.sfx('cursor'); }
          else if (a === 'cancel' || a === 'confirm' || a === 'menu') { Sound.sfx('cancel'); Engine.remove(L); resolve(); }
        },
        onPointer(ev) {
          if (ev.type !== 'down') return true;
          if (ev.y > 430 && ev.x < 120) { idx = (idx - 1 + ids.length) % ids.length; Sound.sfx('cursor'); }
          else if (ev.y > 430 && ev.x > 520) { idx = (idx + 1) % ids.length; Sound.sfx('cursor'); }

          const nextLearn = Object.keys(def.learn).map(Number).filter((l) => l > m.level).sort((a, b) => a - b)[0];
          if (nextLearn) Text.draw(ctx, `Lv ${nextLearn}: ???`, 440, 174 + Math.min(10, m.skills.length) * 22, { size: 13, color: Theme.dim });
          const lines = Text.layout(ctx, def.bio.replace('주인공', Game.heroName()), 570, 15);
          Text.drawLines(ctx, lines.slice(0, 4), 36, 332, 22, 15, Infinity, { shadow: false });
